name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Final USB Fix

on:
  workflow_dispatch:


permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


    - name: Install build environment
      shell: bash
      run: |
        set -e

        sudo bash -c "$(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)"



    - name: Clone ImmortalWrt
      shell: bash
      run: |
        set -e

        git clone \
          --depth 1 \
          --branch v25.12.2 \
          https://github.com/immortalwrt/immortalwrt.git \
          immortalwrt



    - name: Clone N30 Pro patch
      shell: bash
      run: |
        set -e

        git clone \
          --depth 1 \
          https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
          n30-patch



    - name: Apply N30 Pro patch
      working-directory: immortalwrt
      shell: bash
      run: |
        set -e

        bash ../n30-patch/scripts/apply-netcore-n30pro.sh ../n30-patch




    - name: Verify DTS USB
      working-directory: immortalwrt
      shell: bash
      run: |
        set -e

        DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

        test -f "$DTS"

        grep -q "usb-vbus" "$DTS"

        grep -q "GPIO_ACTIVE_HIGH" "$DTS"

        echo "DTS USB OK"




    - name: Update feeds
      working-directory: immortalwrt
      shell: bash
      run: |
        set -e

        ./scripts/feeds update -a

        ./scripts/feeds install -a





    - name: Generate configuration
      working-directory: immortalwrt
      shell: bash
      run: |
        set -e


        rm -f .config


        echo "CONFIG_TARGET_mediatek=y" >> .config

        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config

        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y" >> .config



        echo "CONFIG_PACKAGE_luci=y" >> .config

        echo "CONFIG_PACKAGE_luci-ssl=y" >> .config



        # USB

        echo "CONFIG_PACKAGE_kmod-usb3=y" >> .config

        echo "CONFIG_PACKAGE_kmod-usb-xhci-hcd=y" >> .config

        echo "CONFIG_PACKAGE_kmod-usb-xhci-mtk=y" >> .config


        echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config

        echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y"



        echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config

        echo "CONFIG_PACKAGE_kmod-fs-vfat=y" >> .config

        echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config



        # 4G/5G

        echo "CONFIG_PACKAGE_kmod-usb-serial=y" >> .config

        echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config

        echo "CONFIG_PACKAGE_kmod-usb-serial-wwan=y" >> .config

        echo "CONFIG_PACKAGE_kmod-usb-wdm=y" >> .config


        echo "CONFIG_PACKAGE_kmod-usb-net=y" >> .config

        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config

        echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config

        echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config


        echo "CONFIG_PACKAGE_usb-modeswitch=y" >> .config

        echo "CONFIG_PACKAGE_usb-modeswitch-data=y"


        echo "CONFIG_PACKAGE_uqmi=y" >> .config

        echo "CONFIG_PACKAGE_umbim=y" >> .config




        # VPN

        echo "CONFIG_PACKAGE_wireguard-tools=y" >> .config

        echo "CONFIG_PACKAGE_kmod-wireguard=y" >> .config

        echo "CONFIG_PACKAGE_openvpn-openssl=y" >> .config



        # TUN

        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config



        # Network

        echo "CONFIG_PACKAGE_curl=y" >> .config

        echo "CONFIG_PACKAGE_wget-ssl=y" >> .config

        echo "CONFIG_PACKAGE_ca-certificates=y" >> .config


        echo "CONFIG_PACKAGE_ip-full=y" >> .config


        make defconfig






    - name: Verify config
      working-directory: immortalwrt
      shell: bash
      run: |
        set -e


        grep "CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y" .config


        grep "CONFIG_PACKAGE_kmod-usb-xhci-mtk=y" .config


        grep "CONFIG_PACKAGE_wireguard-tools=y" .config


        echo "CONFIG OK"






    - name: Download sources
      working-directory: immortalwrt
      shell: bash
      run: |

        set -e

        make download -j4 V=s






    - name: Build firmware
      working-directory: immortalwrt
      shell: bash
      run: |

        set -e

        make -j$(nproc) V=s





    - name: Verify XHCI modules
      working-directory: immortalwrt
      shell: bash
      run: |

        set -e


        test "$(find build_dir -name xhci-hcd.ko | wc -l)" -gt 0


        test "$(find build_dir -name xhci-mtk-hcd.ko | wc -l)" -gt 0


        echo "XHCI OK"






    - name: Verify firmware output
      working-directory: immortalwrt
      shell: bash
      run: |

        set -e


        DIR="bin/targets/mediatek/filogic"


        test -d "$DIR"


        find "$DIR" -type f | grep sysupgrade



    - name: Generate report
      working-directory: immortalwrt
      shell: bash
      run: |

        {

        echo "ImmortalWrt 25.12.2"

        echo "Netcore N30 Pro"

        echo

        echo "XHCI"

        find build_dir -name "xhci*.ko"

        echo

        echo "Firmware"

        find bin/targets/mediatek/filogic -type f

        } > build-report.txt



        cat build-report.txt






    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: ImmortalWrt-25.12.2-Netcore-N30-Pro-USB-Fix

        path: |

          immortalwrt/bin/targets/mediatek/filogic/**

          immortalwrt/build-report.txt


        if-no-files-found: error

        retention-days: 30
