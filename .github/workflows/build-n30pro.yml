name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Final


on:
  workflow_dispatch:


env:
  IMMORTALWRT_TAG: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


    - name: Checkout repository
      uses: actions/checkout@v5



    - name: Install build dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zstd \
          xz-utils \
          file \
          patch



    - name: Clone ImmortalWrt
      run: |

        git clone \
          --depth 1 \
          --branch ${IMMORTALWRT_TAG} \
          https://github.com/immortalwrt/immortalwrt.git \
          immortalwrt



    - name: Clone N30 Pro patch
      run: |

        git clone \
          --depth 1 \
          ${PATCH_REPO} \
          n30pro-patch



    - name: Prepare N30 Pro patch
      run: |

        PATCH=$(find n30pro-patch \
        -name "*.patch" \
        | head -1)


        if [ -z "$PATCH" ]; then

          echo "Patch not found"

          exit 1

        fi



        # 删除 WiFi MAC patch，仅保留 DTS/USB相关修改

        awk '

        /^diff --git/ {

          if(block!="" && skip==0)
            print block


          block=$0 "\n"


          if($0 ~ /11_fix_wifi_mac/)
            skip=1
          else
            skip=0


          next

        }


        {
          block=block $0 "\n"
        }


        END {

          if(block!="" && skip==0)
            print block

        }

        ' "$PATCH" > /tmp/n30pro.patch



    - name: Apply N30 Pro DTS patch
      working-directory: immortalwrt
      run: |

        patch \
        -p1 \
        --forward \
        < /tmp/n30pro.patch



    - name: Verify N30 Pro DTS USB VBUS
      working-directory: immortalwrt
      run: |

        DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"


        test -f "$DTS"


        echo "Checking USB power support"


        grep -q "vbus-supply" "$DTS"


        grep -q "xhci" "$DTS"



    - name: Verify target device
      working-directory: immortalwrt
      run: |

        grep -q \
        "Device/netis_nx30v2" \
        target/linux/mediatek/image/filogic.mk



    - name: Update feeds
      working-directory: immortalwrt
      run: |

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Generate N30 Pro config
      working-directory: immortalwrt
      run: |

        cat > .config <<EOF


CONFIG_TARGET_mediatek=y

CONFIG_TARGET_mediatek_filogic=y

CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netis_nx30v2=y


# LuCI

CONFIG_PACKAGE_luci=y

CONFIG_PACKAGE_luci-ssl=y



# USB3

CONFIG_PACKAGE_kmod-usb3=y


# USB storage

CONFIG_PACKAGE_kmod-usb-storage=y

CONFIG_PACKAGE_kmod-usb-storage-uas=y



# USB network

CONFIG_PACKAGE_kmod-usb-net=y

CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y

CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y

CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y



# USB serial modem

CONFIG_PACKAGE_kmod-usb-serial=y

CONFIG_PACKAGE_kmod-usb-serial-option=y

CONFIG_PACKAGE_kmod-usb-wdm=y



# Modem tools

CONFIG_PACKAGE_usb-modeswitch=y

CONFIG_PACKAGE_usb-modeswitch-data=y

CONFIG_PACKAGE_uqmi=y

CONFIG_PACKAGE_umbim=y



# Multi WAN

CONFIG_PACKAGE_mwan3=y

CONFIG_PACKAGE_luci-app-mwan3=y



# Samba

CONFIG_PACKAGE_samba4-server=y

CONFIG_PACKAGE_luci-app-samba4=y



# VPN tun

CONFIG_PACKAGE_kmod-tun=y



# StarVPN installer environment

CONFIG_PACKAGE_curl=y

CONFIG_PACKAGE_wget-ssl=y

CONFIG_PACKAGE_ca-bundle=y

CONFIG_PACKAGE_ca-certificates=y


EOF



        make olddefconfig



    - name: Verify final config
      working-directory: immortalwrt
      run: |

        echo "===== TARGET ====="

        grep netis .config || true


        echo "===== USB ====="

        grep usb .config | head -50 || true



    - name: Download packages
      working-directory: immortalwrt
      run: |

        make download -j2



    - name: Build firmware
      working-directory: immortalwrt
      run: |

        export TERM=xterm


        make \
        -j1 \
        V=s 2>&1 | tee build.log



        RESULT=${PIPESTATUS[0]}



        if [ "$RESULT" != "0" ]; then


          echo "========== BUILD FAILED =========="


          grep -n "error:" build.log | tail -100 || true


          grep -n "Error [0-9]" build.log | tail -100 || true


          tail -300 build.log


          exit "$RESULT"


        fi



    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4

      with:

        name: build-log

        path: immortalwrt/build.log



    - name: Verify firmware output
      if: success()
      working-directory: immortalwrt
      run: |

        find \
        bin/targets/mediatek/filogic \
        -name "*sysupgrade*"



    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4

      with:

        name: ImmortalWrt-25.12.2-Netcore-N30-Pro

        path: immortalwrt/bin/targets/mediatek/filogic/
