name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Final

on:
  workflow_dispatch:


permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      # ============================================================
      # 1. Install build environment
      # ============================================================

      - name: Install build dependencies

        shell: bash

        run: |

          set -e

          sudo bash -c \
          'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'



      # ============================================================
      # 2. Clone ImmortalWrt 25.12.2
      # ============================================================

      - name: Clone ImmortalWrt 25.12.2


        shell: bash


        run: |


          set -e


          git clone \
            --depth 1 \
            --branch v25.12.2 \
            --single-branch \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt



          cd immortalwrt



          echo "ImmortalWrt version:"


          git describe --tags --always || true


          echo "Commit:"


          git rev-parse HEAD





      # ============================================================
      # 3. Clone N30 Pro adaptation
      # ============================================================

      - name: Clone Netcore N30 Pro patch


        shell: bash


        run: |


          set -e


          git clone \
            --depth 1 \
            --single-branch \
            https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
            n30-patch



          echo "N30 patch ready"





      # ============================================================
      # 4. Apply N30 Pro adaptation
      # ============================================================

      - name: Apply N30 Pro patch


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e


          bash ../n30-patch/scripts/apply-netcore-n30pro.sh \
          ../n30-patch





      # ============================================================
      # 5. Verify DTS USB VBUS
      # ============================================================

      - name: Verify USB VBUS DTS


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"



          test -f "$DTS"



          echo "Checking USB VBUS"



          grep -Fq \
          'regulator-name = "usb-vbus";' \
          "$DTS"



          grep -Fq \
          'gpio = <&pio 23 GPIO_ACTIVE_HIGH>;' \
          "$DTS"



          grep -Fq \
          'regulator-min-microvolt = <5000000>;' \
          "$DTS"



          grep -Fq \
          'regulator-max-microvolt = <5000000>;' \
          "$DTS"



          grep -Fq \
          'regulator-boot-on;' \
          "$DTS"



          echo "USB VBUS verification passed"





      # ============================================================
      # 6. Verify USB PHY
      # ============================================================

      - name: Verify USB PHY


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"



          echo "Checking USB PHY"



          grep -A10 \
          '&usb_phy' \
          "$DTS"



          grep -A10 \
          '&usb_phy' \
          "$DTS" \
          | grep -Fq \
          'status = "okay";'



          echo "USB PHY verification passed"





      # ============================================================
      # 7. Verify xHCI controller
      # ============================================================

      - name: Verify xHCI DTS


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"



          echo "Checking xHCI"



          grep -A15 \
          '&xhci' \
          "$DTS"



          grep -A15 \
          '&xhci' \
          "$DTS" \
          | grep -Fq \
          'vbus-supply = <&usb_vbus>;'


          grep -A15 \
          '&xhci' \
          "$DTS" \
          | grep -Fq \
          'status = "okay";'



          echo "xHCI verification passed"





      # ============================================================
      # 8. Update feeds
      # ============================================================

      - name: Update ImmortalWrt feeds


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e


          ./scripts/feeds update -a


          ./scripts/feeds install -a

      # ============================================================
      # 9. Configure firmware packages
      # ============================================================

      - name: Configure N30 Pro packages


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "Configure target"



          ./scripts/config set \
          CONFIG_TARGET_mediatek=y



          ./scripts/config set \
          CONFIG_TARGET_mediatek_filogic=y



          ./scripts/config set \
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y





          # ========================================================
          # LuCI
          # ========================================================


          ./scripts/config set \
          CONFIG_PACKAGE_luci=y



          ./scripts/config set \
          CONFIG_PACKAGE_luci-ssl=y





          # ========================================================
          # USB 3.0 + XHCI
          # ========================================================


          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb3=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-core=y





          # ========================================================
          # USB Storage
          # ========================================================


          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-storage=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-storage-uas=y



          ./scripts/config set \
          CONFIG_PACKAGE_block-mount=y



          ./scripts/config set \
          CONFIG_PACKAGE_blockd=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-fs-ext4=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-fs-vfat=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-fs-exfat=y





          # ========================================================
          # USB 4G / 5G modem
          # ========================================================


          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-serial=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-serial-option=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-wdm=y



          ./scripts/config set \
          CONFIG_PACKAGE_usb-modeswitch=y



          ./scripts/config set \
          CONFIG_PACKAGE_uqmi=y



          ./scripts/config set \
          CONFIG_PACKAGE_umbim=y





          # ========================================================
          # MWAN3 Load Balance
          # ========================================================


          ./scripts/config set \
          CONFIG_PACKAGE_mwan3=y



          ./scripts/config set \
          CONFIG_PACKAGE_luci-app-mwan3=y





          # ========================================================
          # Samba4
          # ========================================================


          ./scripts/config set \
          CONFIG_PACKAGE_samba4-server=y



          ./scripts/config set \
          CONFIG_PACKAGE_samba4-utils=y



          ./scripts/config set \
          CONFIG_PACKAGE_luci-app-samba4=y





          # ========================================================
          # Network tools
          # ========================================================


          ./scripts/config set \
          CONFIG_PACKAGE_curl=y



          ./scripts/config set \
          CONFIG_PACKAGE_wget-ssl=y



          ./scripts/config set \
          CONFIG_PACKAGE_tcpdump=y



          ./scripts/config set \
          CONFIG_PACKAGE_htop=y





          make defconfig



          echo "Package configuration completed"





      # ============================================================
      # 10. Verify configuration
      # ============================================================

      - name: Verify package configuration


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "Verify configuration"



          grep -F \
          "CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y" \
          .config



          grep -F \
          "CONFIG_PACKAGE_kmod-usb3=y" \
          .config



          grep -F \
          "CONFIG_PACKAGE_kmod-usb-xhci-mtk=y" \
          .config



          grep -F \
          "CONFIG_PACKAGE_mwan3=y" \
          .config



          grep -F \
          "CONFIG_PACKAGE_samba4-server=y" \
          .config



          echo "Configuration verification passed"





      # ============================================================
      # 11. Add custom IPK packages
      #
      # 星空组网等第三方IPK
      #
      # 放入 files:
      #
      # /usr/share/custom-packages/
      #
      # 不参与feeds
      #
      # ============================================================


      - name: Add custom IPK packages


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          mkdir -p \
          files/usr/share/custom-packages



          if [ -d ../custom_packages ]; then


            cp \
            ../custom_packages/*.ipk \
            files/usr/share/custom-packages/ \
            2>/dev/null \
            || true


          fi



          echo "Custom IPK injection finished"





      # ============================================================
      # 12. Download sources
      # ============================================================


      - name: Download build sources


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e


          make download \
          -j$(nproc) \
          V=s

      # ============================================================
      # 13. Build firmware
      # ============================================================

      - name: Build firmware


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "================================"

          echo "Start compiling ImmortalWrt"

          echo "================================"



          make -j$(nproc) V=s





      # ============================================================
      # 14. Verify XHCI kernel modules
      # ============================================================

      - name: Verify XHCI modules


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "Checking xhci-hcd"



          XHCI_HCD=$(find \
          build_dir \
          -name "xhci-hcd.ko" \
          | wc -l)



          echo "xhci-hcd count: $XHCI_HCD"





          echo "Checking xhci-mtk"



          XHCI_MTK=$(find \
          build_dir \
          -name "xhci-mtk-hcd.ko" \
          | wc -l)



          echo "xhci-mtk count: $XHCI_MTK"





          if [ "$XHCI_HCD" -eq 0 ]; then


            echo "ERROR: xhci-hcd.ko missing"


            exit 1


          fi





          if [ "$XHCI_MTK" -eq 0 ]; then


            echo "ERROR: xhci-mtk-hcd.ko missing"


            exit 1


          fi





          echo "XHCI kernel module verification passed"





      # ============================================================
      # 15. Verify root filesystem modules
      # ============================================================

      - name: Verify rootfs USB modules


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "Checking generated rootfs"



          ROOT_XHCI=$(find \
          build_dir \
          -path "*/root-*/lib/modules/*" \
          -name "xhci-hcd.ko" \
          | wc -l)



          ROOT_MTK=$(find \
          build_dir \
          -path "*/root-*/lib/modules/*" \
          -name "xhci-mtk-hcd.ko" \
          | wc -l)





          echo "rootfs xhci-hcd:"
          echo "$ROOT_XHCI"



          echo "rootfs xhci-mtk:"
          echo "$ROOT_MTK"





          if [ "$ROOT_XHCI" -eq 0 ]; then


            echo "ERROR: rootfs missing xhci-hcd"


            exit 1


          fi





          if [ "$ROOT_MTK" -eq 0 ]; then


            echo "ERROR: rootfs missing xhci-mtk"


            exit 1


          fi





          echo "Rootfs USB verification passed"





      # ============================================================
      # 16. Generate package index
      #
      # ImmortalWrt 25.12 apk package support
      #
      # ============================================================

      - name: Generate package index


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          make package/index



          echo "Package index generated"





      # ============================================================
      # 17. Verify firmware output
      # ============================================================

      - name: Verify firmware images


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          TARGET="bin/targets/mediatek/filogic"



          test -d "$TARGET"



          echo "Firmware files:"



          find "$TARGET" \
          -maxdepth 2 \
          -type f \
          | sort





      # ============================================================
      # 18. Generate build report
      # ============================================================

      - name: Generate build report


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "ImmortalWrt 25.12.2" \
          > n30pro-build-report.txt



          echo "Device: Netcore N30 Pro" \
          >> n30pro-build-report.txt



          echo "USB Fix: GPIO23 VBUS" \
          >> n30pro-build-report.txt



          echo "Controller: MediaTek XHCI" \
          >> n30pro-build-report.txt



          echo "Packages:" \
          >> n30pro-build-report.txt



          grep \
          '^CONFIG_PACKAGE_kmod-usb' \
          .config \
          >> n30pro-build-report.txt \
          || true



          grep \
          '^CONFIG_PACKAGE_mwan3' \
          .config \
          >> n30pro-build-report.txt \
          || true



          grep \
          '^CONFIG_PACKAGE_samba4' \
          .config \
          >> n30pro-build-report.txt \
          || true





          cat n30pro-build-report.txt





      # ============================================================
      # 19. Upload firmware
      # ============================================================

      - name: Upload firmware


        uses: actions/upload-artifact@v4


        with:


          name: ImmortalWrt-25.12.2-Netcore-N30-Pro-Final


          path: |


            immortalwrt/bin/targets/mediatek/filogic/**


            immortalwrt/n30pro-build-report.txt


          if-no-files-found: error


          retention-days: 7
