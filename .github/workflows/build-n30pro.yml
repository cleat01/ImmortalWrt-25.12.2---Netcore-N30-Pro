name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Final

"on":
  workflow_dispatch:

permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      # ============================================================
      # 1. Install build environment
      # ============================================================

      - name: Install build dependencies

        shell: bash

        run: |

          set -e

          sudo bash -c \
          'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'



      # ============================================================
      # 2. Clone ImmortalWrt 25.12.2
      # ============================================================

      - name: Clone ImmortalWrt 25.12.2

        shell: bash

        run: |

          set -e


          git clone \
            --depth 1 \
            --branch v25.12.2 \
            --single-branch \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt


          cd immortalwrt


          echo "ImmortalWrt version"

          git describe --tags --always || true


          git rev-parse HEAD





      # ============================================================
      # 3. Clone Netcore N30 Pro USB Fix
      # ============================================================

      - name: Clone N30 Pro patch


        shell: bash


        run: |


          set -e


          git clone \
            --depth 1 \
            --single-branch \
            https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
            n30-patch





      # ============================================================
      # 4. Apply N30 Pro adaptation
      # ============================================================

      - name: Apply N30 Pro USB VBUS fix


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e


          bash ../n30-patch/scripts/apply-netcore-n30pro.sh \
          ../n30-patch





      # ============================================================
      # 5. Verify DTS USB VBUS
      # ============================================================

      - name: Verify N30 Pro DTS


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"



          test -f "$DTS"



          grep -Fq \
          'gpio = <&pio 23 GPIO_ACTIVE_HIGH>;' \
          "$DTS"



          grep -Fq \
          'regulator-name = "usb-vbus";' \
          "$DTS"



          grep -Fq \
          'regulator-boot-on;' \
          "$DTS"



          grep -Fq \
          'regulator-min-microvolt = <5000000>;' \
          "$DTS"



          grep -Fq \
          'regulator-max-microvolt = <5000000>;' \
          "$DTS"



          echo "USB VBUS fix verified"





      # ============================================================
      # 6. Verify XHCI
      # ============================================================

      - name: Verify XHCI DTS


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e


          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"



          grep -A12 \
          '&xhci' \
          "$DTS"



          grep -A12 \
          '&xhci' \
          "$DTS" \
          | grep -Fq \
          'vbus-supply = <&usb_vbus>;'


          grep -A12 \
          '&xhci' \
          "$DTS" \
          | grep -Fq \
          'status = "okay";'





      # ============================================================
      # 7. Update feeds
      # ============================================================

      - name: Update feeds


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e


          ./scripts/feeds update -a


          ./scripts/feeds install -a





      # ============================================================
      # 8. Add PassWall feed
      #
      # 使用 feeds.conf.default
      # 不直接 clone
      # 避免 GitHub authentication 错误
      # ============================================================


      - name: Add PassWall feed


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo \
          'src-git passwall https://github.com/xiaorouji/openwrt-passwall.git' \
          >> feeds.conf.default



          ./scripts/feeds update passwall


          ./scripts/feeds install -a -p passwall

      # ============================================================
      # 9. Prepare custom packages
      #
      # 星空组网 IPK:
      #
      # 放置于仓库:
      #
      # custom_packages/*.ipk
      #
      # ============================================================


      - name: Prepare custom IPK packages


        shell: bash


        run: |


          set -e


          mkdir -p immortalwrt/package/custom



          if [ -d custom_packages ]; then


            cp \
            custom_packages/*.ipk \
            immortalwrt/package/custom/ \
            2>/dev/null \
            || true


          fi



          echo "Custom packages prepared"





      # ============================================================
      # 10. Configure target and packages
      #
      # 使用 scripts/config
      # 不覆盖原始配置
      #
      # ============================================================


      - name: Configure N30 Pro firmware


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          ./scripts/config set \
          CONFIG_TARGET_mediatek=y



          ./scripts/config set \
          CONFIG_TARGET_mediatek_filogic=y



          ./scripts/config set \
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y





          # ============================
          # LuCI
          # ============================


          ./scripts/config set \
          CONFIG_PACKAGE_luci=y



          ./scripts/config set \
          CONFIG_PACKAGE_luci-ssl=y





          # ============================
          # USB 3.0
          # ============================


          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb3=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-storage=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-storage-uas=y





          # ============================
          # USB filesystem
          # ============================


          ./scripts/config set \
          CONFIG_PACKAGE_kmod-fs-ext4=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-fs-vfat=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-fs-exfat=y





          # ============================
          # 4G / 5G USB modem
          # ============================


          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-serial=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-serial-option=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-wdm=y



          ./scripts/config set \
          CONFIG_PACKAGE_usb-modeswitch=y



          ./scripts/config set \
          CONFIG_PACKAGE_uqmi=y



          ./scripts/config set \
          CONFIG_PACKAGE_umbim=y





          # ============================
          # MWAN3 负载均衡
          # ============================


          ./scripts/config set \
          CONFIG_PACKAGE_mwan3=y



          ./scripts/config set \
          CONFIG_PACKAGE_luci-app-mwan3=y





          # ============================
          # Samba4
          # ============================


          ./scripts/config set \
          CONFIG_PACKAGE_samba4-server=y



          ./scripts/config set \
          CONFIG_PACKAGE_samba4-utils=y



          ./scripts/config set \
          CONFIG_PACKAGE_luci-app-samba4=y





          # ============================
          # PassWall
          # ============================


          ./scripts/config set \
          CONFIG_PACKAGE_luci-app-passwall=y



          ./scripts/config set \
          CONFIG_PACKAGE_xray-core=y



          ./scripts/config set \
          CONFIG_PACKAGE_sing-box=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-tun=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-nft-tproxy=y





          # ============================
          # 自动挂载
          # ============================


          ./scripts/config set \
          CONFIG_PACKAGE_block-mount=y



          ./scripts/config set \
          CONFIG_PACKAGE_blockd=y



          make defconfig



          echo "N30 Pro configuration finished"





      # ============================================================
      # 11. Verify final config
      # ============================================================


      - name: Verify final configuration


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          grep -Fq \
          CONFIG_TARGET_mediatek=y \
          .config



          grep -Fq \
          CONFIG_TARGET_mediatek_filogic=y \
          .config



          grep -Fq \
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y \
          .config



          grep -Fq \
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y \
          .config



          grep -Fq \
          CONFIG_PACKAGE_mwan3=y \
          .config



          grep -Fq \
          CONFIG_PACKAGE_samba4-server=y \
          .config



          grep -Fq \
          CONFIG_PACKAGE_luci-app-passwall=y \
          .config



          echo "Configuration verification passed"





      # ============================================================
      # 12. Download source packages
      # ============================================================


      - name: Download sources


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e


          make download -j$(nproc) V=s

      # ============================================================
      # 13. Compile firmware
      # ============================================================


      - name: Build firmware


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "========================================"

          echo "Start ImmortalWrt build"

          echo "========================================"



          make -j$(nproc) V=s





      # ============================================================
      # 14. Generate package indexes
      #
      # 解决：
      # apk install 时提示依赖不存在
      #
      # ============================================================


      - name: Generate package indexes


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          make package/index



          echo "Package indexes generated"





      # ============================================================
      # 15. Verify XHCI kernel modules
      # ============================================================


      - name: Verify XHCI modules


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "Checking XHCI modules"



          find build_dir \
          -name "xhci-hcd.ko" \
          -o \
          -name "xhci-mtk-hcd.ko"



          HCD=$(find build_dir -name "xhci-hcd.ko" | wc -l)


          MTK=$(find build_dir -name "xhci-mtk-hcd.ko" | wc -l)



          if [ "$HCD" -eq 0 ]; then

            echo "ERROR: xhci-hcd.ko missing"

            exit 1

          fi



          if [ "$MTK" -eq 0 ]; then

            echo "ERROR: xhci-mtk-hcd.ko missing"

            exit 1

          fi



          echo "XHCI verification passed"





      # ============================================================
      # 16. Verify firmware output
      # ============================================================


      - name: Verify firmware


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          TARGET="bin/targets/mediatek/filogic"



          test -d "$TARGET"



          echo "Generated firmware files:"



          find "$TARGET" \
          -maxdepth 2 \
          -type f \
          | sort





      # ============================================================
      # 17. Upload firmware and packages
      # ============================================================


      - name: Upload firmware


        uses: actions/upload-artifact@v4


        with:


          name: ImmortalWrt-25.12.2-Netcore-N30-Pro-Final


          path: |


            immortalwrt/bin/targets/mediatek/filogic/**


            immortalwrt/bin/packages/**



          retention-days: 7
