name: Build ImmortalWrt 25.12.2 - Netcore N30 Pro Full

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTALWRT_REF: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git
  PATCH_COMMIT: 3e8191985f48b785f47d184a402a6754a663f393

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout build repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            device-tree-compiler \
            qemu-utils \
            ccache \
            time

      # ============================================================
      # 3. Clone exact ImmortalWrt release
      # ============================================================
      - name: Clone ImmortalWrt 25.12.2
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${IMMORTALWRT_REF}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo "===== ImmortalWrt ====="
          git rev-parse HEAD
          git describe --tags --always || true

      # ============================================================
      # 4. Clone exact N30 Pro patch repository
      # ============================================================
      - name: Clone exact Netcore N30 Pro patch
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            "${PATCH_REPO}" \
            Netcore-N30-Pro-patch-for-OpenWrt

          cd Netcore-N30-Pro-patch-for-OpenWrt

          git checkout "${PATCH_COMMIT}"

          echo "===== Patch repository revision ====="
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "${PATCH_COMMIT}"

          echo "===== Patch files ====="
          find patches scripts -maxdepth 2 -type f -print

      # ============================================================
      # 5. Apply N30 Pro adaptation
      # ============================================================
      - name: Apply Netcore N30 Pro adaptation
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          test -f \
            ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh

          test -f \
            ../Netcore-N30-Pro-patch-for-OpenWrt/patches/0001-Add-Netcore-N30-Pro-support.patch

          bash \
            ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh \
            ../Netcore-N30-Pro-patch-for-OpenWrt

          echo
          echo "===== Verify N30 Pro adaptation ====="

          test -f \
            target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts

          grep -Fq \
            'define Device/netcore_n30-pro' \
            target/linux/mediatek/image/filogic.mk

          grep -Fq \
            'TARGET_DEVICES += netcore_n30-pro' \
            target/linux/mediatek/image/filogic.mk

          grep -Fq \
            'netcore,n30-pro' \
            target/linux/mediatek/filogic/base-files/etc/board.d/02_network

          grep -Fq \
            'netcore,n30-pro' \
            target/linux/mediatek/filogic/base-files/etc/hotplug.d/ieee80211/11_fix_wifi_mac

          echo "[PASS] N30 Pro adaptation is present."

          git diff --check

      # ============================================================
      # 6. Verify USB VBUS DTS
      # ============================================================
      - name: Verify N30 Pro USB VBUS DTS
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          DTS_FILE="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

          test -f "$DTS_FILE"

          echo "===== N30 Pro USB VBUS configuration ====="

          grep -Fq \
            'usb_vbus: regulator-usb-vbus' \
            "$DTS_FILE"

          grep -Fq \
            'compatible = "regulator-fixed"' \
            "$DTS_FILE"

          grep -Fq \
            'regulator-name = "usb-vbus"' \
            "$DTS_FILE"

          grep -Fq \
            'regulator-min-microvolt = <5000000>' \
            "$DTS_FILE"

          grep -Fq \
            'regulator-max-microvolt = <5000000>' \
            "$DTS_FILE"

          grep -Fq \
            'gpio = <&pio 23 GPIO_ACTIVE_HIGH>' \
            "$DTS_FILE"

          grep -Fq \
            'enable-active-high' \
            "$DTS_FILE"

          grep -Fq \
            'regulator-boot-on' \
            "$DTS_FILE"

          grep -Fq \
            'vbus-supply = <&usb_vbus>' \
            "$DTS_FILE"

          echo "[PASS] USB VBUS GPIO23 / 5V configuration is present."

      # ============================================================
      # 7. Update / install feeds
      # ============================================================
      - name: Update and install ImmortalWrt feeds
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 8. Create helper functions
      #
      # IMPORTANT:
      # Do not use scripts/feeds search for kmod-*.
      # The authoritative source is the generated Kconfig metadata.
      # ============================================================
      - name: Prepare Kconfig verification helpers
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          cat > /tmp/kconfig-check.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail

          TARGET_DB="tmp/.config-target.in"
          PACKAGE_DB="tmp/.config-package.in"

          require_target_symbol() {
              local sym="$1"

              if grep -Fxq "config ${sym}" "$TARGET_DB"; then
                  echo "[FOUND TARGET SYMBOL] ${sym}"
              else
                  echo "[MISSING TARGET SYMBOL] ${sym}"
                  return 1
              fi
          }

          require_package_symbol() {
              local sym="$1"

              if grep -Fxq "config ${sym}" "$PACKAGE_DB"; then
                  echo "[FOUND PACKAGE SYMBOL] ${sym}"
              else
                  echo "[MISSING PACKAGE SYMBOL] ${sym}"
                  return 1
              fi
          }

          enable_symbol_y() {
              local sym="$1"
              echo "${sym}=y"
          }
          EOF

          chmod +x /tmp/kconfig-check.sh

      # ============================================================
      # 9. FIRST defconfig:
      #
      # Select the single N30 Pro profile FIRST.
      #
      # Correct symbol:
      # CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y
      #
      # NOT:
      # CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n30-pro=y
      #
      # The latter belongs to multi-profile mode.
      # ============================================================
      - name: Select exact N30 Pro target
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y
          # CONFIG_TARGET_MULTI_PROFILE is not set
          EOF

          make defconfig

          echo
          echo "========================================"
          echo "N30 Pro target Kconfig verification"
          echo "========================================"

          test -f tmp/.config-target.in
          test -f tmp/.config-package.in

          echo
          echo "===== Target symbol definition ====="

          grep -n -F \
            'config TARGET_mediatek_filogic_DEVICE_netcore_n30-pro' \
            tmp/.config-target.in

          echo
          echo "===== Final target configuration ====="

          grep -E \
            '^CONFIG_TARGET_(mediatek|TARGET|ROOTFS|ARCH)' \
            .config || true

          echo
          echo "===== Required target symbols ====="

          grep -q \
            '^CONFIG_TARGET_mediatek=y$' \
            .config

          grep -q \
            '^CONFIG_TARGET_mediatek_filogic=y$' \
            .config

          grep -q \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_netcore-n30-pro=y$' \
            .config && {
              echo "[ERROR] Unexpected target symbol with hyphen normalization."
              exit 1
            } || true

          grep -q \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y$' \
            .config || {
              echo
              echo "[ERROR] N30 Pro target was not retained."
              echo
              echo "===== Matching target symbols ====="
              grep -E \
                '^CONFIG_TARGET_(medIATEK|mediatek)' \
                .config || true
              exit 1
            }

          echo "[PASS] N30 Pro target selected in single-profile mode."

      # ============================================================
      # 10. Verify required package symbols BEFORE enabling them
      # ============================================================
      - name: Verify required package symbols exist
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          source /tmp/kconfig-check.sh

          echo "========================================"
          echo "Required userspace package symbols"
          echo "========================================"

          REQUIRED_USERSPACE_SYMBOLS="
          PACKAGE_luci
          PACKAGE_luci-app-passwall
          PACKAGE_mwan3
          PACKAGE_luci-app-mwan3
          PACKAGE_samba4-server
          PACKAGE_luci-app-samba4
          PACKAGE_uqmi
          PACKAGE_umbim
          "

          for sym in $REQUIRED_USERSPACE_SYMBOLS; do
              require_package_symbol "$sym"
          done

          echo
          echo "========================================"
          echo "Required KernelPackage symbols"
          echo "========================================"

          REQUIRED_KERNEL_SYMBOLS="
          PACKAGE_kmod-usb-core
          PACKAGE_kmod-usb3
          PACKAGE_kmod-usb-xhci-hcd
          PACKAGE_kmod-usb-xhci-mtk
          PACKAGE_kmod-nft-socket
          PACKAGE_kmod-nft-tproxy
          PACKAGE_kmod-nft-nat
          PACKAGE_kmod-nf-reject
          PACKAGE_kmod-nf-reject6
          PACKAGE_kmod-usb-net
          PACKAGE_kmod-usb-net-cdc-ether
          PACKAGE_kmod-usb-net-cdc-ncm
          PACKAGE_kmod-usb-net-rndis
          PACKAGE_kmod-usb-wdm
          PACKAGE_kmod-usb-net-qmi-wwan
          PACKAGE_kmod-usb-net-cdc-mbim
          PACKAGE_kmod-usb-serial
          PACKAGE_kmod-usb-serial-option
          PACKAGE_kmod-usb-serial-wwan
          PACKAGE_kmod-usb-acm
          PACKAGE_kmod-usb-storage
          PACKAGE_kmod-usb-storage-uas
          PACKAGE_kmod-fs-ext4
          PACKAGE_kmod-fs-vfat
          "

          for sym in $REQUIRED_KERNEL_SYMBOLS; do
              require_package_symbol "$sym"
          done

          echo
          echo "========================================"
          echo "PassWall nftables configuration symbol"
          echo "========================================"

          require_package_symbol \
            "PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy"

          echo
          echo "[PASS] All required Kconfig symbols exist."

      # ============================================================
      # 11. Configure required userspace packages and kernel packages
      # ============================================================
      - name: Configure required packages
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          cat >> .config <<'EOF'

          # ========================================================
          # LuCI
          # ========================================================
          CONFIG_PACKAGE_luci=y

          # ========================================================
          # PassWall
          # ========================================================
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y

          # ========================================================
          # MWAN3
          # ========================================================
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y

          # ========================================================
          # Samba4
          # ========================================================
          CONFIG_PACKAGE_samba4-server=y
          CONFIG_PACKAGE_luci-app-samba4=y

          # ========================================================
          # USB 3 / XHCI
          # ========================================================
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y

          # ========================================================
          # USB 4G / 5G modem
          # ========================================================
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y

          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-acm=y

          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y

          # ========================================================
          # USB storage
          # ========================================================
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y

          # ========================================================
          # PassWall nftables transparent proxy kernel modules
          # ========================================================
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y
          EOF

      # ============================================================
      # 12. Enable optional packages only when symbols exist
      # ============================================================
      - name: Enable optional modem and PassWall packages
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          PACKAGE_DB="tmp/.config-package.in"

          package_exists() {
              local pkg="$1"
              grep -Fxq "config PACKAGE_${pkg}" "$PACKAGE_DB"
          }

          echo
          echo "===== Optional USB packages ====="

          OPTIONAL_USB_PACKAGES="
          usbutils
          usb-modeswitch
          luci-proto-qmi
          luci-proto-mbim
          luci-proto-ncm
          kmod-usb-storage-extras
          kmod-fs-ntfs3
          "

          for pkg in $OPTIONAL_USB_PACKAGES; do
              if package_exists "$pkg"; then
                  echo "CONFIG_PACKAGE_${pkg}=y" >> .config
                  echo "[ENABLED] ${pkg}"
              else
                  echo "[SKIPPED] ${pkg}"
              fi
          done

          echo
          echo "===== Optional PassWall cores ====="

          OPTIONAL_PASSWALL_PACKAGES="
          geoview
          haproxy
          shadowsocks-rust-sslocal
          shadowsocksr-libev-ssr-local
          shadowsocksr-libev-ssr-redir
          simple-obfs-client
          sing-box
          v2ray-plugin
          xray-core
          unzip
          "

          for pkg in $OPTIONAL_PASSWALL_PACKAGES; do
              if package_exists "$pkg"; then
                  echo "CONFIG_PACKAGE_${pkg}=y" >> .config
                  echo "[ENABLED] ${pkg}"
              else
                  echo "[SKIPPED] ${pkg}"
              fi
          done

          # These two are considered the preferred minimum PassWall cores.
          for pkg in xray-core sing-box; do
              if package_exists "$pkg"; then
                  echo "[PASS] Preferred PassWall core available: ${pkg}"
              else
                  echo "[WARNING] Preferred PassWall core missing: ${pkg}"
              fi
          done

          make defconfig

      # ============================================================
      # 13. Strict final configuration verification
      # ============================================================
      - name: Verify final configuration
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "FINAL CONFIGURATION VERIFICATION"
          echo "========================================"

          echo
          echo "===== Target ====="

          grep -E \
            '^CONFIG_TARGET_(mediatek|ROOTFS|ARCH)' \
            .config || true

          grep -q \
            '^CONFIG_TARGET_mediatek=y$' \
            .config

          grep -q \
            '^CONFIG_TARGET_mediatek_filogic=y$' \
            .config

          grep -q \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y$' \
            .config || {
              echo
              echo "[ERROR] N30 Pro target configuration was not retained."
              exit 1
            }

          if grep -q \
            '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n30-pro=y$' \
            .config; then
              echo
              echo "[ERROR] Multi-profile symbol unexpectedly enabled."
              exit 1
          fi

          echo "[PASS] Exact N30 Pro single-profile target."

          echo
          echo "===== Required userspace ====="

          REQUIRED_USERSPACE_CONFIG="
          CONFIG_PACKAGE_luci
          CONFIG_PACKAGE_luci-app-passwall
          CONFIG_PACKAGE_mwan3
          CONFIG_PACKAGE_luci-app-mwan3
          CONFIG_PACKAGE_samba4-server
          CONFIG_PACKAGE_luci-app-samba4
          CONFIG_PACKAGE_uqmi
          CONFIG_PACKAGE_umbim
          "

          for cfg in $REQUIRED_USERSPACE_CONFIG; do
              if grep -q "^${cfg}=y$" .config; then
                  echo "[PASS] ${cfg}=y"
              else
                  echo "[ERROR] Missing ${cfg}=y"
                  exit 1
              fi
          done

          echo
          echo "===== Required KernelPackages ====="

          REQUIRED_KERNEL_CONFIG="
          CONFIG_PACKAGE_kmod-usb-core
          CONFIG_PACKAGE_kmod-usb3
          CONFIG_PACKAGE_kmod-usb-xhci-hcd
          CONFIG_PACKAGE_kmod-usb-xhci-mtk
          CONFIG_PACKAGE_kmod-nft-socket
          CONFIG_PACKAGE_kmod-nft-tproxy
          CONFIG_PACKAGE_kmod-nft-nat
          CONFIG_PACKAGE_kmod-nf-reject
          CONFIG_PACKAGE_kmod-nf-reject6
          CONFIG_PACKAGE_kmod-usb-net
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm
          CONFIG_PACKAGE_kmod-usb-net-rndis
          CONFIG_PACKAGE_kmod-usb-wdm
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim
          CONFIG_PACKAGE_kmod-usb-serial
          CONFIG_PACKAGE_kmod-usb-serial-option
          CONFIG_PACKAGE_kmod-usb-serial-wwan
          CONFIG_PACKAGE_kmod-usb-acm
          CONFIG_PACKAGE_kmod-usb-storage
          CONFIG_PACKAGE_kmod-usb-storage-uas
          CONFIG_PACKAGE_kmod-fs-ext4
          CONFIG_PACKAGE_kmod-fs-vfat
          "

          for cfg in $REQUIRED_KERNEL_CONFIG; do
              if grep -q "^${cfg}=y$" .config; then
                  echo "[PASS] ${cfg}=y"
              else
                  echo "[ERROR] Missing ${cfg}=y"
                  echo
                  grep -E \
                    '^CONFIG_PACKAGE_kmod-(usb|nft|nf-reject)' \
                    .config || true
                  exit 1
              fi
          done

          echo
          echo "===== PassWall nftables option ====="

          grep -q \
            '^CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y$' \
            .config || {
              echo "[ERROR] PassWall nftables transparent proxy option missing."
              exit 1
            }

          echo "[PASS] PassWall nftables transparent proxy enabled."

          echo
          echo "===== Selected PassWall cores ====="

          grep -E \
            '^CONFIG_PACKAGE_(xray-core|sing-box|shadowsocks-rust-sslocal|geoview|haproxy|simple-obfs-client|v2ray-plugin|shadowsocksr-libev)' \
            .config || true

          echo
          echo "===== Target profile symbols ====="

          grep -E \
            '^CONFIG_TARGET_(DEVICE_)?medIATEK_filogic|^CONFIG_TARGET_mediatek_filogic' \
            .config || true

          echo
          echo "[PASS] Final .config verification completed."

      # ============================================================
      # 14. Verify Samba ACL before compilation
      # ============================================================
      - name: Verify Samba4 security ACL
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "Samba4 ACL security verification"
          echo "========================================"

          python3 <<'PY'
          import json
          import pathlib
          import sys

          roots = [
              pathlib.Path("feeds"),
              pathlib.Path("package"),
          ]

          checked = 0
          dangerous = []

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*.json"):
                  name = path.name.lower()

                  if "samba4" not in name:
                      continue

                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                  except Exception:
                      continue

                  checked += 1

                  read_acl = data.get("read", {})
                  file_acl = read_acl.get("file", {})

                  perms = file_acl.get("/usr/sbin/smbd", [])

                  if isinstance(perms, list) and "exec" in perms:
                      dangerous.append((str(path), perms))

          print(f"Checked Samba4 ACL JSON files: {checked}")

          if dangerous:
              print()
              print("DANGEROUS SAMBA4 ACL DETECTED")
              for path, perms in dangerous:
                  print(f"File: {path}")
                  print(f"Permissions: {perms}")
              sys.exit(1)

          print("[PASS] No Samba4 read ACL granting exec to /usr/sbin/smbd was found.")
          PY

      # ============================================================
      # 15. Download all sources
      # ============================================================
      - name: Download source archives
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          make download -j"$(nproc)" V=s

      # ============================================================
      # 16. Build
      # ============================================================
      - name: Build ImmortalWrt
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          echo "========================================"
          echo "START BUILD"
          echo "========================================"

          START_TIME="$(date +%s)"

          make -j"$(nproc)" V=s

          END_TIME="$(date +%s)"
          BUILD_TIME="$((END_TIME - START_TIME))"

          echo
          echo "========================================"
          echo "BUILD FINISHED"
          echo "Build time: ${BUILD_TIME} seconds"
          echo "========================================"

      # ============================================================
      # 17. Verify generated kernel modules
      # ============================================================
      - name: Verify generated KernelPackages
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "GENERATED KERNEL PACKAGE VERIFICATION"
          echo "========================================"

          REQUIRED_KERNEL_APKS="
          kmod-usb3
          kmod-usb-xhci-hcd
          kmod-usb-xhci-mtk
          kmod-nft-socket
          kmod-nft-tproxy
          kmod-nft-nat
          kmod-nf-reject
          kmod-nf-reject6
          kmod-usb-net-cdc-ether
          kmod-usb-net-cdc-ncm
          kmod-usb-net-rndis
          kmod-usb-wdm
          kmod-usb-net-qmi-wwan
          kmod-usb-net-cdc-mbim
          kmod-usb-serial-option
          kmod-usb-serial-wwan
          "

          for pkg in $REQUIRED_KERNEL_APKS; do
              file="$(
                find bin/packages \
                  -type f \
                  -name "${pkg}-*.apk" \
                  -print -quit
              )"

              if [ -n "$file" ]; then
                  echo "[PASS] ${pkg}"
                  echo "       ${file}"
              else
                  echo "[ERROR] Generated KernelPackage missing: ${pkg}"
                  exit 1
              fi
          done

      # ============================================================
      # 18. Verify generated userspace packages
      # ============================================================
      - name: Verify generated userspace APKs
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "GENERATED USERSPACE PACKAGE VERIFICATION"
          echo "========================================"

          REQUIRED_APKS="
          luci-app-passwall
          mwan3
          luci-app-mwan3
          samba4-server
          luci-app-samba4
          uqmi
          umbim
          "

          for pkg in $REQUIRED_APKS; do
              file="$(
                find bin/packages \
                  -type f \
                  -name "${pkg}-*.apk" \
                  -print -quit
              )"

              if [ -n "$file" ]; then
                  echo "[PASS] ${pkg}"
                  echo "       ${file}"
              else
                  echo "[ERROR] Generated userspace APK missing: ${pkg}"
                  exit 1
              fi
          done

      # ============================================================
      # 19. Verify firmware manifest contains packages
      #
      # This is the final proof that the packages are actually
      # embedded into the firmware image, rather than merely built.
      # ============================================================
      - name: Verify firmware manifest
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "FIRMWARE MANIFEST VERIFICATION"
          echo "========================================"

          MANIFEST=""

          while IFS= read -r file; do
              if \
                grep -Eq '^(luci-app-passwall)([[:space:]-])' "$file" && \
                grep -Eq '^(mwan3)([[:space:]-])' "$file" && \
                grep -Eq '^(luci-app-mwan3)([[:space:]-])' "$file" && \
                grep -Eq '^(samba4-server)([[:space:]-])' "$file" && \
                grep -Eq '^(luci-app-samba4)([[:space:]-])' "$file" && \
                grep -Eq '^(kmod-usb3)([[:space:]-])' "$file" && \
                grep -Eq '^(kmod-usb-xhci-hcd)([[:space:]-])' "$file" && \
                grep -Eq '^(kmod-usb-xhci-mtk)([[:space:]-])' "$file" && \
                grep -Eq '^(kmod-nft-socket)([[:space:]-])' "$file" && \
                grep -Eq '^(kmod-nft-tproxy)([[:space:]-])' "$file"; then

                  MANIFEST="$file"
                  break
              fi
          done < <(
            find bin/targets/mediatek/filogic \
              -type f \
              -name '*.manifest' \
              -print
          )

          if [ -z "$MANIFEST" ]; then
              echo "[ERROR] Could not find a firmware manifest containing all required packages."
              echo
              echo "Available manifests:"
              find bin/targets/mediatek/filogic \
                -type f \
                -name '*.manifest' \
                -print || true
              exit 1
          fi

          echo "[PASS] Firmware manifest:"
          echo "       ${MANIFEST}"

          echo
          echo "===== Required packages in firmware ====="

          REQUIRED_MANIFEST_PACKAGES="
          luci-app-passwall
          mwan3
          luci-app-mwan3
          samba4-server
          luci-app-samba4
          kmod-usb3
          kmod-usb-xhci-hcd
          kmod-usb-xhci-mtk
          kmod-nft-socket
          kmod-nft-tproxy
          kmod-nft-nat
          kmod-nf-reject
          kmod-nf-reject6
          kmod-usb-net-qmi-wwan
          kmod-usb-net-cdc-mbim
          kmod-usb-net-cdc-ncm
          kmod-usb-net-cdc-ether
          kmod-usb-net-rndis
          kmod-usb-serial-option
          kmod-usb-serial-wwan
          "

          for pkg in $REQUIRED_MANIFEST_PACKAGES; do
              if grep -Eq "^${pkg}([[:space:]-])" "$MANIFEST"; then
                  echo "[PASS] ${pkg}"
              else
                  echo "[ERROR] ${pkg} is not present in firmware manifest."
                  exit 1
              fi
          done

          echo
          echo "[PASS] All required packages are embedded in the firmware."

      # ============================================================
      # 20. Verify firmware images and factory image size
      # ============================================================
      - name: Verify firmware images
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "FIRMWARE IMAGE VERIFICATION"
          echo "========================================"

          find bin/targets/mediatek/filogic \
            -maxdepth 2 \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.itb' \
              -o -name '*.img' \
              -o -name '*.tar' \
            \) \
            -printf '%s %p\n' \
            | sort -n

          echo
          echo "===== Factory image size ====="

          FACTORY=""

          while IFS= read -r file; do
              FACTORY="$file"
              break
          done < <(
            find bin/targets/mediatek/filogic \
              -type f \
              -name '*-factory.bin' \
              -o -name 'factory.bin'
          )

          if [ -z "$FACTORY" ]; then
              echo "[ERROR] factory.bin not found."
              exit 1
          fi

          SIZE_BYTES="$(stat -c '%s' "$FACTORY")"

          # 117248 KiB = 120062976 bytes
          MAX_FACTORY_BYTES=$((117248 * 1024))

          echo "Factory image:"
          echo "  ${FACTORY}"
          echo "Size:"
          echo "  ${SIZE_BYTES} bytes"
          echo "Maximum:"
          echo "  ${MAX_FACTORY_BYTES} bytes"

          if [ "$SIZE_BYTES" -gt "$MAX_FACTORY_BYTES" ]; then
              echo "[ERROR] Factory image exceeds N30 Pro image size."
              exit 1
          fi

          echo "[PASS] Factory image is within 117248 KiB."

      # ============================================================
      # 21. Generate build report
      # ============================================================
      - name: Generate build report
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          REPORT="$GITHUB_WORKSPACE/build-report.txt"

          {
            echo "=================================================="
            echo "ImmortalWrt 25.12.2 - Netcore N30 Pro"
            echo "FULL BUILD REPORT"
            echo "=================================================="
            echo

            echo "===== ImmortalWrt revision ====="
            git rev-parse HEAD
            git describe --tags --always || true
            echo

            echo "===== Patch revision ====="
            cd "$GITHUB_WORKSPACE/Netcore-N30-Pro-patch-for-OpenWrt"
            git rev-parse HEAD
            cd "$GITHUB_WORKSPACE/immortalwrt"
            echo

            echo "===== Target ====="
            grep -E \
              '^CONFIG_TARGET_(mediatek|ROOTFS|ARCH)' \
              .config || true
            echo

            echo "===== N30 Pro ====="
            grep \
              '^CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=' \
              .config || true
            echo

            echo "===== PassWall ====="
            grep \
              '^CONFIG_PACKAGE_luci-app-passwall' \
              .config || true
            echo

            echo "===== MWAN3 ====="
            grep -E \
              '^CONFIG_PACKAGE_(mwan3|luci-app-mwan3)=' \
              .config || true
            echo

            echo "===== Samba4 ====="
            grep -E \
              '^CONFIG_PACKAGE_(samba4-server|luci-app-samba4)=' \
              .config || true
            echo

            echo "===== USB / modem ====="
            grep -E \
              '^CONFIG_PACKAGE_kmod-(usb|fs-ext4|fs-vfat)' \
              .config || true
            echo

            echo "===== NFT ====="
            grep -E \
              '^CONFIG_PACKAGE_kmod-(nft|nf-reject)' \
              .config || true
            echo

            echo "===== PassWall cores ====="
            grep -E \
              '^CONFIG_PACKAGE_(xray-core|sing-box|geoview|haproxy|shadowsocks|simple-obfs|v2ray-plugin)' \
              .config || true
            echo

            echo "===== Firmware files ====="
            find bin/targets/mediatek/filogic \
              -maxdepth 2 \
              -type f \
              \( \
                -name '*.bin' \
                -o -name '*.itb' \
                -o -name '*.img' \
                -o -name '*.tar' \
              \) \
              -printf '%p\n' \
              | sort
            echo

            echo "===== Required Kernel APKs ====="
            find bin/packages \
              -type f \
              \( \
                -name 'kmod-usb3*.apk' \
                -o -name 'kmod-usb-xhci-hcd*.apk' \
                -o -name 'kmod-usb-xhci-mtk*.apk' \
                -o -name 'kmod-nft-socket*.apk' \
                -o -name 'kmod-nft-tproxy*.apk' \
                -o -name 'kmod-nft-nat*.apk' \
                -o -name 'kmod-nf-reject*.apk' \
                -o -name 'kmod-nf-reject6*.apk' \
              \) \
              -printf '%p\n' \
              | sort
            echo

            echo "Build completed successfully."

          } > "$REPORT"

          cat "$REPORT"

      # ============================================================
      # 22. Collect artifacts
      # ============================================================
      - name: Collect build artifacts
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          mkdir -p \
            "$GITHUB_WORKSPACE/artifacts/firmware" \
            "$GITHUB_WORKSPACE/artifacts/packages" \
            "$GITHUB_WORKSPACE/artifacts/source"

          # Firmware
          find bin/targets/mediatek/filogic \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.itb' \
              -o -name '*.img' \
              -o -name '*.tar' \
              -o -name '*.manifest' \
            \) \
            -exec cp -v {} \
              "$GITHUB_WORKSPACE/artifacts/firmware/" \;

          # Generated APKs
          find bin/packages \
            -type f \
            -name '*.apk' \
            -exec cp -v {} \
              "$GITHUB_WORKSPACE/artifacts/packages/" \;

          # Configuration
          cp \
            .config \
            "$GITHUB_WORKSPACE/artifacts/source/n30pro.config"

          # DTS
          cp \
            target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts \
            "$GITHUB_WORKSPACE/artifacts/source/"

          # Patch
          cp \
            "$GITHUB_WORKSPACE/Netcore-N30-Pro-patch-for-OpenWrt/patches/0001-Add-Netcore-N30-Pro-support.patch" \
            "$GITHUB_WORKSPACE/artifacts/source/"

          echo "===== Artifact SHA256 ====="

          (
            cd "$GITHUB_WORKSPACE/artifacts"
            find . -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > \
            "$GITHUB_WORKSPACE/artifacts/SHA256SUMS"

      # ============================================================
      # 23. Upload firmware
      # ============================================================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-firmware
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 24. Upload APK packages
      # ============================================================
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 25. Upload source/config/report
      # ============================================================
      - name: Upload source and build report
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-build-report
          path: |
            build-report.txt
            artifacts/source/
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
