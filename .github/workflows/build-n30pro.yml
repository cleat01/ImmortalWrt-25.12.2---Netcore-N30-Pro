name: Build ImmortalWrt 25.12.2 - Netcore N30 Pro Full

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IW_BRANCH: v25.12.2
  N30_PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Ubuntu 24.04 编译环境
      #
      # 注意：
      # Ubuntu 24.04 / Python 3.12 没有 python3-distutils
      # ============================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            nano \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-docutils \
            python3-pip \
            python3-ply \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            unzip \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

          echo "========================================"
          echo "Host environment"
          echo "========================================"

          python3 --version
          pip3 --version
          gcc --version | head -1
          clang --version | head -1
          make --version | head -1

      # ============================================================
      # 2. ImmortalWrt + N30 Pro 补丁
      #
      # 目录必须平级：
      #
      # $GITHUB_WORKSPACE/
      # ├── immortalwrt/
      # └── Netcore-N30-Pro-patch-for-OpenWrt/
      # ============================================================
      - name: Clone ImmortalWrt and N30 Pro patch
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          git clone \
            --depth=1 \
            --branch "${IW_BRANCH}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          git clone \
            --depth=1 \
            "${N30_PATCH_REPO}" \
            Netcore-N30-Pro-patch-for-OpenWrt

          echo "========================================"
          echo "Workspace"
          echo "========================================"

          ls -la "$GITHUB_WORKSPACE"

      # ============================================================
      # 3. 应用 N30 Pro 补丁
      # ============================================================
      - name: Apply Netcore N30 Pro adaptation
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "Apply Netcore N30 Pro adaptation"
          echo "========================================"

          test -f \
            ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh

          test -d \
            ../Netcore-N30-Pro-patch-for-OpenWrt/patches

          echo "Patch files:"
          find \
            ../Netcore-N30-Pro-patch-for-OpenWrt/patches \
            -maxdepth 1 \
            -type f \
            -name '*.patch' \
            -print \
            | sort

          bash \
            ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh \
            ../Netcore-N30-Pro-patch-for-OpenWrt

      # ============================================================
      # 4. 验证 N30 Pro DTS / USB VBUS
      # ============================================================
      - name: Verify N30 Pro USB VBUS DTS
        working-directory: immortalwrt
        run: |
          set -eux

          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

          test -f "$DTS"

          echo "========================================"
          echo "N30 Pro DTS"
          echo "========================================"

          sed -n '1,300p' "$DTS"

          echo
          echo "========================================"
          echo "USB VBUS checks"
          echo "========================================"

          grep -q 'model.*N30 Pro' "$DTS"

          grep -q 'compatible.*netcore,n30-pro' "$DTS"

          grep -q '<&pio 23 GPIO_ACTIVE_HIGH>' "$DTS"

          grep -q 'regulator-usb-vbus' "$DTS"

          grep -q '5000000' "$DTS"

          grep -q 'regulator-boot-on' "$DTS"

          grep -q '&usb_phy' "$DTS"

          grep -q 'vbus-supply.*usb_vbus' "$DTS"

          echo "N30 Pro USB VBUS DTS: PASS"

      # ============================================================
      # 5. 验证 N30 Pro board integration
      # ============================================================
      - name: Verify N30 Pro board integration
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "N30 Pro integration"
          echo "========================================"

          grep -Rni \
            'netcore-n30-pro' \
            target/linux/mediatek \
            | head -100

          echo
          echo "========================================"
          echo "Device definition"
          echo "========================================"

          grep -Rni \
            'Device/netcore_n30-pro' \
            target/linux/mediatek \
            || true

      # ============================================================
      # 6. 更新 ImmortalWrt 自己的 feeds
      #
      # 不添加 JLU
      # 不添加 OpenWrt 官方 feed
      # 不添加 PassWall main
      #
      # 使用 v25.12.2 对应的 ImmortalWrt feeds。
      # ============================================================
      - name: Update ImmortalWrt feeds
        working-directory: immortalwrt
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 7. 建立可靠的软件包检测函数
      #
      # 优先使用 scripts/feeds search。
      # 不再通过：
      #
      # grep "Package/xxx"
      #
      # 判断，因为很多 Makefile 使用：
      #
      # define Package/$(PKG_NAME)
      #
      # 会导致错误判断。
      # ============================================================
      - name: Create package detection helpers
        working-directory: immortalwrt
        run: |
          set -eux

          cat > /tmp/package-exists.sh <<'EOF'
          #!/bin/bash

          set -u

          PKG="$1"

          # --------------------------------------------------------
          # 1. scripts/feeds search
          # --------------------------------------------------------
          if ./scripts/feeds search "$PKG" 2>/dev/null \
              | grep -Eq "(^|[[:space:]])${PKG}([[:space:]]|$)"; then
            echo "[FOUND] ${PKG} via feeds"
            exit 0
          fi

          # --------------------------------------------------------
          # 2. 直接搜索 Makefile 中的 PKG_NAME
          # --------------------------------------------------------
          if grep -Rqs \
              -E "^[[:space:]]*PKG_NAME[[:space:]]*:=[[:space:]]*${PKG}[[:space:]]*$" \
              feeds package target \
              2>/dev/null; then
            echo "[FOUND] ${PKG} via PKG_NAME"
            exit 0
          fi

          # --------------------------------------------------------
          # 3. define Package/xxx
          # --------------------------------------------------------
          if grep -Rqs \
              -E "^[[:space:]]*define[[:space:]]+Package/${PKG}[[:space:]]*$" \
              feeds package target \
              2>/dev/null; then
            echo "[FOUND] ${PKG} via Package definition"
            exit 0
          fi

          # --------------------------------------------------------
          # 4. define KernelPackage/xxx
          # --------------------------------------------------------
          if grep -Rqs \
              -E "^[[:space:]]*define[[:space:]]+KernelPackage/${PKG}[[:space:]]*$" \
              feeds package target \
              2>/dev/null; then
            echo "[FOUND] ${PKG} via KernelPackage definition"
            exit 0
          fi

          echo "[MISSING] ${PKG}"
          exit 1
          EOF

          chmod +x /tmp/package-exists.sh

          cat > /tmp/enable-optional.sh <<'EOF'
          #!/bin/bash

          set -u

          PKG="$1"

          if /tmp/package-exists.sh "$PKG" >/dev/null 2>&1; then
            echo "CONFIG_PACKAGE_${PKG}=y" >> .config
            echo "[ENABLE] ${PKG}"
          else
            echo "[SKIP] ${PKG}"
          fi
          EOF

          chmod +x /tmp/enable-optional.sh

      # ============================================================
      # 8. 检查必须的软件包
      # ============================================================
      - name: Verify required package sources
        working-directory: immortalwrt
        run: |
          set -eux

          REQUIRED_PACKAGES="
          luci-app-passwall
          mwan3
          luci-app-mwan3
          samba4-server
          luci-app-samba4
          kmod-usb3
          kmod-usb-xhci-hcd
          kmod-usb-xhci-mtk
          kmod-nft-socket
          kmod-nft-tproxy
          "

          for pkg in $REQUIRED_PACKAGES; do
            echo
            echo "Checking: ${pkg}"
            /tmp/package-exists.sh "$pkg"
          done

          echo
          echo "========================================"
          echo "Required package source check: PASS"
          echo "========================================"

      # ============================================================
      # 9. Samba4 安全检查
      #
      # 2026 年公开的 luci-app-samba4 ACL 问题：
      #
      # read:
      #   /usr/sbin/smbd: [ "exec" ]
      #
      # 这是危险配置。
      #
      # 如果源码中仍存在这个 ACL，则停止构建。
      # ============================================================
      - name: Security check luci-app-samba4 ACL
        working-directory: immortalwrt
        run: |
          set -eux

          ACL_FILES="$(
            find feeds package \
              -type f \
              -path '*/luci-app-samba4/*' \
              -name '*.json' \
              -print 2>/dev/null \
              || true
          )"

          echo "Samba4 ACL files:"
          echo "$ACL_FILES"

          if [ -z "$ACL_FILES" ]; then
            echo "No Samba4 ACL file found yet."
            echo "The package source will be checked during build."
            exit 0
          fi

          if grep -Rni \
              '"/usr/sbin/smbd"[[:space:]]*:[[:space:]]*\[[[:space:]]*"exec"' \
              $ACL_FILES \
              2>/dev/null; then

            echo
            echo "ERROR:"
            echo "luci-app-samba4 contains the dangerous smbd exec ACL."
            echo "Refusing to build this firmware."
            exit 1
          fi

          echo "Samba4 ACL security check: PASS"

      # ============================================================
      # 10. 基础配置
      # ============================================================
      - name: Create base configuration
        working-directory: immortalwrt
        run: |
          set -eux

          cat > .config <<'EOF'
          # ========================================================
          # TARGET
          # ========================================================

          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore-n30-pro=y

          # ========================================================
          # LuCI
          # ========================================================

          CONFIG_LUCI=y
          CONFIG_PACKAGE_luci=y

          # ========================================================
          # USB 3.0
          # ========================================================

          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y

          # ========================================================
          # USB storage
          # ========================================================

          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y

          # ========================================================
          # USB tools
          # ========================================================

          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_usb-modeswitch=y

          # ========================================================
          # TUN
          # ========================================================

          CONFIG_PACKAGE_kmod-tun=y

          # ========================================================
          # firewall4 / nftables
          # ========================================================

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y

          # ========================================================
          # Basic network tools
          # ========================================================

          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_curl=y
          EOF

      # ============================================================
      # 11. USB 4G / 5G / 随身 WiFi
      # ============================================================
      - name: Enable USB 4G 5G packages
        working-directory: immortalwrt
        run: |
          set -u

          for pkg in \
            kmod-usb-net \
            kmod-usb-net-cdc-ether \
            kmod-usb-net-cdc-ncm \
            kmod-usb-net-rndis \
            kmod-usb-wdm \
            kmod-usb-net-qmi-wwan \
            kmod-usb-net-cdc-mbim \
            kmod-usb-serial \
            kmod-usb-serial-option \
            kmod-usb-serial-wwan \
            kmod-usb-serial-qualcomm \
            kmod-usb-serial-sierrawireless \
            kmod-usb-acm \
            kmod-usb-net-rtl8150 \
            kmod-usb-net-rtl8152 \
            kmod-usb-net-asix \
            kmod-usb-net-asix-ax88179 \
            kmod-usb-net-aqc111 \
            uqmi \
            umbim \
            luci-proto-qmi \
            luci-proto-mbim \
            luci-proto-ncm
          do
            /tmp/enable-optional.sh "$pkg"
          done

      # ============================================================
      # 12. PassWall
      #
      # 直接进入固件：
      #
      # CONFIG_PACKAGE_luci-app-passwall=y
      # ============================================================
      - name: Enable PassWall
        working-directory: immortalwrt
        run: |
          set -eux

          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config

          # 当前 PassWall Makefile 使用的配置符号：
          #
          # CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy
          #
          # 注意：
          # 不是 INCLUDE_Nftables_Transparent_Proxy。
          echo "CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y" >> .config

      # ============================================================
      # 13. PassWall 必需 nftables kmod
      #
      # PassWall 当前 Makefile 会 select：
      #
      # kmod-nft-socket
      # kmod-nft-tproxy
      # kmod-nft-nat
      # kmod-nf-reject
      # kmod-nf-reject6
      # ============================================================
      - name: Enable PassWall nftables modules
        working-directory: immortalwrt
        run: |
          set -eux

          cat >> .config <<'EOF'

          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y

          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ipt2socks=y
          EOF

      # ============================================================
      # 14. PassWall 用户态依赖
      #
      # 即使 PassWall 自己的 LUCI_DEPENDS 会自动拉取，
      # 这里也明确要求这些包进入固件。
      # ============================================================
      - name: Enable PassWall userland dependencies
        working-directory: immortalwrt
        run: |
          set -u

          for pkg in \
            coreutils \
            coreutils-base64 \
            coreutils-nohup \
            coreutils-timeout \
            curl \
            chinadns-ng \
            dns2socks \
            dnsmasq-full \
            ip-full \
            libuci-lua \
            lua \
            luci-compat \
            luci-lib-jsonc \
            microsocks \
            resolveip \
            tcping \
            lyaml
          do
            /tmp/enable-optional.sh "$pkg"
          done

      # ============================================================
      # 15. PassWall 常用代理核心
      #
      # 当前 aarch64 默认项：
      #
      # Geoview
      # HAProxy
      # Shadowsocks Rust Client
      # ShadowsocksR Client
      # Simple Obfs
      # Sing-box
      # V2ray Plugin
      # Xray
      #
      # 不强制开启服务器端和体积较大的额外核心。
      # ============================================================
      - name: Enable PassWall proxy cores
        working-directory: immortalwrt
        run: |
          set -u

          for pkg in \
            geoview \
            haproxy \
            shadowsocks-rust-sslocal \
            shadowsocksr-libev-ssr-local \
            shadowsocksr-libev-ssr-redir \
            simple-obfs-client \
            sing-box \
            v2ray-plugin \
            xray-core \
            unzip
          do
            /tmp/enable-optional.sh "$pkg"
          done

      # ============================================================
      # 16. MWAN3 负载均衡
      #
      # 直接编入固件。
      # ============================================================
      - name: Enable MWAN3
        working-directory: immortalwrt
        run: |
          set -eux

          echo "CONFIG_PACKAGE_mwan3=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config

      # ============================================================
      # 17. Samba4
      # ============================================================
      - name: Enable Samba4
        working-directory: immortalwrt
        run: |
          set -eux

          echo "CONFIG_PACKAGE_samba4-server=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config

      # ============================================================
      # 18. Samba / USB storage 辅助组件
      # ============================================================
      - name: Enable Samba storage support
        working-directory: immortalwrt
        run: |
          set -u

          for pkg in \
            block-mount \
            kmod-fs-ext4 \
            kmod-fs-vfat \
            kmod-usb-storage \
            kmod-usb-storage-extras \
            kmod-fs-ntfs3
          do
            /tmp/enable-optional.sh "$pkg"
          done

      # ============================================================
      # 19. 运行 defconfig
      # ============================================================
      - name: Generate final configuration
        working-directory: immortalwrt
        run: |
          set -eux

          make defconfig

          echo
          echo "========================================"
          echo "FINAL TARGET"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config

          echo
          echo "========================================"
          echo "PASSWALL"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|kmod-nft|nftables|ipt2socks|xray|sing-box|shadowsocks|shadowsocksr|simple-obfs|v2ray-plugin|geoview|haproxy|chinadns-ng|dns2socks|tcping)' \
            .config \
            | sort \
            || true

          echo
          echo "========================================"
          echo "MWAN3"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(mwan3|luci-app-mwan3)' \
            .config \
            || true

          echo
          echo "========================================"
          echo "SAMBA4"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(samba4|luci-app-samba4)' \
            .config \
            || true

          echo
          echo "========================================"
          echo "USB"
          echo "========================================"

          grep '^CONFIG_PACKAGE_kmod-usb' .config \
            | sort \
            || true

      # ============================================================
      # 20. 严格验证最终配置
      # ============================================================
      - name: Verify final configuration
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep -Fxq \
            'CONFIG_TARGET_mediatek=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_mediatek_filogic=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore-n30-pro=y' \
            .config

          echo "Target: PASS"

          echo
          echo "========================================"
          echo "USB"
          echo "========================================"

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-usb3=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-usb-xhci-hcd=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-usb-xhci-mtk=y' \
            .config

          echo "USB: PASS"

          echo
          echo "========================================"
          echo "PASSWALL"
          echo "========================================"

          grep -Fxq \
            'CONFIG_PACKAGE_luci-app-passwall=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-nft-socket=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-nft-tproxy=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-nft-nat=y' \
            .config

          echo "PassWall: PASS"

          echo
          echo "========================================"
          echo "MWAN3"
          echo "========================================"

          grep -Fxq \
            'CONFIG_PACKAGE_mwan3=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_luci-app-mwan3=y' \
            .config

          echo "MWAN3: PASS"

          echo
          echo "========================================"
          echo "SAMBA4"
          echo "========================================"

          grep -Fxq \
            'CONFIG_PACKAGE_samba4-server=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_luci-app-samba4=y' \
            .config

          echo "Samba4: PASS"

      # ============================================================
      # 21. 下载源码
      # ============================================================
      - name: Download sources
        working-directory: immortalwrt
        run: |
          set -eux

          make download -j2 V=s

      # ============================================================
      # 22. 编译
      # ============================================================
      - name: Build firmware
        working-directory: immortalwrt
        run: |
          set -eux

          make -j"$(nproc)" V=s

      # ============================================================
      # 23. 检查最终 USB 模块
      # ============================================================
      - name: Verify USB kernel modules
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "xhci-hcd"
          echo "========================================"

          find bin build_dir \
            -type f \
            -name 'xhci-hcd.ko*' \
            -print \
            | sort

          echo
          echo "========================================"
          echo "xhci-mtk-hcd"
          echo "========================================"

          find bin build_dir \
            -type f \
            -name 'xhci-mtk-hcd.ko*' \
            -print \
            | sort

          echo
          echo "========================================"
          echo "nft_socket"
          echo "========================================"

          find bin build_dir \
            -type f \
            -name 'nft_socket.ko*' \
            -print \
            | sort

          echo
          echo "========================================"
          echo "nft_tproxy"
          echo "========================================"

          find bin build_dir \
            -type f \
            -name 'nft_tproxy.ko*' \
            -print \
            | sort

      # ============================================================
      # 24. 检查固件 manifest
      # ============================================================
      - name: Verify firmware manifests
        working-directory: immortalwrt
        run: |
          set -eux

          MANIFESTS="$(
            find bin/targets \
              -type f \
              -name '*.manifest' \
              -print \
              2>/dev/null \
          )"

          test -n "$MANIFESTS"

          echo "========================================"
          echo "PassWall in manifest"
          echo "========================================"

          if ! grep -Riq \
              'luci-app-passwall' \
              bin/targets; then
            echo "ERROR: luci-app-passwall not found in firmware manifest"
            exit 1
          fi

          echo "PassWall manifest: PASS"

          echo
          echo "========================================"
          echo "MWAN3 in manifest"
          echo "========================================"

          if ! grep -Riq \
              'luci-app-mwan3' \
              bin/targets; then
            echo "ERROR: luci-app-mwan3 not found in firmware manifest"
            exit 1
          fi

          echo "MWAN3 manifest: PASS"

          echo
          echo "========================================"
          echo "Samba4 in manifest"
          echo "========================================"

          if ! grep -Riq \
              'luci-app-samba4' \
              bin/targets; then
            echo "ERROR: luci-app-samba4 not found in firmware manifest"
            exit 1
          fi

          if ! grep -Riq \
              'samba4-server' \
              bin/targets; then
            echo "ERROR: samba4-server not found in firmware manifest"
            exit 1
          fi

          echo "Samba4 manifest: PASS"

      # ============================================================
      # 25. 检查 PassWall 关键依赖
      # ============================================================
      - name: Verify PassWall dependency packages
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "PassWall package outputs"
          echo "========================================"

          find bin/packages \
            -type f \
            -name '*.apk' \
            | grep -Ei \
              'passwall|xray|sing-box|nft-socket|nft-tproxy|chinadns|dns2socks|tcping' \
            | sort \
            | head -300 \
            || true

      # ============================================================
      # 26. 检查 Samba4 包
      # ============================================================
      - name: Verify Samba4 packages
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "Samba4 package outputs"
          echo "========================================"

          find bin/packages \
            -type f \
            -name '*.apk' \
            | grep -Ei \
              'samba4|luci-app-samba4' \
            | sort \
            || true

      # ============================================================
      # 27. 检查 MWAN3 包
      # ============================================================
      - name: Verify MWAN3 packages
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "MWAN3 package outputs"
          echo "========================================"

          find bin/packages \
            -type f \
            -name '*.apk' \
            | grep -Ei \
              'mwan3|luci-app-mwan3' \
            | sort \
            || true

      # ============================================================
      # 28. 检查最终固件
      # ============================================================
      - name: Verify N30 Pro firmware
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "Firmware files"
          echo "========================================"

          find bin/targets/mediatek/filogic \
            -maxdepth 1 \
            -type f \
            -printf '%f\t%s bytes\n' \
            | sort

          echo
          echo "========================================"
          echo "N30 Pro firmware"
          echo "========================================"

          N30_FILES="$(
            find bin/targets/mediatek/filogic \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*n30*' \
                -o -iname '*netcore*' \
              \) \
              -print
          )"

          echo "$N30_FILES"

          test -n "$N30_FILES"

      # ============================================================
      # 29. 检查固件大小
      # ============================================================
      - name: Check firmware size
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "Firmware sizes"
          echo "========================================"

          find bin/targets/mediatek/filogic \
            -maxdepth 1 \
            -type f \
            -printf '%f\t%s bytes\n' \
            | sort

      # ============================================================
      # 30. 生成构建报告
      # ============================================================
      - name: Generate build report
        working-directory: immortalwrt
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/build-report"

          {
            echo "========================================"
            echo "ImmortalWrt 25.12.2 N30 Pro Build Report"
            echo "========================================"
            echo
            echo "ImmortalWrt: ${IW_BRANCH}"
            echo "Target: mediatek/filogic"
            echo "Device: Netcore N30 Pro"
            echo
            echo "========================================"
            echo "Target"
            echo "========================================"

            grep '^CONFIG_TARGET_' .config

            echo
            echo "========================================"
            echo "PassWall"
            echo "========================================"

            grep -E \
              '^CONFIG_PACKAGE_(luci-app-passwall|kmod-nft|nftables|ipt2socks|xray|sing-box|shadowsocks|shadowsocksr|simple-obfs|v2ray-plugin|geoview|haproxy|chinadns-ng|dns2socks|tcping)' \
              .config \
              | sort \
              || true

            echo
            echo "========================================"
            echo "MWAN3"
            echo "========================================"

            grep -E \
              '^CONFIG_PACKAGE_(mwan3|luci-app-mwan3)' \
              .config \
              || true

            echo
            echo "========================================"
            echo "Samba4"
            echo "========================================"

            grep -E \
              '^CONFIG_PACKAGE_(samba4|luci-app-samba4)' \
              .config \
              || true

            echo
            echo "========================================"
            echo "USB"
            echo "========================================"

            grep '^CONFIG_PACKAGE_kmod-usb' .config \
              | sort \
              || true

            echo
            echo "========================================"
            echo "Firmware"
            echo "========================================"

            find bin/targets/mediatek/filogic \
              -maxdepth 1 \
              -type f \
              -printf '%f\t%s bytes\n' \
              | sort

          } > "$GITHUB_WORKSPACE/build-report/build-report.txt"

          cat "$GITHUB_WORKSPACE/build-report/build-report.txt"

      # ============================================================
      # 31. 整理最终产物
      # ============================================================
      - name: Collect artifacts
        run: |
          set -eux

          mkdir -p artifacts/firmware
          mkdir -p artifacts/packages
          mkdir -p artifacts/report

          # --------------------------------------------------------
          # 固件
          # --------------------------------------------------------
          find immortalwrt/bin/targets/mediatek/filogic \
            -maxdepth 1 \
            -type f \
            -exec cp -v {} artifacts/firmware/ \;

          # --------------------------------------------------------
          # 所有 APK
          # --------------------------------------------------------
          find immortalwrt/bin/packages \
            -type f \
            -name '*.apk' \
            -exec cp -v {} artifacts/packages/ \;

          # --------------------------------------------------------
          # 报告
          # --------------------------------------------------------
          cp -v \
            build-report/build-report.txt \
            artifacts/report/

          echo
          echo "========================================"
          echo "FINAL ARTIFACTS"
          echo "========================================"

          find artifacts \
            -type f \
            -printf '%p\t%s bytes\n' \
            | sort

      # ============================================================
      # 32. 上传固件
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12.2-Netcore-N30-Pro-FULL
          path: artifacts/firmware
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 33. 上传 APK
      # ============================================================
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: N30-Pro-All-Build-Packages
          path: artifacts/packages
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 34. 上传构建报告
      # ============================================================
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: N30-Pro-Build-Report
          path: artifacts/report
          if-no-files-found: error
          retention-days: 30
