      - name: "Upload firmware artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "ImmortalWrt-25.12.2-Netcore-N30-Pro"
          path: "artifacts/*"
          if-no-files-found: error
          retention-days: 14
