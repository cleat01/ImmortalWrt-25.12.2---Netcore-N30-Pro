name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Debug Final

on:
  workflow_dispatch:


env:
  IMMORTALWRT_TAG: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


    - name: Checkout
      uses: actions/checkout@v5



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zstd \
          xz-utils \
          file \
          patch \
          binutils



    - name: Clone ImmortalWrt
      run: |

        git clone \
        --depth 1 \
        --branch ${IMMORTALWRT_TAG} \
        https://github.com/immortalwrt/immortalwrt.git \
        immortalwrt



    - name: Clone N30 Pro patch
      run: |

        git clone \
        --depth 1 \
        ${PATCH_REPO} \
        n30pro-patch



    - name: Apply N30 Pro patch
      working-directory: immortalwrt
      run: |

        set -e


        PATCH=$(find ../n30pro-patch \
        -name "*.patch" \
        | head -1)


        if [ -z "$PATCH" ]; then

          echo "No patch found"

          exit 1

        fi



        awk '

        BEGIN{
          block=""
          skip=0
        }


        /^diff --git/{

          if(block!="" && skip==0)
            print block


          block=$0 "\n"


          if($0 ~ /11_fix_wifi_mac/)
            skip=1
          else
            skip=0


          next

        }


        {
          block=block $0 "\n"
        }


        END{

          if(block!="" && skip==0)
            print block

        }

        ' "$PATCH" > /tmp/n30pro.patch



        patch \
        -p1 \
        --forward \
        < /tmp/n30pro.patch



    - name: Prepare StarVPN package
      run: |

        set -e


        IPK=$(find . \
        -name "starvpn*.ipk" \
        | head -1)



        if [ -z "$IPK" ]; then

          echo "StarVPN ipk missing"

          exit 1

        fi



        rm -rf /tmp/starvpn

        mkdir -p /tmp/starvpn



        cp "$IPK" \
        /tmp/starvpn/starvpn.ipk



        cd /tmp/starvpn



        ar x starvpn.ipk



        if [ -f data.tar.gz ]; then

          tar xf data.tar.gz


        elif [ -f data.tar.zst ]; then

          tar \
          --use-compress-program=unzstd \
          -xf data.tar.zst


        elif [ -f data.tar.xz ]; then

          tar xf data.tar.xz


        else

          echo "Unknown ipk format"

          exit 1

        fi



        cd ${GITHUB_WORKSPACE}



        rm -rf immortalwrt/package/starvpn



        mkdir -p \
        immortalwrt/package/starvpn/files



        cp -a \
        /tmp/starvpn/usr \
        immortalwrt/package/starvpn/files/ \
        || true



        cp -a \
        /tmp/starvpn/etc \
        immortalwrt/package/starvpn/files/ \
        || true



        printf '%s\n' \
        'include $(TOPDIR)/rules.mk' \
        '' \
        'PKG_NAME:=starvpn' \
        'PKG_VERSION:=6.1.0' \
        'PKG_RELEASE:=1' \
        '' \
        'include $(INCLUDE_DIR)/package.mk' \
        '' \
        'define Package/starvpn' \
        ' SECTION:=net' \
        ' CATEGORY:=Network' \
        ' TITLE:=StarVPN' \
        ' DEPENDS:=+kmod-tun +libstdcpp +libopenssl' \
        'endef' \
        '' \
        'define Package/starvpn/install' \
        ' $(CP) ./files/* $(1)/' \
        'endef' \
        '' \
        '$(eval $(call BuildPackage,starvpn))' \
        > immortalwrt/package/starvpn/Makefile



    - name: Verify DTS
      working-directory: immortalwrt
      run: |

        DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"


        test -f "$DTS"


        grep -q "vbus-supply" "$DTS"


        grep -q "xhci" "$DTS"



    - name: Verify target
      working-directory: immortalwrt
      run: |

        grep -q \
        "Device/netis_nx30v2" \
        target/linux/mediatek/image/filogic.mk



    - name: Update feeds
      working-directory: immortalwrt
      run: |

        echo \
        "src-link starvpn $(pwd)/package/starvpn" \
        >> feeds.conf.default


        ./scripts/feeds update -a


        ./scripts/feeds install -a



    - name: Generate config
      working-directory: immortalwrt
      run: |

        printf '%s\n' \
        'CONFIG_TARGET_mediatek=y' \
        'CONFIG_TARGET_mediatek_filogic=y' \
        'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netis_nx30v2=y' \
        'CONFIG_PACKAGE_luci=y' \
        'CONFIG_PACKAGE_luci-ssl=y' \
        'CONFIG_PACKAGE_kmod-usb3=y' \
        'CONFIG_PACKAGE_kmod-usb-storage=y' \
        'CONFIG_PACKAGE_kmod-usb-storage-uas=y' \
        'CONFIG_PACKAGE_kmod-usb-net=y' \
        'CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y' \
        'CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y' \
        'CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y' \
        'CONFIG_PACKAGE_kmod-usb-serial=y' \
        'CONFIG_PACKAGE_kmod-usb-serial-option=y' \
        'CONFIG_PACKAGE_kmod-usb-serial-wwan=y' \
        'CONFIG_PACKAGE_kmod-usb-wdm=y' \
        'CONFIG_PACKAGE_usb-modeswitch=y' \
        'CONFIG_PACKAGE_usb-modeswitch-data=y' \
        'CONFIG_PACKAGE_uqmi=y' \
        'CONFIG_PACKAGE_umbim=y' \
        'CONFIG_PACKAGE_libmbim=y' \
        'CONFIG_PACKAGE_mwan3=y' \
        'CONFIG_PACKAGE_luci-app-mwan3=y' \
        'CONFIG_PACKAGE_samba4-server=y' \
        'CONFIG_PACKAGE_luci-app-samba4=y' \
        'CONFIG_PACKAGE_kmod-tun=y' \
        'CONFIG_PACKAGE_starvpn=y' \
        > .config



        make defconfig



    - name: Verify final config
      working-directory: immortalwrt
      run: |

        echo "===== CONFIG CHECK ====="


        grep CONFIG_PACKAGE_starvpn .config || true

        grep CONFIG_PACKAGE_kmod-usb-serial .config || true

        grep CONFIG_PACKAGE_kmod-usb-net-qmi-wwan .config || true



    - name: Download packages
      working-directory: immortalwrt
      run: |

        make download \
        -j2



    - name: Build firmware
      working-directory: immortalwrt
      run: |

        make \
        -j1 \
        V=s 2>&1 | tee build.log



        RESULT=${PIPESTATUS[0]}



        if [ "$RESULT" != "0" ]; then


          echo "========== BUILD FAILED =========="


          echo "===== ERROR ====="


          grep -n "error:" build.log | tail -50 || true


          grep -n "Error [0-9]" build.log | tail -50 || true


          tail -200 build.log


          exit "$RESULT"


        fi



    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4

      with:

        name: build-log

        path: immortalwrt/build.log



    - name: Firmware check
      if: success()
      working-directory: immortalwrt
      run: |

        find \
        bin/targets/mediatek/filogic \
        -name "*sysupgrade*" \
        | grep .



    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4

      with:

        name: ImmortalWrt-25.12.2-Netcore-N30-Pro

        path: immortalwrt/bin/targets/mediatek/filogic/
