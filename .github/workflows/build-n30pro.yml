name: Build ImmortalWrt 25.12.2 - Netcore N30 Pro

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTALWRT_TAG: v25.12.2

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget curl patch \
            device-tree-compiler ccache libelf-dev quilt

      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth 1 \
            --branch ${IMMORTALWRT_TAG} \
            https://github.com/immortalwrt/immortalwrt.git

      - name: Clone N30 Pro patch
        run: |
          git clone \
            --depth 1 \
            https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git

      - name: Apply N30 Pro patch
        working-directory: immortalwrt
        run: |
          bash ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh \
            ../Netcore-N30-Pro-patch-for-OpenWrt

      - name: Verify patch
        working-directory: immortalwrt
        run: |
          test -f target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts
          grep -q 'gpio = <&pio 23 GPIO_ACTIVE_HIGH>;' target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts
          grep -q 'regulator-boot-on;' target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts
          grep -q 'vbus-supply = <&usb_vbus>;' target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        working-directory: immortalwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y

          CONFIG_PACKAGE_luci-app-mwan3=y

          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_samba4-server=y

          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y

          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_block-mount=y

          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_e2fsprogs=y

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-wdm=y

          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y

          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-acm=y

          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y

          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          EOF

          make defconfig

      - name: Verify final target
        working-directory: immortalwrt
        run: |
          grep '^CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y' .config

          if grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_openwrt_one=y' .config; then
            echo "Wrong target selected"
            exit 1
          fi

      - name: Download sources
        working-directory: immortalwrt
        run: |
          make download -j$(nproc)

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) V=s

      - name: Verify USB modules
        working-directory: immortalwrt
        run: |
          find build_dir -name xhci-hcd.ko | grep .
          find build_dir -name xhci-mtk-hcd.ko | grep .

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*
          if-no-files-found: error
          retention-days: 14
