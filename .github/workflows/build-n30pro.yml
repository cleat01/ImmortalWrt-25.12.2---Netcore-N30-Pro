name: Build ImmortalWrt 25.12.2 - Netcore N30 Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: n30pro-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMMORTALWRT_TAG: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git
  PATCH_BRANCH: main

jobs:
  build:
    name: Build N30 Pro firmware
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Build environment
      # ============================================================

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            device-tree-compiler \
            quilt

      # ============================================================
      # 2. ImmortalWrt 25.12.2
      # ============================================================

      - name: Checkout ImmortalWrt 25.12.2
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${IMMORTALWRT_TAG}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo "===== ImmortalWrt ====="
          git rev-parse HEAD
          git describe --tags --always

      # ============================================================
      # 3. N30 Pro patch repository
      # ============================================================

      - name: Checkout N30 Pro patch
        run: |
          set -euxo pipefail

          rm -rf Netcore-N30-Pro-patch-for-OpenWrt

          git clone \
            --depth 1 \
            --branch "${PATCH_BRANCH}" \
            "${PATCH_REPO}" \
            Netcore-N30-Pro-patch-for-OpenWrt

          echo "===== N30 Pro patch repository ====="

          git -C Netcore-N30-Pro-patch-for-OpenWrt rev-parse HEAD

          echo
          find Netcore-N30-Pro-patch-for-OpenWrt \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

      # ============================================================
      # 4. Apply N30 Pro patch
      # ============================================================

      - name: Apply N30 Pro patch
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          test -f \
            ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh

          bash \
            ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh \
            ../Netcore-N30-Pro-patch-for-OpenWrt

          echo
          echo "===== Verify N30 Pro patch ====="

          test -f \
            target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts

          echo "[OK] N30 Pro DTS exists"

          grep -R \
            -n \
            "netcore,n30-pro" \
            target/linux/mediatek \
            | head -50 \
            || true

          echo
          echo "===== Verify device definition ====="

          grep -R \
            -n \
            "netcore_n30-pro" \
            target/linux/mediatek \
            | head -30 \
            || true

      # ============================================================
      # 5. Verify USB VBUS fix
      # ============================================================

      - name: Verify N30 Pro USB VBUS DTS
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

          test -f "${DTS}"

          echo "===== USB VBUS definition ====="

          grep -n \
            -A20 \
            -B5 \
            "usb_vbus" \
            "${DTS}"

          echo
          echo "===== Check GPIO23 ====="

          grep -q \
            'gpio = <&pio 23 GPIO_ACTIVE_HIGH>;' \
            "${DTS}"

          echo "[OK] GPIO23"

          echo
          echo "===== Check regulator ====="

          grep -q \
            'regulator-name = "usb-vbus";' \
            "${DTS}"

          grep -q \
            'regulator-min-microvolt = <5000000>;' \
            "${DTS}"

          grep -q \
            'regulator-max-microvolt = <5000000>;' \
            "${DTS}"

          grep -q \
            'enable-active-high;' \
            "${DTS}"

          grep -q \
            'regulator-boot-on;' \
            "${DTS}"

          echo "[OK] USB VBUS regulator"

          echo
          echo "===== Check USB PHY ====="

          grep -n \
            -A10 \
            -B3 \
            '&usb_phy' \
            "${DTS}"

          echo
          echo "===== Check XHCI ====="

          grep -n \
            -A15 \
            -B3 \
            '&xhci' \
            "${DTS}"

          grep -q \
            'vbus-supply = <&usb_vbus>;' \
            "${DTS}"

          echo "[OK] XHCI VBUS consumer"

          echo
          echo "USB VBUS DTS verification passed."

      # ============================================================
      # 6. Update feeds
      # ============================================================

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 7. Generate package/target metadata
      # ============================================================

      - name: Prepare build metadata
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          make defconfig

          make prepare-tmpinfo

          test -f tmp/.config-package.in
          test -f tmp/.config-target.in

          echo
          echo "===== N30 Pro target metadata ====="

          grep -nE \
            'netcore|n30.pro|n30_pro|n30-pro' \
            tmp/.config-target.in \
            | head -100 \
            || true

          echo
          echo "===== N30 Pro device metadata ====="

          grep -R \
            -nE \
            'netcore_n30-pro|netcore-n30-pro|n30-pro' \
            target/linux/mediatek \
            | head -100 \
            || true

      # ============================================================
      # 8. Detect exact N30 Pro Kconfig symbol
      # ============================================================

      - name: Detect exact N30 Pro target symbol
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "===== Search N30 Pro Kconfig symbols ====="

          TARGET_SYMBOLS="$(
            sed -n -E \
              's/^[[:space:]]*config[[:space:]]+(TARGET_[A-Za-z0-9_-]*netcore[_-]n30[_-]pro[A-Za-z0-9_-]*).*/\1/p' \
              tmp/.config-target.in \
              | sort -u
          )"

          echo
          echo "Detected symbols:"
          echo "${TARGET_SYMBOLS}"

          if [ -z "${TARGET_SYMBOLS}" ]; then
            echo
            echo "ERROR: N30 Pro Kconfig symbol was not found."

            echo
            echo "===== All Netcore-related target metadata ====="

            grep -nEi \
              'netcore|n30' \
              tmp/.config-target.in \
              | head -200 \
              || true

            exit 1
          fi

          TARGET_COUNT="$(
            printf '%s\n' "${TARGET_SYMBOLS}" \
              | sed '/^[[:space:]]*$/d' \
              | wc -l
          )"

          if [ "${TARGET_COUNT}" -ne 1 ]; then
            echo
            echo "ERROR: Expected exactly one N30 Pro target symbol."

            printf '%s\n' "${TARGET_SYMBOLS}"

            exit 1
          fi

          TARGET_SYMBOL="${TARGET_SYMBOLS}"

          echo
          echo "Exact N30 Pro target symbol:"
          echo "${TARGET_SYMBOL}"

          printf '%s\n' "${TARGET_SYMBOL}" > .n30pro-target-symbol

      # ============================================================
      # 9. Configure exact target
      # ============================================================

      - name: Configure exact N30 Pro target
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          TARGET_SYMBOL="$(cat .n30pro-target-symbol)"

          echo "Using target:"
          echo "${TARGET_SYMBOL}"

          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_UBIFS_FREE_SPACE_FIXUP=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          CONFIG_${TARGET_SYMBOL}=y
          EOF

          echo
          echo "===== Configuration before defconfig ====="
          cat .config

          make defconfig

          echo
          echo "===== Configuration after defconfig ====="

          grep -E \
            '^CONFIG_TARGET_' \
            .config \
            | sort

          echo
          echo "===== Verify exact N30 Pro symbol ====="

          if ! grep -q \
            "^CONFIG_${TARGET_SYMBOL}=y$" \
            .config
          then
            echo
            echo "ERROR: N30 Pro target was NOT retained."

            echo
            echo "Expected:"
            echo "CONFIG_${TARGET_SYMBOL}=y"

            echo
            echo "Actual relevant configuration:"
            grep -E \
              '^CONFIG_TARGET_.*(DEVICE|PROFILE)' \
              .config \
              | sort \
              || true

            exit 1
          fi

          echo "[OK] N30 Pro target retained"

          echo
          echo "===== Explicit OpenWrt One protection ====="

          if grep -q \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_openwrt_one=y$' \
            .config
          then
            echo
            echo "ERROR: OpenWrt One was selected."

            echo
            echo "Current target:"
            grep -E \
              '^CONFIG_TARGET_.*DEVICE_' \
              .config \
              | sort \
              || true

            exit 1
          fi

          echo "[OK] OpenWrt One is not selected."

      # ============================================================
      # 10. Package selection helpers
      # ============================================================

      - name: Configure packages
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          require_pkg() {
            local pkg="$1"

            if ! grep -qE \
              "^[[:space:]]*config[[:space:]]+PACKAGE_${pkg}([[:space:]]|$)" \
              tmp/.config-package.in
            then
              echo
              echo "ERROR: Required package is unavailable:"
              echo "${pkg}"

              echo
              echo "Matching metadata:"
              grep -nE \
                "PACKAGE_${pkg}([[:space:]]|$)" \
                tmp/.config-package.in \
                | head -30 \
                || true

              exit 1
            fi

            echo "[OK] package available: ${pkg}"

            echo \
              "CONFIG_PACKAGE_${pkg}=y" \
              >> .config
          }

          optional_pkg() {
            local pkg="$1"

            if grep -qE \
              "^[[:space:]]*config[[:space:]]+PACKAGE_${pkg}([[:space:]]|$)" \
              tmp/.config-package.in
            then
              echo "[OK] optional package: ${pkg}"

              echo \
                "CONFIG_PACKAGE_${pkg}=y" \
                >> .config
            else
              echo "[SKIP] optional package unavailable: ${pkg}"
            fi
          }

          echo
          echo "===== LuCI ====="

          require_pkg luci
          require_pkg luci-ssl

          echo
          echo "===== PassWall ====="

          require_pkg luci-app-passwall

          if grep -qE \
            '^[[:space:]]*config[[:space:]]+PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy([[:space:]]|$)' \
            tmp/.config-package.in
          then
            echo \
              'CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y' \
              >> .config

            echo "[OK] PassWall Nftables Transparent Proxy"
          else
            echo
            echo "ERROR: PassWall Nftables Transparent Proxy selector unavailable."

            grep -n \
              'luci-app-passwall.*Nftables' \
              tmp/.config-package.in \
              | head -50 \
              || true

            exit 1
          fi

          echo
          echo "===== MWAN3 ====="

          require_pkg luci-app-mwan3

          echo
          echo "===== Samba4 ====="

          require_pkg luci-app-samba4

          echo
          echo "===== USB xHCI ====="

          require_pkg kmod-usb-xhci-hcd
          require_pkg kmod-usb-xhci-mtk

          echo
          echo "===== USB networking ====="

          require_pkg kmod-usb-net
          require_pkg kmod-usb-net-cdc-ether
          require_pkg kmod-usb-net-cdc-ncm
          require_pkg kmod-usb-net-rndis
          require_pkg kmod-usb-wdm

          require_pkg kmod-usb-net-qmi-wwan
          require_pkg kmod-usb-net-cdc-mbim

          echo
          echo "===== USB serial / WWAN ====="

          require_pkg kmod-usb-serial
          require_pkg kmod-usb-serial-option
          require_pkg kmod-usb-serial-wwan
          require_pkg kmod-usb-acm

          optional_pkg kmod-usb-serial-qualcomm
          optional_pkg kmod-usb-serial-sierrawireless

          echo
          echo "===== USB userland ====="

          require_pkg usbutils
          require_pkg usb-modeswitch
          require_pkg uqmi
          require_pkg umbim

          echo
          echo "===== USB Ethernet adapters ====="

          optional_pkg kmod-usb-net-rtl8150
          optional_pkg kmod-usb-net-rtl8152
          optional_pkg kmod-usb-net-asix
          optional_pkg kmod-usb-net-asix-ax88179
          optional_pkg kmod-usb-net-aqc111

          echo
          echo "===== Modem LuCI protocols ====="

          optional_pkg luci-proto-qmi
          optional_pkg luci-proto-mbim
          optional_pkg luci-proto-ncm

          echo
          echo "===== PassWall kernel dependencies ====="

          require_pkg kmod-nft-socket
          require_pkg kmod-nft-tproxy
          require_pkg kmod-tun

          echo
          echo "===== Chinese LuCI translations ====="

          optional_pkg luci-i18n-passwall-zh-cn
          optional_pkg luci-i18n-mwan3-zh-cn
          optional_pkg luci-i18n-samba4-zh-cn

      # ============================================================
      # 11. Samba4 security check
      # ============================================================

      - name: Check Samba4 security
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "===== Search Samba4 ACL files ====="

          SAMBA_FILES="$(
            find feeds package \
              -type f \
              \( \
                -name '*.json' \
                -o \
                -name 'acl.json' \
              \) \
              -print 2>/dev/null \
              | grep -Ei 'samba|acl' \
              || true
          )"

          if [ -z "${SAMBA_FILES}" ]; then
            echo "No Samba ACL JSON files found in source tree."
            echo "Continuing because package source itself will be verified after defconfig."
          else
            echo "${SAMBA_FILES}"
          fi

          FOUND=0

          while IFS= read -r file
          do
            [ -n "${file}" ] || continue

            if grep -n \
              '/usr/sbin/smbd' \
              "${file}" \
              | grep -E \
                '"exec"|"exec"[[:space:]]*:' \
                > /tmp/samba4-dangerous-acl.txt
            then
              echo
              echo "ERROR: Dangerous smbd exec ACL detected:"
              echo "${file}"
              cat /tmp/samba4-dangerous-acl.txt

              FOUND=1
            fi
          done <<< "${SAMBA_FILES}"

          if [ "${FOUND}" -ne 0 ]; then
            echo
            echo "Samba4 security check FAILED."
            exit 1
          fi

          echo
          echo "Samba4 source ACL check passed."

      # ============================================================
      # 12. Final defconfig
      # ============================================================

      - name: Final defconfig and verification
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          TARGET_SYMBOL="$(cat .n30pro-target-symbol)"

          make defconfig

          echo
          echo "============================================================"
          echo "FINAL TARGET CONFIGURATION"
          echo "============================================================"

          grep -E \
            '^CONFIG_TARGET_' \
            .config \
            | sort

          echo
          echo "Expected target:"
          echo "CONFIG_${TARGET_SYMBOL}=y"

          if ! grep -q \
            "^CONFIG_${TARGET_SYMBOL}=y$" \
            .config
          then
            echo
            echo "ERROR: Exact N30 Pro target was lost during final defconfig."

            echo
            echo "Current target:"
            grep -E \
              '^CONFIG_TARGET_.*DEVICE_|^CONFIG_TARGET_PROFILE=' \
              .config \
              | sort \
              || true

            exit 1
          fi

          if grep -q \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_openwrt_one=y$' \
            .config
          then
            echo
            echo "ERROR: OpenWrt One is selected."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "FINAL REQUIRED PACKAGES"
          echo "============================================================"

          REQUIRED_PACKAGES="
          luci
          luci-ssl
          luci-app-passwall
          luci-app-mwan3
          luci-app-samba4
          kmod-usb-xhci-hcd
          kmod-usb-xhci-mtk
          kmod-usb-net
          kmod-usb-net-cdc-ether
          kmod-usb-net-cdc-ncm
          kmod-usb-net-rndis
          kmod-usb-wdm
          kmod-usb-net-qmi-wwan
          kmod-usb-net-cdc-mbim
          kmod-usb-serial
          kmod-usb-serial-option
          kmod-usb-serial-wwan
          kmod-usb-acm
          usbutils
          usb-modeswitch
          uqmi
          umbim
          kmod-nft-socket
          kmod-nft-tproxy
          kmod-tun
          "

          for pkg in ${REQUIRED_PACKAGES}
          do
            if grep -q \
              "^CONFIG_PACKAGE_${pkg}=y$" \
              .config
            then
              echo "[OK] ${pkg}"
            else
              echo
              echo "ERROR: Required package not enabled:"
              echo "${pkg}"
              exit 1
            fi
          done

          echo
          echo "===== Verify PassWall transparent proxy ====="

          grep -q \
            '^CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y$' \
            .config

          echo "[OK] PassWall Nftables Transparent Proxy"

          echo
          echo "===== Verify USB package configuration ====="

          grep -E \
            '^CONFIG_PACKAGE_kmod-usb-(xhci|net|wdm|serial)' \
            .config \
            | sort

          echo
          echo "============================================================"
          echo "FINAL CONFIGURATION PASSED"
          echo "============================================================"

      # ============================================================
      # 13. Download sources
      # ============================================================

      - name: Download sources
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          make download \
            -j"$(nproc)" \
            V=s

      # ============================================================
      # 14. Build
      # ============================================================

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "===== Build ====="

          echo "CPU cores:"
          nproc

          echo
          echo "Target:"
          grep -E \
            '^CONFIG_TARGET_.*(DEVICE|PROFILE)' \
            .config \
            | sort

          echo
          echo "Build started."

          make \
            -j"$(nproc)" \
            V=s

      # ============================================================
      # 15. Verify build
      # ============================================================

      - name: Verify firmware output
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "BUILD OUTPUT"
          echo "============================================================"

          find bin/targets/mediatek/filogic \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort

          echo
          echo "============================================================"
          echo "SEARCH N30 PRO SYSUPGRADE IMAGE"
          echo "============================================================"

          SYSUPGRADE="$(
            find bin/targets/mediatek/filogic \
              -type f \
              \( \
                -iname '*n30*pro*sysupgrade*.bin' \
                -o \
                -iname '*n30-pro*sysupgrade*.bin' \
              \) \
              | head -n 1
          )"

          if [ -z "${SYSUPGRADE}" ]; then
            echo
            echo "ERROR: N30 Pro sysupgrade image was not found."

            echo
            echo "All generated images:"
            find bin/targets/mediatek/filogic \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo "N30 Pro sysupgrade:"
          echo "${SYSUPGRADE}"

          ls -lh "${SYSUPGRADE}"

          echo
          echo "============================================================"
          echo "SEARCH FACTORY IMAGE"
          echo "============================================================"

          find bin/targets/mediatek/filogic \
            -type f \
            \( \
              -iname '*n30*pro*factory*.bin' \
              -o \
              -iname '*n30-pro*factory*.bin' \
            \) \
            -print \
            || true

          echo
          echo "============================================================"
          echo "VERIFY XHCI MODULES"
          echo "============================================================"

          XHCI_FOUND=0

          if find build_dir \
            -type f \
            -name 'xhci-hcd.ko' \
            | grep -q .
          then
            echo "[OK] xhci-hcd.ko"
            XHCI_FOUND=$((XHCI_FOUND + 1))
          else
            echo "[ERROR] xhci-hcd.ko not found"
          fi

          if find build_dir \
            -type f \
            -name 'xhci-mtk-hcd.ko' \
            | grep -q .
          then
            echo "[OK] xhci-mtk-hcd.ko"
            XHCI_FOUND=$((XHCI_FOUND + 1))
          else
            echo "[ERROR] xhci-mtk-hcd.ko not found"
          fi

          if [ "${XHCI_FOUND}" -ne 2 ]; then
            echo
            echo "ERROR: N30 Pro USB xHCI modules were not both built."
            exit 1
          fi

          echo
          echo "Build verification passed."

      # ============================================================
      # 16. Generate checksums
      # ============================================================

      - name: Generate SHA256 checksums
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          cd bin/targets/mediatek/filogic

          sha256sum \
            *.bin \
            *.itb \
            *.tar.gz \
            2>/dev/null \
            | tee sha256sums-n30pro.txt \
            || true

          echo
          echo "===== SHA256 ====="

          cat sha256sums-n30pro.txt

      # ============================================================
      # 17. Upload artifacts
      # ============================================================

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*
          if-no-files-found: error
          retention-days: 14
