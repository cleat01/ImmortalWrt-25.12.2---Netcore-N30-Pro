name: Build ImmortalWrt 25.12.2 Netcore N30 Pro USB Fix Final

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)



      - name: Clone ImmortalWrt 25.12.2
        shell: bash
        run: |

          set -e

          git clone \
            --depth 1 \
            --branch v25.12.2 \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt



      - name: Clone N30 Pro patch
        shell: bash
        run: |

          set -e

          git clone \
            --depth 1 \
            https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
            n30-patch




      - name: Apply N30 Pro DTS patch
        shell: bash
        working-directory: immortalwrt
        run: |

          set -e

          bash ../n30-patch/scripts/apply-netcore-n30pro.sh ../n30-patch





      - name: Verify N30 Pro DTS USB
        shell: bash
        working-directory: immortalwrt
        run: |

          set -e


          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"


          test -f "$DTS"


          grep -q "Netcore N30 Pro" "$DTS"


          grep -q "usb-vbus" "$DTS"


          grep -q "GPIO_ACTIVE_HIGH" "$DTS"



          echo "DTS USB verification OK"






      - name: Update feeds
        shell: bash
        working-directory: immortalwrt
        run: |

          set -e

          ./scripts/feeds update -a

          ./scripts/feeds install -a






      - name: Create configuration
        shell: bash
        working-directory: immortalwrt
        run: |

          set -e


          cat > .config <<'EOF'


CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y


CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y



# USB 3

CONFIG_PACKAGE_kmod-usb3=y
CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
CONFIG_PACKAGE_kmod-usb-xhci-mtk=y


# USB storage

CONFIG_PACKAGE_kmod-usb-storage=y
CONFIG_PACKAGE_kmod-usb-storage-uas=y


# Filesystem

CONFIG_PACKAGE_kmod-fs-ext4=y
CONFIG_PACKAGE_kmod-fs-vfat=y
CONFIG_PACKAGE_kmod-fs-exfat=y



# USB 4G 5G modem

CONFIG_PACKAGE_kmod-usb-serial=y
CONFIG_PACKAGE_kmod-usb-serial-option=y
CONFIG_PACKAGE_kmod-usb-serial-wwan=y

CONFIG_PACKAGE_kmod-usb-wdm=y

CONFIG_PACKAGE_kmod-usb-net=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y


CONFIG_PACKAGE_usb-modeswitch=y
CONFIG_PACKAGE_usb-modeswitch-data=y

CONFIG_PACKAGE_uqmi=y
CONFIG_PACKAGE_umbim=y



# Network

CONFIG_PACKAGE_mwan3=y

CONFIG_PACKAGE_ipv6helper=y

CONFIG_PACKAGE_ip-full=y



# VPN

CONFIG_PACKAGE_wireguard-tools=y
CONFIG_PACKAGE_kmod-wireguard=y

CONFIG_PACKAGE_openvpn-openssl=y



# Future mesh tools

CONFIG_PACKAGE_kmod-tun=y

CONFIG_PACKAGE_curl=y

CONFIG_PACKAGE_wget-ssl=y

CONFIG_PACKAGE_ca-certificates=y



# Samba

CONFIG_PACKAGE_luci-app-samba4=y
CONFIG_PACKAGE_samba4-server=y
CONFIG_PACKAGE_wsdd2=y



# Debug

CONFIG_PACKAGE_usbutils=y

CONFIG_PACKAGE_htop=y


EOF




          make defconfig





      - name: Verify configuration
        shell: bash
        working-directory: immortalwrt
        run: |

          set -e


          grep -q \
          "CONFIG_PACKAGE_kmod-usb-xhci-mtk=y" \
          .config


          grep -q \
          "CONFIG_PACKAGE_kmod-usb-storage=y" \
          .config


          grep -q \
          "CONFIG_PACKAGE_wireguard-tools=y" \
          .config



          echo "Config OK"







      - name: Download packages
        shell: bash
        working-directory: immortalwrt
        run: |

          set -e

          make download -j4 V=s





      - name: Build firmware
        shell: bash
        working-directory: immortalwrt
        run: |

          set -e


          make -j$(nproc) V=s







      - name: Verify XHCI modules
        shell: bash
        working-directory: immortalwrt
        run: |

          set -e



          find build_dir \
          -name "xhci-hcd.ko"


          find build_dir \
          -name "xhci-mtk-hcd.ko"



          test "$(find build_dir -name xhci-hcd.ko | wc -l)" -gt 0


          test "$(find build_dir -name xhci-mtk-hcd.ko | wc -l)" -gt 0



          echo "XHCI modules OK"






      - name: Verify firmware
        shell: bash
        working-directory: immortalwrt
        run: |

          set -e


          TARGET="bin/targets/mediatek/filogic"


          test -d "$TARGET"


          ls -lh "$TARGET"



          find "$TARGET" \
          -type f \
          | grep -E "sysupgrade|factory"






      - name: Generate report
        shell: bash
        working-directory: immortalwrt
        run: |

          {

          echo "ImmortalWrt 25.12.2"

          echo "Netcore N30 Pro"

          echo

          echo "USB modules"

          find build_dir \
          -name "xhci*.ko"


          echo

          echo "Firmware"

          find bin/targets/mediatek/filogic \
          -type f


          } > build-report.txt





      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.2-Netcore-N30-Pro-USB-Fix

          path: |

            immortalwrt/bin/targets/mediatek/filogic/**

            immortalwrt/build-report.txt

          if-no-files-found: error

          retention-days: 30
