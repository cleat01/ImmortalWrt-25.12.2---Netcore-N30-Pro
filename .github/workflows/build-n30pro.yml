name: Build ImmortalWrt 25.12.2 - Netcore N30 Pro Complete

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IW_BRANCH: v25.12.2
  N30_PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. 安装编译环境
      # ============================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            nano \
            npm \
            openssh-client \
            patch \
            perl \
            python3 \
            python3-distutils \
            python3-pip \
            python3-setuptools \
            qemu-utils \
            rsync \
            swig \
            unzip \
            uuid-dev \
            wget \
            xsltproc \
            zlib1g-dev

      # ============================================================
      # 2. 下载 ImmortalWrt + N30 Pro 补丁
      #
      # 目录必须是：
      #
      # $GITHUB_WORKSPACE/
      # ├── immortalwrt/
      # └── Netcore-N30-Pro-patch-for-OpenWrt/
      # ============================================================
      - name: Clone ImmortalWrt and Netcore N30 Pro patch
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          git clone --depth=1 --branch "${IW_BRANCH}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          git clone --depth=1 \
            "${N30_PATCH_REPO}" \
            Netcore-N30-Pro-patch-for-OpenWrt

          echo "===== Workspace ====="
          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

      # ============================================================
      # 3. 应用 N30 Pro 官方社区适配
      # ============================================================
      - name: Apply Netcore N30 Pro adaptation
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "Apply Netcore N30 Pro adaptation"
          echo "========================================"

          test -f \
            ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh

          test -d \
            ../Netcore-N30-Pro-patch-for-OpenWrt/patches

          find ../Netcore-N30-Pro-patch-for-OpenWrt/patches \
            -maxdepth 1 \
            -type f \
            -name '*.patch' \
            -print

          bash ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh \
            ../Netcore-N30-Pro-patch-for-OpenWrt

      # ============================================================
      # 4. 验证 N30 Pro DTS / USB VBUS
      # ============================================================
      - name: Verify Netcore N30 Pro DTS and USB VBUS
        working-directory: immortalwrt
        run: |
          set -eux

          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

          test -f "$DTS"

          echo "===== DTS ====="
          sed -n '1,260p' "$DTS"

          echo "===== Required N30 Pro USB items ====="

          grep -q 'model.*N30 Pro' "$DTS"
          grep -q 'compatible.*netcore,n30-pro' "$DTS"

          # GPIO23
          grep -q '<&pio 23 GPIO_ACTIVE_HIGH>' "$DTS"

          # 5V USB VBUS
          grep -q '5000000' "$DTS"

          # regulator
          grep -q 'regulator-usb-vbus' "$DTS"

          # boot-on
          grep -q 'regulator-boot-on' "$DTS"

          # USB PHY
          grep -q '&usb_phy' "$DTS"

          # XHCI VBUS supply
          grep -q 'vbus-supply.*usb_vbus' "$DTS"

          echo "N30 Pro DTS USB VBUS verification: PASS"

      # ============================================================
      # 5. 验证 Device Tree / target integration
      # ============================================================
      - name: Verify board integration
        working-directory: immortalwrt
        run: |
          set -eux

          echo "===== Search N30 Pro integration ====="

          grep -Rni \
            'netcore-n30-pro' \
            target/linux/mediatek \
            | head -100

          echo "===== Device definition ====="

          grep -Rni \
            'Device/netcore_n30-pro' \
            target/linux/mediatek \
            || true

      # ============================================================
      # 6. PassWall feed
      #
      # 不直接依赖旧的 OpenWrt feed 里的旧 PassWall。
      # 使用 PassWall 官方当前仓库。
      # ============================================================
      - name: Add PassWall feeds
        working-directory: immortalwrt
        run: |
          set -eux

          cat >> feeds.conf.default <<'EOF'

          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          EOF

          echo "===== PassWall feeds ====="
          tail -10 feeds.conf.default

      # ============================================================
      # 7. 更新 / 安装 feeds
      # ============================================================
      - name: Update and install feeds
        working-directory: immortalwrt
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 8. 建立安全的软件包发现函数
      #
      # 重点：
      # 不再盲目写 CONFIG_PACKAGE_xxx=y。
      #
      # 如果当前 ImmortalWrt 25.12.2 源码中没有这个包：
      # -> SKIP
      #
      # 存在：
      # -> ENABLE
      #
      # 这样可以避免之前因为不存在的 package symbol
      # 导致 make defconfig 失败。
      # ============================================================
      - name: Prepare package selection helpers
        working-directory: immortalwrt
        run: |
          set -eux

          cat > /tmp/enable-package.sh <<'EOF'
          #!/bin/bash

          set -u

          PKG="$1"
          CONFIG_FILE="$2"
          REQUIRED="${3:-optional}"

          found=0

          # 普通 Package
          if grep -Rqs \
            -E "^[[:space:]]*(Package|define)[^#]*${PKG}" \
            package feeds target \
            2>/dev/null; then
            found=1
          fi

          # KernelPackage
          if grep -Rqs \
            -E "^[[:space:]]*(KernelPackage|define)[^#]*${PKG}" \
            package feeds target \
            2>/dev/null; then
            found=1
          fi

          # 更直接的 package 目录检测
          if find package feeds target \
            -type f \
            \( -name Makefile -o -name '*.mk' \) \
            -print0 2>/dev/null \
            | xargs -0 grep -l \
              -E "Package/${PKG}|KernelPackage/${PKG}" \
              2>/dev/null \
            | grep -q .; then
            found=1
          fi

          if [ "$found" = "1" ]; then
            echo "CONFIG_PACKAGE_${PKG}=y" >> "$CONFIG_FILE"
            echo "[ENABLE] $PKG"
            exit 0
          fi

          echo "[SKIP] $PKG (package definition not found)"

          if [ "$REQUIRED" = "required" ]; then
            echo "[ERROR] Required package not found: $PKG"
            exit 1
          fi
          EOF

          chmod +x /tmp/enable-package.sh

      # ============================================================
      # 9. 创建基础配置
      # ============================================================
      - name: Create base configuration
        working-directory: immortalwrt
        run: |
          set -eux

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore-n30-pro=y

          CONFIG_LUCI=y

          CONFIG_PACKAGE_luci=y

          # USB 3
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y

          # USB storage
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y

          # USB tools
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_usb-modeswitch=y

          # TUN
          CONFIG_PACKAGE_kmod-tun=y

          # nftables / firewall
          CONFIG_PACKAGE_nftables=y

          # useful networking
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_curl=y
          EOF

      # ============================================================
      # 10. USB 随身 WiFi / 4G / 5G / WWAN 模块
      # ============================================================
      - name: Add USB tethering and 4G 5G modem packages
        working-directory: immortalwrt
        run: |
          set -u

          CONFIG_FILE=".config"

          echo "========================================"
          echo "USB modem / tethering packages"
          echo "========================================"

          for pkg in \
            kmod-usb-net \
            kmod-usb-net-cdc-ether \
            kmod-usb-net-cdc-ncm \
            kmod-usb-net-rndis \
            kmod-usb-wdm \
            kmod-usb-net-qmi-wwan \
            kmod-usb-net-cdc-mbim \
            kmod-usb-serial \
            kmod-usb-serial-option \
            kmod-usb-serial-wwan \
            kmod-usb-serial-qualcomm \
            kmod-usb-serial-sierrawireless \
            kmod-usb-acm \
            kmod-usb-net-rtl8150 \
            kmod-usb-net-rtl8152 \
            kmod-usb-net-asix \
            kmod-usb-net-asix-ax88179 \
            kmod-usb-net-aqc111 \
            uqmi \
            umbim \
            luci-proto-qmi \
            luci-proto-mbim \
            luci-proto-ncm
          do
            /tmp/enable-package.sh "$pkg" "$CONFIG_FILE" optional \
              || true
          done

          echo
          echo "===== Selected USB / modem packages ====="

          grep '^CONFIG_PACKAGE_.*usb' .config || true
          grep '^CONFIG_PACKAGE_.*qmi' .config || true
          grep '^CONFIG_PACKAGE_.*mbim' .config || true
          grep '^CONFIG_PACKAGE_.*ncm' .config || true
          grep '^CONFIG_PACKAGE_.*rndis' .config || true

      # ============================================================
      # 11. PassWall 核心依赖
      #
      # 根据 PassWall 当前 Makefile：
      #
      # coreutils
      # coreutils-base64
      # coreutils-nohup
      # coreutils-timeout
      # curl
      # chinadns-ng
      # dns2socks
      # dnsmasq-full
      # ip-full
      # libuci-lua
      # lua
      # luci-compat
      # luci-lib-jsonc
      # microsocks
      # resolveip
      # tcping
      # lyaml
      # ============================================================
      - name: Add PassWall dependencies
        working-directory: immortalwrt
        run: |
          set -u

          CONFIG_FILE=".config"

          echo "========================================"
          echo "PassWall dependencies"
          echo "========================================"

          for pkg in \
            coreutils \
            coreutils-base64 \
            coreutils-nohup \
            coreutils-timeout \
            curl \
            chinadns-ng \
            dns2socks \
            dnsmasq-full \
            ip-full \
            libuci-lua \
            lua \
            luci-compat \
            luci-lib-jsonc \
            microsocks \
            resolveip \
            tcping \
            lyaml
          do
            /tmp/enable-package.sh "$pkg" "$CONFIG_FILE" optional \
              || true
          done

      # ============================================================
      # 12. PassWall nftables 内核依赖
      #
      # 这两个是之前你安装 PassWall 时最关键的缺失项：
      #
      # kmod-nft-socket
      # kmod-nft-tproxy
      #
      # 必须和本次编译的 6.12.103 kernel 一起生成。
      # ============================================================
      - name: Add PassWall nftables kernel dependencies
        working-directory: immortalwrt
        run: |
          set -e

          CONFIG_FILE=".config"

          echo "========================================"
          echo "PassWall nftables kernel modules"
          echo "========================================"

          /tmp/enable-package.sh \
            kmod-nft-socket \
            "$CONFIG_FILE" \
            required

          /tmp/enable-package.sh \
            kmod-nft-tproxy \
            "$CONFIG_FILE" \
            required

          # nftables related dependencies
          for pkg in \
            kmod-nft-nat \
            kmod-nf-reject \
            kmod-nf-reject6
          do
            /tmp/enable-package.sh \
              "$pkg" \
              "$CONFIG_FILE" \
              optional || true
          done

      # ============================================================
      # 13. PassWall 核心代理程序
      #
      # 这些不是全部强制需要。
      # 但预装后以后在 LuCI 中切换节点协议时更加方便。
      # ============================================================
      - name: Add PassWall proxy cores
        working-directory: immortalwrt
        run: |
          set -u

          CONFIG_FILE=".config"

          for pkg in \
            xray-core \
            sing-box \
            shadowsocks-rust-sslocal \
            shadowsocksr-libev-ssr-local \
            shadowsocksr-libev-ssr-redir \
            simple-obfs-client \
            v2ray-plugin \
            geoview \
            v2ray-geoip \
            v2ray-geosite \
            unzip \
            haproxy
          do
            /tmp/enable-package.sh \
              "$pkg" \
              "$CONFIG_FILE" \
              optional || true
          done

      # ============================================================
      # 14. PassWall / LuCI 语言包
      #
      # 注意：
      # PassWall 本体这里不直接装入 rootfs。
      #
      # CONFIG_PACKAGE_luci-app-passwall=m
      #
      # 会生成 APK，刷机后可以手动安装。
      # 由于依赖已经提前进入固件，因此不会再因为
      # kmod-nft-socket / kmod-nft-tproxy 等缺失而失败。
      # ============================================================
      - name: Select PassWall package for APK build
        working-directory: immortalwrt
        run: |
          set -eux

          if find feeds/passwall_luci package \
              -type f \
              -name Makefile \
              -print0 2>/dev/null \
              | xargs -0 grep -l \
                'Package/luci-app-passwall' \
              2>/dev/null \
              | grep -q .
          then
            echo "CONFIG_PACKAGE_luci-app-passwall=m" >> .config
            echo "PassWall package selected as module."
          else
            echo "PassWall Makefile not found."
            exit 1
          fi

      # ============================================================
      # 15. 运行 defconfig
      # ============================================================
      - name: Generate final configuration
        working-directory: immortalwrt
        run: |
          set -eux

          make defconfig

          echo
          echo "========================================"
          echo "FINAL TARGET"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config

          echo
          echo "========================================"
          echo "USB CONFIG"
          echo "========================================"

          grep '^CONFIG_PACKAGE_kmod-usb' .config || true

          echo
          echo "========================================"
          echo "PASSWALL CONFIG"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(kmod-nft|luci-app-passwall|xray|sing-box|chinadns|dns2socks|tcping|geoview|v2ray)' \
            .config \
            || true

      # ============================================================
      # 16. 最终配置严格检查
      # ============================================================
      - name: Verify final configuration
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "Target"
          echo "========================================"

          grep -Fxq \
            'CONFIG_TARGET_mediatek=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_mediatek_filogic=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore-n30-pro=y' \
            .config

          echo "Target configuration: PASS"

          echo
          echo "========================================"
          echo "Essential USB"
          echo "========================================"

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-usb3=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-usb-xhci-hcd=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-usb-xhci-mtk=y' \
            .config

          echo "USB configuration: PASS"

          echo
          echo "========================================"
          echo "PassWall kernel dependencies"
          echo "========================================"

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-nft-socket=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-nft-tproxy=y' \
            .config

          echo "PassWall nft kernel dependencies: PASS"

          echo
          echo "========================================"
          echo "PassWall package"
          echo "========================================"

          grep -Fxq \
            'CONFIG_PACKAGE_luci-app-passwall=m' \
            .config

          echo "PassWall APK build selection: PASS"

      # ============================================================
      # 17. 下载源码包
      # ============================================================
      - name: Download sources
        working-directory: immortalwrt
        run: |
          set -eux

          make download -j2 V=s

      # ============================================================
      # 18. 编译
      # ============================================================
      - name: Build firmware and packages
        working-directory: immortalwrt
        run: |
          set -eux

          make -j"$(nproc)" V=s

      # ============================================================
      # 19. 检查最终 kernel
      # ============================================================
      - name: Verify final kernel
        working-directory: immortalwrt
        run: |
          set -eux

          echo "===== Kernel config ====="

          find build_dir \
            -type f \
            -name .config \
            -path '*linux*' \
            -print \
            | head -20

          echo
          echo "===== Kernel version ====="

          find build_dir \
            -type f \
            -name Makefile \
            -path '*linux*' \
            | head -10

      # ============================================================
      # 20. 查找 XHCI 模块
      # ============================================================
      - name: Verify USB kernel modules
        working-directory: immortalwrt
        run: |
          set -eux

          echo "===== xhci-hcd.ko ====="

          find bin/ \
            build_dir/ \
            -type f \
            -name 'xhci-hcd.ko*' \
            -print

          echo
          echo "===== xhci-mtk-hcd.ko ====="

          find bin/ \
            build_dir/ \
            -type f \
            -name 'xhci-mtk-hcd.ko*' \
            -print

          echo
          echo "===== nft socket ====="

          find bin/ \
            build_dir/ \
            -type f \
            -name 'nft_socket.ko*' \
            -print

          echo
          echo "===== nft tproxy ====="

          find bin/ \
            build_dir/ \
            -type f \
            -name 'nft_tproxy.ko*' \
            -print

      # ============================================================
      # 21. 检查 PassWall APK
      # ============================================================
      - name: Verify PassWall APK
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "PassWall APK"
          echo "========================================"

          find bin/packages \
            -type f \
            \( \
              -name 'luci-app-passwall*.apk' \
              -o -name 'luci-i18n-passwall*.apk' \
            \) \
            -print \
            | sort

          COUNT="$(find bin/packages \
            -type f \
            -name 'luci-app-passwall*.apk' \
            | wc -l)"

          test "$COUNT" -ge 1

          echo "PassWall APK: PASS"

      # ============================================================
      # 22. 检查 USB / 4G / 5G APK
      # ============================================================
      - name: Verify USB modem packages
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "USB / modem packages"
          echo "========================================"

          find bin/packages \
            -type f \
            -name '*.apk' \
            | grep -Ei \
              'usb|qmi|mbim|ncm|rndis|serial|uqmi|umbim|modeswitch' \
            | sort \
            | head -200 \
            || true

      # ============================================================
      # 23. 检查固件镜像
      # ============================================================
      - name: Verify N30 Pro firmware image
        working-directory: immortalwrt
        run: |
          set -eux

          echo "========================================"
          echo "Firmware images"
          echo "========================================"

          find bin/targets/mediatek/filogic \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo
          echo "===== N30 Pro images ====="

          find bin/targets/mediatek/filogic \
            -type f \
            \( \
              -iname '*n30*' \
              -o -iname '*netcore*' \
            \) \
            -print

          test -n "$(find bin/targets/mediatek/filogic \
            -type f \
            \( -iname '*n30*' -o -iname '*netcore*' \) \
            -print -quit)"

      # ============================================================
      # 24. 生成构建报告
      # ============================================================
      - name: Generate build report
        working-directory: immortalwrt
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/build-report"

          {
            echo "========================================"
            echo "ImmortalWrt N30 Pro Build Report"
            echo "========================================"
            echo
            echo "ImmortalWrt: ${IW_BRANCH}"
            echo "Target: mediatek/filogic"
            echo "Device: Netcore N30 Pro"
            echo
            echo "========================================"
            echo "Target"
            echo "========================================"
            grep '^CONFIG_TARGET_' .config
            echo
            echo "========================================"
            echo "USB"
            echo "========================================"
            grep '^CONFIG_PACKAGE_.*usb' .config || true
            echo
            echo "========================================"
            echo "PassWall"
            echo "========================================"
            grep -E \
              '^CONFIG_PACKAGE_(luci-app-passwall|kmod-nft|xray|sing-box|chinadns|dns2socks|tcping|geoview|v2ray)' \
              .config \
              || true
            echo
            echo "========================================"
            echo "Firmware files"
            echo "========================================"
            find bin/targets/mediatek/filogic \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
            echo
            echo "========================================"
            echo "PassWall APK"
            echo "========================================"
            find bin/packages \
              -type f \
              -name 'luci-app-passwall*.apk' \
              -printf '%p\n' \
              | sort
          } > "$GITHUB_WORKSPACE/build-report/build-report.txt"

          cat "$GITHUB_WORKSPACE/build-report/build-report.txt"

      # ============================================================
      # 25. 整理最终产物
      # ============================================================
      - name: Collect artifacts
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/artifacts/firmware"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/passwall"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/usb"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/report"

          # 固件
          find immortalwrt/bin/targets/mediatek/filogic \
            -type f \
            \( \
              -iname '*n30*' \
              -o -iname '*netcore*' \
              -o -name '*.manifest' \
              -o -name 'sha256sums' \
            \) \
            -exec cp -v {} \
              "$GITHUB_WORKSPACE/artifacts/firmware/" \; \
            || true

          # PassWall
          find immortalwrt/bin/packages \
            -type f \
            \( \
              -name 'luci-app-passwall*.apk' \
              -o -name 'luci-i18n-passwall*.apk' \
            \) \
            -exec cp -v {} \
              "$GITHUB_WORKSPACE/artifacts/passwall/" \; \
            || true

          # USB / modem package
          find immortalwrt/bin/packages \
            -type f \
            -name '*.apk' \
            | grep -Ei \
              'usb|qmi|mbim|ncm|rndis|serial|uqmi|umbim|modeswitch' \
            | while read -r f; do
              cp -v "$f" \
                "$GITHUB_WORKSPACE/artifacts/usb/" \
                || true
            done

          cp -v \
            build-report/build-report.txt \
            "$GITHUB_WORKSPACE/artifacts/report/"

          echo "========================================"
          echo "Final artifacts"
          echo "========================================"

          find "$GITHUB_WORKSPACE/artifacts" \
            -type f \
            -printf '%p\n' \
            | sort

      # ============================================================
      # 26. 上传固件
      # ============================================================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12.2-Netcore-N30-Pro-Firmware
          path: artifacts/firmware
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 27. 上传 PassWall
      # ============================================================
      - name: Upload PassWall packages
        uses: actions/upload-artifact@v4
        with:
          name: PassWall-25.12-Netcore-N30-Pro
          path: artifacts/passwall
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 28. 上传 USB / 4G / 5G 包
      # ============================================================
      - name: Upload USB modem packages
        uses: actions/upload-artifact@v4
        with:
          name: USB-4G-5G-Modem-Packages
          path: artifacts/usb
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 29. 上传报告
      # ============================================================
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: N30-Pro-Build-Report
          path: artifacts/report
          if-no-files-found: error
          retention-days: 30
