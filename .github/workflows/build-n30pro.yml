name: Build ImmortalWrt 25.12.2 Netcore N30 Pro

on:
  workflow_dispatch:

env:
  IMMORTALWRT_TAG: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git

jobs:

  build:

    runs-on: ubuntu-24.04


    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zstd \
            file \
            patch


      - name: Clone ImmortalWrt
        run: |

          git clone \
            --depth 1 \
            --branch ${IMMORTALWRT_TAG} \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt



      - name: Clone N30 Pro adaptation patch
        run: |

          git clone \
            --depth 1 \
            ${PATCH_REPO} \
            n30pro-patch



      - name: Apply N30 Pro patch
        working-directory: immortalwrt
        run: |

          bash \
          ../n30pro-patch/scripts/apply-netcore-n30pro.sh \
          ../n30pro-patch



      - name: Verify N30 Pro target
        working-directory: immortalwrt
        run: |

          grep -R \
          "netcore,n30-pro\|netis,nx30v2" \
          target/linux/mediatek \
          || true



      - name: Add StarVPN package
        run: |

          if [ -d package/starvpn ]; then

            mkdir -p \
            immortalwrt/package/starvpn

            cp -a \
            package/starvpn/. \
            immortalwrt/package/starvpn/

          fi



      - name: Update feeds
        working-directory: immortalwrt
        run: |

          echo \
          "src-link starvpn $(pwd)/package/starvpn" \
          >> feeds.conf.default


          ./scripts/feeds update -a

          ./scripts/feeds install -a



      - name: Load configuration
        working-directory: immortalwrt
        run: |

          cp \
          ../configs/n30pro.config \
          .config


          make defconfig



      - name: Verify target configuration
        working-directory: immortalwrt
        run: |

          grep \
          CONFIG_TARGET_mediatek=y \
          .config


          grep \
          CONFIG_TARGET_mediatek_filogic=y \
          .config



      - name: Download packages
        working-directory: immortalwrt
        run: |

          make download \
          -j$(nproc)



      - name: Build firmware
        working-directory: immortalwrt
        run: |

          make \
          -j$(nproc) \
          V=s



      - name: Firmware check
        working-directory: immortalwrt
        run: |

          TARGET="bin/targets/mediatek/filogic"


          test -d ${TARGET}


          if find ${TARGET} \
          -iname "*h3c*" \
          -o -iname "*n60*"; then

              echo "Wrong device firmware detected"

              exit 1

          fi



      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.2-Netcore-N30-Pro

          path: immortalwrt/bin/targets/mediatek/filogic/
