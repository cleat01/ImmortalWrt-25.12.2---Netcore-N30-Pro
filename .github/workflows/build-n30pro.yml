name: Build ImmortalWrt 25.12.2 - Netcore N30 Pro Complete

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. 安装编译环境
      # ============================================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libelf-dev \
            libdw-dev \
            libtool \
            autoconf \
            automake \
            pkg-config \
            device-tree-compiler \
            qemu-utils

      # ============================================================
      # 2. 下载 ImmortalWrt 25.12.2
      # ============================================================
      - name: Clone ImmortalWrt 25.12.2
        run: |
          set -e

          git clone --depth=1 \
            --branch v25.12.2 \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

      # ============================================================
      # 3. 下载 N30 Pro 适配补丁
      # ============================================================
      - name: Clone Netcore N30 Pro patch
        working-directory: immortalwrt
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
            n30pro-patch

      # ============================================================
      # 4. 应用 N30 Pro 补丁
      # ============================================================
      - name: Apply Netcore N30 Pro patch
        working-directory: immortalwrt
        run: |
          set -e

          chmod +x \
            n30pro-patch/scripts/apply-netcore-n30pro.sh

          ./n30pro-patch/scripts/apply-netcore-n30pro.sh

      # ============================================================
      # 5. 验证 N30 Pro DTS
      # ============================================================
      - name: Verify N30 Pro DTS
        working-directory: immortalwrt
        run: |
          set -e

          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

          echo "========================================"
          echo "N30 PRO DTS CHECK"
          echo "========================================"

          test -f "$DTS"

          grep -n "Netcore N30 Pro" "$DTS"
          grep -n "mt7981" "$DTS"

          echo
          echo "===== USB VBUS ====="

          grep -n "usb_vbus" "$DTS"
          grep -n "regulator-usb-vbus" "$DTS"
          grep -n "regulator-boot-on" "$DTS"

          echo
          echo "===== GPIO 23 ====="

          grep -n "<&pio 23" "$DTS"
          grep -n "GPIO_ACTIVE_HIGH" "$DTS"

          echo
          echo "===== USB PHY ====="

          grep -n "&usb_phy" "$DTS"
          grep -n 'status = "okay"' "$DTS"

          echo
          echo "===== XHCI ====="

          grep -n "&xhci" "$DTS"
          grep -n "vbus-supply = <&usb_vbus>" "$DTS"

      # ============================================================
      # 6. 验证 N30 Pro 已加入目标设备
      # ============================================================
      - name: Verify N30 Pro target integration
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "N30 PRO TARGET INTEGRATION"
          echo "========================================"

          grep -Rni \
            "mt7981b-netcore-n30-pro" \
            target/linux/mediatek \
            2>/dev/null || true

          grep -Rni \
            "netcore-n30-pro" \
            target/linux/mediatek \
            2>/dev/null || true

      # ============================================================
      # 7. 更新全部软件包定义
      # ============================================================
      - name: Update feeds
        working-directory: immortalwrt
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo
          echo "========================================"
          echo "AVAILABLE FEEDS"
          echo "========================================"

          ./scripts/feeds list -s

      # ============================================================
      # 8. 检查我们要编译的软件包定义是否真的存在
      #
      # 如果某个包在 25.12.2 源码中不存在：
      # 在这里立即停止，而不是编译几个小时后才发现。
      # ============================================================
      - name: Preflight package definitions
        working-directory: immortalwrt
        run: |
          set -e

          check_package() {
            PKG="$1"

            if [[ "$PKG" == kmod-* ]]; then
              KPKG="${PKG#kmod-}"

              if grep -Rqs \
                --exclude-dir=.git \
                --include='*.mk' \
                --include='Makefile' \
                -E "^[[:space:]]*define KernelPackage/${KPKG}([[:space:]]|$)" \
                package \
                feeds \
                2>/dev/null; then

                echo "[PASS] $PKG"
              else
                echo "[FAIL] $PKG"
                echo "KernelPackage definition not found."
                exit 1
              fi

            else

              if grep -Rqs \
                --exclude-dir=.git \
                --include='*.mk' \
                --include='Makefile' \
                -E "^[[:space:]]*define Package/${PKG}([[:space:]]|$)" \
                package \
                feeds \
                2>/dev/null; then

                echo "[PASS] $PKG"
              else
                echo "[FAIL] $PKG"
                echo "Package definition not found."
                exit 1
              fi

            fi
          }

          echo "========================================"
          echo "CHECK REQUIRED KERNEL PACKAGES"
          echo "========================================"

          KERNEL_PACKAGES="
          kmod-usb-core
          kmod-usb3
          kmod-usb-xhci-hcd
          kmod-usb-xhci-mtk
          kmod-usb-storage
          kmod-fs-ext4
          kmod-fs-vfat

          kmod-usb-net
          kmod-usb-net-cdc-ether
          kmod-usb-net-cdc-ncm
          kmod-usb-net-cdc-eem
          kmod-usb-net-cdc-subset
          kmod-usb-net-huawei-cdc-ncm
          kmod-usb-net-ipheth
          kmod-usb-net-rndis
          kmod-usb-net-qmi-wwan
          kmod-usb-net-cdc-mbim
          kmod-usb-wdm

          kmod-usb-net-asix
          kmod-usb-net-asix-ax88179
          kmod-usb-net-aqc111
          kmod-usb-net-rtl8150
          kmod-usb-net-rtl8152

          kmod-usb-serial
          kmod-usb-serial-option
          kmod-usb-serial-wwan
          kmod-usb-serial-qualcomm
          kmod-usb-serial-sierrawireless
          kmod-usb-acm
          kmod-usb-net-sierrawireless

          kmod-wwan

          kmod-tun
          kmod-inet-diag
          kmod-netlink-diag

          kmod-nf-socket
          kmod-nf-tproxy
          kmod-nfnetlink
          kmod-nf-conntrack
          kmod-nf-conntrack-netlink
          kmod-nf-reject
          kmod-nf-reject6

          kmod-nft-core
          kmod-nft-fib
          kmod-nft-nat
          kmod-nft-offload
          kmod-nft-compat
          kmod-nft-socket
          kmod-nft-tproxy

          kmod-wireguard
          "

          for PKG in $KERNEL_PACKAGES; do
            check_package "$PKG"
          done

          echo
          echo "========================================"
          echo "CHECK REQUIRED USERSPACE PACKAGES"
          echo "========================================"

          USERSPACE_PACKAGES="
          dnsmasq-full
          ip-full
          ipt2socks
          dns2socks
          chinadns-ng
          geoview
          microsocks
          resolveip
          tcping
          lyaml

          libuci-lua
          lua
          luci-compat
          luci-lib-jsonc

          curl
          ca-bundle
          wget-ssl
          unzip

          usbutils
          usbids
          usb-modeswitch

          uqmi
          umbim
          libqmi
          libmbim

          wireguard-tools
          "

          for PKG in $USERSPACE_PACKAGES; do
            check_package "$PKG"
          done

          echo
          echo "========================================"
          echo "PACKAGE PREFLIGHT PASSED"
          echo "========================================"

      # ============================================================
      # 9. 写入完整配置
      # ============================================================
      - name: Configure firmware
        working-directory: immortalwrt
        run: |
          set -e

          cat > .config <<'EOF'

          # ========================================================
          # Target
          # ========================================================

          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore-n30-pro=y

          # ========================================================
          # APK
          # ========================================================

          CONFIG_USE_APK=y
          CONFIG_PER_FEED_REPO=y

          # 不使用旧 video feed，避免 25.12 包仓库出现 EOF/不存在问题
          # CONFIG_FEED_video is not set

          # ========================================================
          # LuCI
          # ========================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lib-jsonc=y

          # ========================================================
          # N30 Pro USB 3.0
          # ========================================================

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y

          CONFIG_PACKAGE_kmod-usb-storage=y

          # ========================================================
          # USB 文件系统
          # ========================================================

          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y

          # ========================================================
          # USB 网络设备
          #
          # 覆盖：
          # RNDIS
          # CDC-ECM
          # CDC-NCM
          # CDC-EEM
          # CDC-SUBSET
          # iPhone USB tethering
          # Huawei USB 网络设备
          # ========================================================

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-eem=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-subset=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-ipheth=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y

          # ========================================================
          # USB 4G / 5G / WWAN
          # ========================================================

          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y

          CONFIG_PACKAGE_kmod-usb-net-sierrawireless=y

          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
          CONFIG_PACKAGE_kmod-usb-serial-sierrawireless=y
          CONFIG_PACKAGE_kmod-usb-acm=y

          CONFIG_PACKAGE_kmod-wwan=y

          # ========================================================
          # USB 有线网卡 / USB Ethernet
          #
          # 顺便覆盖一些随身网卡设备的 USB Ethernet 模式
          # ========================================================

          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-aqc111=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8150=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y

          # ========================================================
          # USB / Modem 用户空间
          # ========================================================

          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_usbids=y
          CONFIG_PACKAGE_usb-modeswitch=y

          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_libqmi=y
          CONFIG_PACKAGE_libmbim=y

          # ========================================================
          # PassWall / NFT TProxy
          # ========================================================

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-netlink-diag=y

          CONFIG_PACKAGE_kmod-nf-socket=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nfnetlink=y
          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y

          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y

          CONFIG_PACKAGE_kmod-nft-core=y
          CONFIG_PACKAGE_kmod-nft-fib=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          # ========================================================
          # PassWall 常用用户空间依赖
          #
          # 不编译 luci-app-passwall 本体
          # 不编译 StarVPN
          # ========================================================

          CONFIG_PACKAGE_dnsmasq-full=y

          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipt2socks=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_microsocks=y
          CONFIG_PACKAGE_resolveip=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_lyaml=y

          CONFIG_PACKAGE_libuci-lua=y
          CONFIG_PACKAGE_lua=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lib-jsonc=y

          # ========================================================
          # 常用下载 / TLS / 解压工具
          # ========================================================

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_unzip=y

          # ========================================================
          # WireGuard
          # ========================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y

          EOF

          echo "========================================"
          echo "RUN MAKE DEFCONFIG"
          echo "========================================"

          make defconfig

      # ============================================================
      # 10. 显示最终 Target
      # ============================================================
      - name: Show final target configuration
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "FINAL TARGET CONFIG"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config || true

          echo
          echo "========================================"
          echo "APK / FEED CONFIG"
          echo "========================================"

          grep -E \
            '^CONFIG_(USE_APK|PER_FEED_REPO|FEED_)' \
            .config || true

      # ============================================================
      # 11. 检查最终配置
      # ============================================================
      - name: Verify final configuration
        working-directory: immortalwrt
        run: |
          set -e

          check_y() {
            KEY="$1"

            if grep -qx "${KEY}=y" .config; then
              echo "[PASS] ${KEY}=y"
            else
              echo "[FAIL] ${KEY}"
              grep -E "^${KEY}=" .config || true
              exit 1
            fi
          }

          check_not_set() {
            KEY="$1"

            if grep -qx "# ${KEY} is not set" .config; then
              echo "[PASS] ${KEY} is disabled"
            elif ! grep -q "^${KEY}=" .config; then
              echo "[PASS] ${KEY} is not configured"
            else
              echo "[FAIL] ${KEY} is enabled"
              grep -E "^${KEY}=" .config || true
              exit 1
            fi
          }

          echo "========================================"
          echo "TARGET"
          echo "========================================"

          check_y "CONFIG_TARGET_mediatek"
          check_y "CONFIG_TARGET_mediatek_filogic"
          check_y "CONFIG_TARGET_mediatek_filogic_DEVICE_netcore-n30-pro"

          echo
          echo "========================================"
          echo "APK"
          echo "========================================"

          check_y "CONFIG_USE_APK"
          check_y "CONFIG_PER_FEED_REPO"

          check_not_set "CONFIG_FEED_video"

          echo
          echo "========================================"
          echo "N30 PRO USB"
          echo "========================================"

          check_y "CONFIG_PACKAGE_kmod-usb-core"
          check_y "CONFIG_PACKAGE_kmod-usb3"
          check_y "CONFIG_PACKAGE_kmod-usb-xhci-hcd"
          check_y "CONFIG_PACKAGE_kmod-usb-xhci-mtk"
          check_y "CONFIG_PACKAGE_kmod-usb-storage"

          echo
          echo "========================================"
          echo "USB STORAGE"
          echo "========================================"

          check_y "CONFIG_PACKAGE_kmod-fs-ext4"
          check_y "CONFIG_PACKAGE_kmod-fs-vfat"

          echo
          echo "========================================"
          echo "USB WIFI / USB NETWORK / TETHERING"
          echo "========================================"

          check_y "CONFIG_PACKAGE_kmod-usb-net"
          check_y "CONFIG_PACKAGE_kmod-usb-net-cdc-ether"
          check_y "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm"
          check_y "CONFIG_PACKAGE_kmod-usb-net-cdc-eem"
          check_y "CONFIG_PACKAGE_kmod-usb-net-cdc-subset"
          check_y "CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm"
          check_y "CONFIG_PACKAGE_kmod-usb-net-ipheth"
          check_y "CONFIG_PACKAGE_kmod-usb-net-rndis"

          echo
          echo "========================================"
          echo "4G / 5G WWAN"
          echo "========================================"

          check_y "CONFIG_PACKAGE_kmod-usb-wdm"
          check_y "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan"
          check_y "CONFIG_PACKAGE_kmod-usb-net-cdc-mbim"
          check_y "CONFIG_PACKAGE_kmod-usb-net-sierrawireless"

          check_y "CONFIG_PACKAGE_kmod-usb-serial"
          check_y "CONFIG_PACKAGE_kmod-usb-serial-option"
          check_y "CONFIG_PACKAGE_kmod-usb-serial-wwan"
          check_y "CONFIG_PACKAGE_kmod-usb-serial-qualcomm"
          check_y "CONFIG_PACKAGE_kmod-usb-serial-sierrawireless"
          check_y "CONFIG_PACKAGE_kmod-usb-acm"
          check_y "CONFIG_PACKAGE_kmod-wwan"

          echo
          echo "========================================"
          echo "MODEM USERSPACE"
          echo "========================================"

          check_y "CONFIG_PACKAGE_usbutils"
          check_y "CONFIG_PACKAGE_usbids"
          check_y "CONFIG_PACKAGE_usb-modeswitch"
          check_y "CONFIG_PACKAGE_uqmi"
          check_y "CONFIG_PACKAGE_umbim"
          check_y "CONFIG_PACKAGE_libqmi"
          check_y "CONFIG_PACKAGE_libmbim"

          echo
          echo "========================================"
          echo "PASSWALL / TPROXY"
          echo "========================================"

          check_y "CONFIG_PACKAGE_kmod-tun"
          check_y "CONFIG_PACKAGE_kmod-inet-diag"
          check_y "CONFIG_PACKAGE_kmod-netlink-diag"

          check_y "CONFIG_PACKAGE_kmod-nf-socket"
          check_y "CONFIG_PACKAGE_kmod-nf-tproxy"
          check_y "CONFIG_PACKAGE_kmod-nfnetlink"
          check_y "CONFIG_PACKAGE_kmod-nf-conntrack"
          check_y "CONFIG_PACKAGE_kmod-nf-conntrack-netlink"
          check_y "CONFIG_PACKAGE_kmod-nf-reject"
          check_y "CONFIG_PACKAGE_kmod-nf-reject6"

          check_y "CONFIG_PACKAGE_kmod-nft-core"
          check_y "CONFIG_PACKAGE_kmod-nft-fib"
          check_y "CONFIG_PACKAGE_kmod-nft-nat"
          check_y "CONFIG_PACKAGE_kmod-nft-offload"
          check_y "CONFIG_PACKAGE_kmod-nft-compat"
          check_y "CONFIG_PACKAGE_kmod-nft-socket"
          check_y "CONFIG_PACKAGE_kmod-nft-tproxy"

          echo
          echo "========================================"
          echo "PASSWALL USERSPACE"
          echo "========================================"

          check_y "CONFIG_PACKAGE_dnsmasq-full"
          check_y "CONFIG_PACKAGE_ip-full"
          check_y "CONFIG_PACKAGE_ipt2socks"
          check_y "CONFIG_PACKAGE_dns2socks"
          check_y "CONFIG_PACKAGE_chinadns-ng"
          check_y "CONFIG_PACKAGE_geoview"
          check_y "CONFIG_PACKAGE_microsocks"
          check_y "CONFIG_PACKAGE_resolveip"
          check_y "CONFIG_PACKAGE_tcping"
          check_y "CONFIG_PACKAGE_lyaml"

          check_y "CONFIG_PACKAGE_libuci-lua"
          check_y "CONFIG_PACKAGE_lua"
          check_y "CONFIG_PACKAGE_luci-compat"
          check_y "CONFIG_PACKAGE_luci-lib-jsonc"

          echo
          echo "========================================"
          echo "WIREGUARD"
          echo "========================================"

          check_y "CONFIG_PACKAGE_kmod-wireguard"
          check_y "CONFIG_PACKAGE_wireguard-tools"

          echo
          echo "========================================"
          echo "STARVPN CHECK"
          echo "========================================"

          if grep -RniE \
            'starvpn|xingkong|星空组网' \
            .config \
            package \
            feeds \
            2>/dev/null; then

            echo
            echo "[FAIL] StarVPN related content detected."
            exit 1
          fi

          echo "[PASS] StarVPN / 星空组网 is NOT included."

          echo
          echo "========================================"
          echo "ALL CONFIGURATION CHECKS PASSED"
          echo "========================================"

      # ============================================================
      # 12. 显示 USB / TPROXY 相关配置
      # ============================================================
      - name: Show selected packages
        working-directory: immortalwrt
        run: |
          echo "========================================"
          echo "SELECTED KERNEL / NETWORK PACKAGES"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_kmod-(usb|wwan|tun|inet-diag|netlink-diag|nf-|nft-|wireguard)' \
            .config \
            | sort || true

          echo
          echo "========================================"
          echo "SELECTED USERSPACE PACKAGES"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(dnsmasq-full|ip-full|ipt2socks|dns2socks|chinadns-ng|geoview|microsocks|resolveip|tcping|lyaml|uqmi|umbim|libqmi|libmbim|usbutils|usbids|usb-modeswitch|wireguard-tools)' \
            .config \
            | sort || true

      # ============================================================
      # 13. 下载编译源码
      # ============================================================
      - name: Download sources
        working-directory: immortalwrt
        run: |
          set -e

          make download -j2 V=s

      # ============================================================
      # 14. 编译完整固件
      # ============================================================
      - name: Build firmware
        working-directory: immortalwrt
        run: |
          set -e

          make -j$(nproc) V=s

      # ============================================================
      # 15. 最终检查 XHCI
      # ============================================================
      - name: Verify XHCI modules
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "XHCI MODULE CHECK"
          echo "========================================"

          find build_dir \
            -type f \
            \( \
              -name 'xhci-hcd.ko' \
              -o -name 'xhci-mtk-hcd.ko' \
            \) \
            -print

          test -n "$(find build_dir -type f -name 'xhci-hcd.ko' -print -quit)"
          test -n "$(find build_dir -type f -name 'xhci-mtk-hcd.ko' -print -quit)"

          echo "[PASS] xhci-hcd.ko"
          echo "[PASS] xhci-mtk-hcd.ko"

      # ============================================================
      # 16. 最终检查 PassWall 所需模块
      # ============================================================
      - name: Verify proxy kernel modules
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "PROXY MODULE CHECK"
          echo "========================================"

          MODULES="
          tun.ko
          inet_diag.ko
          netlink_diag.ko
          nf_socket.ko
          nf_tproxy_core.ko
          nft_socket.ko
          nft_tproxy.ko
          "

          for MOD in $MODULES; do
            echo
            echo "----- $MOD -----"

            find build_dir \
              -type f \
              -name "$MOD" \
              -print \
              | head -20 || true
          done

      # ============================================================
      # 17. 最终检查 USB 网络 / WWAN 模块
      # ============================================================
      - name: Verify USB network modules
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "USB NETWORK MODULE CHECK"
          echo "========================================"

          find build_dir \
            -type f \
            \( \
              -name 'cdc_ether.ko' \
              -o -name 'cdc_ncm.ko' \
              -o -name 'cdc_eem.ko' \
              -o -name 'cdc_subset.ko' \
              -o -name 'huawei_cdc_ncm.ko' \
              -o -name 'rndis_host.ko' \
              -o -name 'qmi_wwan.ko' \
              -o -name 'cdc_mbim.ko' \
              -o -name 'cdc_wdm.ko' \
              -o -name 'usb_wwan.ko' \
              -o -name 'option.ko' \
              -o -name 'ipheth.ko' \
              -o -name 'sierra_net.ko' \
              -o -name 'sierra.ko' \
            \) \
            -print \
            | sort -u

      # ============================================================
      # 18. 写入第一次启动时的 APK 源修正
      #
      # 目的：
      # - 去掉 JLU
      # - 去掉 Vsean
      # - 保留官方 ImmortalWrt
      #
      # 这不会碰 APK 签名校验，也不会关闭签名验证。
      # ============================================================
      - name: Install APK repository normalization script
        working-directory: immortalwrt
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/90-n30pro-apk-feed <<'EOF'
          #!/bin/sh

          FEED_FILE="/etc/apk/repositories.d/distfeeds.list"

          if [ -f "$FEED_FILE" ]; then
              sed -i -E \
                  's#https://[^/]+/(immortalwrt|openwrt)#https://downloads.immortalwrt.org#g' \
                  "$FEED_FILE"
          fi

          if uci -q get system.@imm_init[0] >/dev/null 2>&1; then
              uci -q set system.@imm_init[0].apk_mirror='https://downloads.immortalwrt.org' || true
              uci -q commit system || true
          fi

          rm -f /etc/uci-defaults/90-n30pro-apk-feed

          exit 0
          EOF

          chmod 0755 files/etc/uci-defaults/90-n30pro-apk-feed

          echo "========================================"
          echo "APK REPOSITORY NORMALIZATION SCRIPT"
          echo "========================================"

          cat files/etc/uci-defaults/90-n30pro-apk-feed

      # ============================================================
      # 19. 检查最终文件系统中 APK 配置
      # ============================================================
      - name: Verify APK repository configuration
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "SEARCH APK FEED CONFIGURATION"
          echo "========================================"

          find build_dir \
            -type f \
            -path '*/etc/apk/repositories.d/distfeeds.list' \
            -print \
            -exec cat {} \; \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "CHECK FIRST BOOT APK SCRIPT"
          echo "========================================"

          test -f files/etc/uci-defaults/90-n30pro-apk-feed

          echo "[PASS] APK normalization script installed."

      # ============================================================
      # 20. 检查最终 RootFS 模块
      # ============================================================
      - name: Verify final rootfs modules
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "FINAL ROOTFS MODULE CHECK"
          echo "========================================"

          find build_dir \
            -type f \
            -path '*/root-*/lib/modules/*' \
            \( \
              -name 'xhci-hcd.ko' \
              -o -name 'xhci-mtk-hcd.ko' \
              -o -name 'tun.ko' \
              -o -name 'inet_diag.ko' \
              -o -name 'netlink_diag.ko' \
              -o -name 'nf_socket.ko' \
              -o -name 'nf_tproxy_core.ko' \
              -o -name 'nft_socket.ko' \
              -o -name 'nft_tproxy.ko' \
              -o -name 'cdc_ether.ko' \
              -o -name 'cdc_ncm.ko' \
              -o -name 'rndis_host.ko' \
              -o -name 'qmi_wwan.ko' \
              -o -name 'cdc_mbim.ko' \
              -o -name 'option.ko' \
              -o -name 'usb_wwan.ko' \
            \) \
            -print \
            | sort -u

      # ============================================================
      # 21. 检查 N30 Pro 最终固件
      # ============================================================
      - name: Verify N30 Pro firmware image
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "FINAL FIRMWARE IMAGE"
          echo "========================================"

          find bin/targets/mediatek/filogic \
            -maxdepth 2 \
            -type f \
            \( \
              -name '*n30*' \
              -o -name '*netcore*' \
              -o -name '*sysupgrade*' \
              -o -name '*factory*' \
            \) \
            -print \
            | sort

      # ============================================================
      # 22. 生成构建报告
      # ============================================================
      - name: Generate build report
        working-directory: immortalwrt
        run: |
          set -e

          {
            echo "=================================================="
            echo "ImmortalWrt 25.12.2 - Netcore N30 Pro"
            echo "Complete Build Report"
            echo "=================================================="
            echo

            echo "ImmortalWrt commit:"
            git rev-parse HEAD
            echo

            echo "Target:"
            grep '^CONFIG_TARGET_' .config || true
            echo

            echo "APK:"
            grep -E '^CONFIG_(USE_APK|PER_FEED_REPO|FEED_)' \
              .config || true
            echo

            echo "USB:"
            grep -E \
              '^CONFIG_PACKAGE_kmod-usb' \
              .config \
              | sort || true
            echo

            echo "WWAN:"
            grep -E \
              '^CONFIG_PACKAGE_(kmod-wwan|kmod-usb-net-qmi|kmod-usb-net-cdc-mbim|kmod-usb-serial|kmod-usb-wdm|uqmi|umbim|libqmi|libmbim|usb-modeswitch)' \
              .config \
              | sort || true
            echo

            echo "PassWall kernel:"
            grep -E \
              '^CONFIG_PACKAGE_kmod-(tun|inet-diag|netlink-diag|nf-|nft-)' \
              .config \
              | sort || true
            echo

            echo "PassWall userspace:"
            grep -E \
              '^CONFIG_PACKAGE_(dnsmasq-full|ip-full|ipt2socks|dns2socks|chinadns-ng|geoview|microsocks|resolveip|tcping|lyaml)' \
              .config \
              | sort || true
            echo

            echo "WireGuard:"
            grep -E \
              '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools)' \
              .config \
              | sort || true
            echo

            echo "StarVPN:"
            echo "NOT INCLUDED"
            echo

            echo "Images:"
            find bin/targets/mediatek/filogic \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

          } > build-report.txt

          cat build-report.txt

      # ============================================================
      # 23. 上传最终固件
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-complete
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*
            immortalwrt/build-report.txt
          if-no-files-found: error
          retention-days: 7
