name: Build ImmortalWrt 25.12.2 - Netcore N30 Pro USB + KMOD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Install build dependencies
      # ============================================================
      - name: Install ImmortalWrt build dependencies
        shell: bash
        run: |
          set -e

          sudo bash -c \
            'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      # ============================================================
      # 2. Clone exact ImmortalWrt 25.12.2 source
      # ============================================================
      - name: Clone ImmortalWrt 25.12.2
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch v25.12.2 \
            --single-branch \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo "========================================"
          echo "ImmortalWrt source information"
          echo "========================================"

          echo "Branch/tag:"
          git describe --tags --always || true

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Status:"
          git status --short

          echo "========================================"

      # ============================================================
      # 3. Clone N30 Pro adaptation
      # ============================================================
      - name: Clone N30 Pro adaptation
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --single-branch \
            https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
            n30-patch

          echo "========================================"
          echo "N30 Pro adaptation repository"
          echo "========================================"

          cd n30-patch

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Repository contents:"
          find . -maxdepth 3 -type f -print | sort

          echo "========================================"

      # ============================================================
      # 4. Apply N30 Pro adaptation
      # ============================================================
      - name: Apply N30 Pro adaptation
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          bash ../n30-patch/scripts/apply-netcore-n30pro.sh ../n30-patch

      # ============================================================
      # 5. Verify N30 Pro DTS / USB VBUS
      # ============================================================
      - name: Verify N30 Pro DTS and USB VBUS
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

          echo "========================================"
          echo "Verify N30 Pro DTS"
          echo "========================================"

          test -f "$DTS"

          echo
          echo "===== Entire DTS ====="
          cat "$DTS"

          echo
          echo "===== Verify model ====="

          grep -Fq \
            'model = "Netcore N30 Pro";' \
            "$DTS"

          echo
          echo "===== Verify compatible ====="

          grep -Fq \
            'compatible = "netcore,n30-pro", "mediatek,mt7981";' \
            "$DTS"

          echo
          echo "===== Verify USB VBUS GPIO23 ====="

          grep -Fq \
            'gpio = <&pio 23 GPIO_ACTIVE_HIGH>;' \
            "$DTS"

          echo
          echo "===== Verify VBUS 5V minimum ====="

          grep -Fq \
            'regulator-min-microvolt = <5000000>;' \
            "$DTS"

          echo
          echo "===== Verify VBUS 5V maximum ====="

          grep -Fq \
            'regulator-max-microvolt = <5000000>;' \
            "$DTS"

          echo
          echo "===== Verify regulator boot-on ====="

          grep -Fq \
            'regulator-boot-on;' \
            "$DTS"

          echo
          echo "===== Verify USB VBUS regulator name ====="

          grep -Fq \
            'regulator-name = "usb-vbus";' \
            "$DTS"

          echo
          echo "===== Verify USB PHY ====="

          USB_PHY_BLOCK="$(
            grep -A8 -B3 \
              '&usb_phy' \
              "$DTS"
          )"

          echo "$USB_PHY_BLOCK"

          echo "$USB_PHY_BLOCK" \
            | grep -Fq 'status = "okay";'

          echo
          echo "===== Verify XHCI ====="

          XHCI_BLOCK="$(
            grep -A10 -B3 \
              '&xhci' \
              "$DTS"
          )"

          echo "$XHCI_BLOCK"

          echo "$XHCI_BLOCK" \
            | grep -Fq 'vbus-supply = <&usb_vbus>;'

          echo "$XHCI_BLOCK" \
            | grep -Fq 'status = "okay";'

          echo
          echo "N30 Pro DTS / USB VBUS verification PASSED."

      # ============================================================
      # 6. Verify N30 Pro board integration
      # ============================================================
      - name: Verify N30 Pro board integration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          IMAGE_FILE="target/linux/mediatek/image/filogic.mk"
          NET_FILE="target/linux/mediatek/filogic/base-files/etc/board.d/02_network"
          WIFI_FILE="target/linux/mediatek/filogic/base-files/etc/hotplug.d/ieee80211/11_fix_wifi_mac"

          echo "========================================"
          echo "Verify N30 Pro board integration"
          echo "========================================"

          test -f "$IMAGE_FILE"
          test -f "$NET_FILE"
          test -f "$WIFI_FILE"

          echo
          echo "===== Device definition ====="

          grep -Fq \
            'define Device/netcore_n30-pro' \
            "$IMAGE_FILE"

          grep -A20 -B2 \
            '^define Device/netcore_n30-pro$' \
            "$IMAGE_FILE"

          echo
          echo "===== Verify DTS ====="

          grep -A20 \
            '^define Device/netcore_n30-pro$' \
            "$IMAGE_FILE" \
            | grep -Fq \
              'DEVICE_DTS := mt7981b-netcore-n30-pro'

          echo
          echo "===== Verify board network ====="

          grep -Fq \
            'netcore,n30-pro' \
            "$NET_FILE"

          echo
          echo "===== Verify Wi-Fi MAC handling ====="

          grep -Fq \
            'netcore,n30-pro' \
            "$WIFI_FILE"

          echo
          echo "N30 Pro board integration verification PASSED."

      # ============================================================
      # 7. Verify USB XHCI package definitions
      # ============================================================
      - name: Verify USB XHCI package definitions
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          USB_MK="package/kernel/linux/modules/usb.mk"

          echo "========================================"
          echo "Verify USB XHCI package definitions"
          echo "========================================"

          test -f "$USB_MK"

          grep -q \
            '^define KernelPackage/usb3$' \
            "$USB_MK"

          grep -q \
            '^define KernelPackage/usb-xhci-hcd$' \
            "$USB_MK"

          grep -q \
            '^define KernelPackage/usb-xhci-mtk$' \
            "$USB_MK"

          echo
          echo "===== usb3 ====="

          grep -n \
            -A20 \
            -B3 \
            '^define KernelPackage/usb3$' \
            "$USB_MK"

          echo
          echo "===== usb-xhci-hcd ====="

          grep -n \
            -A20 \
            -B3 \
            '^define KernelPackage/usb-xhci-hcd$' \
            "$USB_MK"

          echo
          echo "===== usb-xhci-mtk ====="

          grep -n \
            -A25 \
            -B3 \
            '^define KernelPackage/usb-xhci-mtk$' \
            "$USB_MK"

          echo
          echo "===== Verify MTK XHCI KCONFIG ====="

          grep -A20 \
            '^define KernelPackage/usb-xhci-mtk$' \
            "$USB_MK" \
            | grep -Fq \
              'CONFIG_USB_XHCI_MTK'

          echo
          echo "===== Verify MTK XHCI module ====="

          grep -A25 \
            '^define KernelPackage/usb-xhci-mtk$' \
            "$USB_MK" \
            | grep -Fq \
              'xhci-mtk-hcd.ko'

          echo
          echo "USB XHCI package definition verification PASSED."

      # ============================================================
      # 8. Update feeds
      # ============================================================
      - name: Update and install feeds
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 9. Configure N30 Pro
      #
      # IMPORTANT:
      #
      # ALL_KMODS=y
      #   -> all available kmod packages default to m
      #   -> all target-compatible kernel modules are compiled
      #   -> they do NOT all enter the firmware rootfs
      #
      # The modules explicitly set to y below are the modules we
      # want immediately available after flashing.
      #
      # StarVPN client itself is NOT selected.
      # ============================================================
      - name: Configure N30 Pro
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore-n30-pro=y

          # --------------------------------------------------------
          # APK
          # --------------------------------------------------------
          CONFIG_USE_APK=y
          CONFIG_SIGNED_PACKAGES=y
          CONFIG_SIGNATURE_CHECK=y
          CONFIG_SIGN_EACH_PACKAGE=y

          # --------------------------------------------------------
          # Per-feed repository
          # --------------------------------------------------------
          CONFIG_PER_FEED_REPO=y
          CONFIG_FEED_packages=y
          CONFIG_FEED_luci=y
          CONFIG_FEED_routing=y
          CONFIG_FEED_telephony=y

          # --------------------------------------------------------
          # Build all available kernel modules as packages
          #
          # They default to m, so they do not all enter rootfs.
          # --------------------------------------------------------
          CONFIG_ALL_KMODS=y

          # --------------------------------------------------------
          # LuCI
          # --------------------------------------------------------
          CONFIG_PACKAGE_luci=y

          # ========================================================
          # USB 3.0 / XHCI
          # These remain built INTO the firmware.
          # ========================================================

          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y

          CONFIG_PACKAGE_kmod-usb-storage=y

          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y

          # ========================================================
          # VPN / TPROXY / PassWall compatibility
          #
          # These are the exact families already observed missing
          # on the current N30 Pro firmware.
          # ========================================================

          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-netlink-diag=y
          CONFIG_PACKAGE_kmod-tun=y

          CONFIG_PACKAGE_kmod-nfnetlink=y
          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y

          CONFIG_PACKAGE_kmod-nf-socket=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y

          CONFIG_PACKAGE_kmod-nft-core=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          # --------------------------------------------------------
          # StarVPN:
          #
          # Do NOT compile StarVPN itself.
          # The client will be installed later as an external APK.
          #
          # kmod-tun is included above because userspace VPN/gateway
          # clients commonly require /dev/net/tun.
          # --------------------------------------------------------

          # No CONFIG_PACKAGE_starvpn
          # No CONFIG_PACKAGE_star-client
          # No StarVPN source repository
          EOF

          echo "========================================"
          echo "Initial .config"
          echo "========================================"

          cat .config

          echo
          echo "========================================"
          echo "Running make defconfig"
          echo "========================================"

          make defconfig

          echo
          echo "Configuration generated successfully."

      # ============================================================
      # 10. Verify important configuration after defconfig
      # ============================================================
      - name: Verify final configuration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "Verify final configuration"
          echo "========================================"

          echo
          echo "===== Target ====="

          grep -Fxq \
            'CONFIG_TARGET_mediatek=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_mediatek_filogic=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore-n30-pro=y' \
            .config

          echo
          echo "===== APK ====="

          grep -Fxq \
            'CONFIG_USE_APK=y' \
            .config

          grep -Fxq \
            'CONFIG_SIGNED_PACKAGES=y' \
            .config

          grep -Fxq \
            'CONFIG_SIGNATURE_CHECK=y' \
            .config

          grep -Fxq \
            'CONFIG_SIGN_EACH_PACKAGE=y' \
            .config

          echo
          echo "===== ALL_KMODS ====="

          grep -Fxq \
            'CONFIG_ALL_KMODS=y' \
            .config

          # ========================================================
          # Required kernel modules
          # ========================================================

          REQUIRED_KMODS=(
            kmod-usb3
            kmod-usb-xhci-hcd
            kmod-usb-xhci-mtk
            kmod-usb-storage
            kmod-fs-ext4
            kmod-fs-vfat

            kmod-inet-diag
            kmod-netlink-diag
            kmod-tun

            kmod-nfnetlink
            kmod-nf-conntrack
            kmod-nf-conntrack-netlink
            kmod-nf-socket
            kmod-nf-tproxy

            kmod-nft-core
            kmod-nft-socket
            kmod-nft-tproxy
          )

          echo
          echo "===== Required kernel modules ====="

          for pkg in "${REQUIRED_KMODS[@]}"; do
            echo "Checking $pkg ..."

            grep -Fxq \
              "CONFIG_PACKAGE_${pkg}=y" \
              .config \
              || {
                echo
                echo "ERROR:"
                echo "Required package $pkg was not kept as =y after make defconfig."
                exit 1
              }
          done

          echo
          echo "===== KMOD configuration summary ====="

          grep '^CONFIG_PACKAGE_kmod-' .config \
            | sort

          echo
          echo "Required kernel-module configuration verification PASSED."

      # ============================================================
      # 11. Show kernel-module build strategy
      # ============================================================
      - name: Audit ALL_KMODS effective selection
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "ALL_KMODS audit"
          echo "========================================"

          ALL_KMODS_COUNT="$(
            grep -E '^CONFIG_PACKAGE_kmod-.+=m$' .config \
              | wc -l
          )"

          ROOTFS_KMOD_Y_COUNT="$(
            grep -E '^CONFIG_PACKAGE_kmod-.+=y$' .config \
              | wc -l
          )"

          echo
          echo "KMOD packages selected as =m: $ALL_KMODS_COUNT"
          echo "KMOD packages selected as =y: $ROOTFS_KMOD_Y_COUNT"

          if [ "$ALL_KMODS_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: ALL_KMODS did not result in any =m kmod packages."
            exit 1
          fi

          echo
          echo "ALL_KMODS is active."
          echo "Most kmods will be built as packages rather than placed in rootfs."

      # ============================================================
      # 12. Download sources
      # ============================================================
      - name: Download sources
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          make download -j2 V=s

      # ============================================================
      # 13. Build firmware
      # ============================================================
      - name: Build firmware
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "Start firmware build"
          echo "========================================"

          make -j"$(nproc)" \
            || make -j1 V=s

      # ============================================================
      # 14. Verify REAL XHCI modules
      # ============================================================
      - name: Verify actual XHCI kernel modules
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "Verify actual XHCI kernel modules"
          echo "========================================"

          XHCI_HCD_COUNT="$(
            find build_dir \
              -type f \
              -name 'xhci-hcd.ko' \
              -print \
              | wc -l
          )"

          XHCI_MTK_COUNT="$(
            find build_dir \
              -type f \
              -name 'xhci-mtk-hcd.ko' \
              -print \
              | wc -l
          )"

          echo
          echo "xhci-hcd.ko count: $XHCI_HCD_COUNT"
          echo "xhci-mtk-hcd.ko count: $XHCI_MTK_COUNT"

          if [ "$XHCI_HCD_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: xhci-hcd.ko was NOT built."
            exit 1
          fi

          if [ "$XHCI_MTK_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: xhci-mtk-hcd.ko was NOT built."
            exit 1
          fi

          echo
          echo "XHCI kernel-module verification PASSED."

      # ============================================================
      # 15. Verify compiled kernel configuration
      # ============================================================
      - name: Verify actual compiled kernel configuration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "Verify actual compiled kernel configuration"
          echo "========================================"

          KERNEL_CONFIGS="$(
            find build_dir \
              -type f \
              -path '*/linux-*/.config' \
              -print
          )"

          if [ -z "$KERNEL_CONFIGS" ]; then
            echo
            echo "ERROR: No compiled kernel .config found."
            exit 1
          fi

          echo
          echo "Kernel .config candidates:"
          echo "$KERNEL_CONFIGS"

          XHCI_KERNEL_OK=0
          XHCI_MTK_KERNEL_OK=0

          while IFS= read -r cfg; do
            [ -n "$cfg" ] || continue

            if grep -Eq \
              '^CONFIG_USB_XHCI_HCD=[ym]$' \
              "$cfg"; then

              echo
              echo "FOUND CONFIG_USB_XHCI_HCD in $cfg"
              grep \
                '^CONFIG_USB_XHCI_HCD=' \
                "$cfg"

              XHCI_KERNEL_OK=1
            fi

            if grep -Eq \
              '^CONFIG_USB_XHCI_MTK=[ym]$' \
              "$cfg"; then

              echo
              echo "FOUND CONFIG_USB_XHCI_MTK in $cfg"
              grep \
                '^CONFIG_USB_XHCI_MTK=' \
                "$cfg"

              XHCI_MTK_KERNEL_OK=1
            fi

          done <<< "$KERNEL_CONFIGS"

          if [ "$XHCI_KERNEL_OK" -ne 1 ]; then
            echo
            echo "ERROR: CONFIG_USB_XHCI_HCD not enabled."
            exit 1
          fi

          if [ "$XHCI_MTK_KERNEL_OK" -ne 1 ]; then
            echo
            echo "ERROR: CONFIG_USB_XHCI_MTK not enabled."
            exit 1
          fi

          echo
          echo "Compiled kernel XHCI configuration verification PASSED."

      # ============================================================
      # 16. Verify required KMOD APK files were produced
      # ============================================================
      - name: Verify required KMOD APK packages
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "Verify required KMOD APK packages"
          echo "========================================"

          PACKAGE_ROOT="bin/targets/mediatek/filogic"

          test -d "$PACKAGE_ROOT"

          REQUIRED_APKS=(
            kmod-usb3
            kmod-usb-xhci-hcd
            kmod-usb-xhci-mtk
            kmod-usb-storage
            kmod-fs-ext4
            kmod-fs-vfat

            kmod-inet-diag
            kmod-netlink-diag
            kmod-tun

            kmod-nfnetlink
            kmod-nf-conntrack
            kmod-nf-conntrack-netlink
            kmod-nf-socket
            kmod-nf-tproxy

            kmod-nft-core
            kmod-nft-socket
            kmod-nft-tproxy
          )

          for pkg in "${REQUIRED_APKS[@]}"; do

            COUNT="$(
              find "$PACKAGE_ROOT" \
                -type f \
                -name "${pkg}-*.apk" \
                -print \
                | wc -l
            )"

            echo
            echo "$pkg -> APK count: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo
              echo "ERROR: $pkg APK was not generated."
              exit 1
            fi

          done

          TOTAL_KMOD_APKS="$(
            find "$PACKAGE_ROOT" \
              -type f \
              -name 'kmod-*.apk' \
              -print \
              | wc -l
          )"

          echo
          echo "Total generated KMOD APK files: $TOTAL_KMOD_APKS"

          if [ "$TOTAL_KMOD_APKS" -eq 0 ]; then
            echo
            echo "ERROR: No KMOD APK packages were generated."
            exit 1
          fi

          echo
          echo "Required KMOD APK verification PASSED."

      # ============================================================
      # 17. Verify firmware manifests contain required KMODs
      # ============================================================
      - name: Verify required KMODs in firmware manifests
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "========================================"
          echo "Verify required KMODs in firmware"
          echo "========================================"

          TARGET_DIR="bin/targets/mediatek/filogic"

          MANIFESTS="$(
            find "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.manifest' \
              -print \
              | sort
          )"

          if [ -z "$MANIFESTS" ]; then
            echo
            echo "ERROR: No manifest found."
            exit 1
          fi

          REQUIRED_MANIFEST_PACKAGES=(
            kmod-usb3
            kmod-usb-xhci-hcd
            kmod-usb-xhci-mtk
            kmod-usb-storage

            kmod-inet-diag
            kmod-netlink-diag
            kmod-tun

            kmod-nfnetlink
            kmod-nf-conntrack
            kmod-nf-conntrack-netlink
            kmod-nf-socket
            kmod-nf-tproxy

            kmod-nft-core
            kmod-nft-socket
            kmod-nft-tproxy
          )

          for pkg in "${REQUIRED_MANIFEST_PACKAGES[@]}"; do

            FOUND=0

            while IFS= read -r manifest; do
              [ -n "$manifest" ] || continue

              if grep -Fq "$pkg" "$manifest"; then
                echo "FOUND $pkg in $manifest"
                FOUND=1
                break
              fi

            done <<< "$MANIFESTS"

            if [ "$FOUND" -ne 1 ]; then
              echo
              echo "ERROR: $pkg is not present in firmware manifest."
              exit 1
            fi

          done

          echo
          echo "Required KMOD firmware inclusion verification PASSED."

      # ============================================================
      # 18. Verify firmware images
      # ============================================================
      - name: Verify N30 Pro firmware images
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          TARGET_DIR="bin/targets/mediatek/filogic"

          echo "========================================"
          echo "Verify N30 Pro firmware images"
          echo "========================================"

          find "$TARGET_DIR" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          N30_COUNT="$(
            find "$TARGET_DIR" \
              -maxdepth 2 \
              -type f \
              \( \
                -iname '*n30*' \
                -o \
                -iname '*netcore*' \
              \) \
              -print \
              | wc -l
          )"

          if [ "$N30_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: No N30 Pro / Netcore firmware file found."
            exit 1
          fi

          echo
          echo "Found $N30_COUNT N30 Pro / Netcore firmware file(s)."
          echo "Firmware image verification PASSED."

      # ============================================================
      # 19. Build KMOD artifact directory
      # ============================================================
      - name: Prepare KMOD artifact
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          rm -rf n30-pro-kmods
          mkdir -p n30-pro-kmods

          PACKAGE_ROOT="bin/targets/mediatek/filogic"

          echo "========================================"
          echo "Collect KMOD APK packages"
          echo "========================================"

          find "$PACKAGE_ROOT" \
            -type f \
            -name 'kmod-*.apk' \
            -exec cp -f {} n30-pro-kmods/ \;

          cp -f .config n30-pro-kmods/

          if [ -f "$PACKAGE_ROOT/packages.adb" ]; then
            cp -f \
              "$PACKAGE_ROOT/packages.adb" \
              n30-pro-kmods/
          fi

          if [ -f "$PACKAGE_ROOT/packages.adb.sig" ]; then
            cp -f \
              "$PACKAGE_ROOT/packages.adb.sig" \
              n30-pro-kmods/
          fi

          TOTAL="$(
            find n30-pro-kmods \
              -type f \
              -name 'kmod-*.apk' \
              | wc -l
          )"

          echo
          echo "Collected KMOD APK count: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo
            echo "ERROR: KMOD artifact directory is empty."
            exit 1
          fi

          echo
          echo "Collected KMOD packages:"
          find n30-pro-kmods \
            -maxdepth 1 \
            -type f \
            -name 'kmod-*.apk' \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 20. Generate complete build report
      # ============================================================
      - name: Generate build report
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          REPORT="n30-pro-build-report.txt"

          TARGET_DIR="bin/targets/mediatek/filogic"

          {
            echo "============================================================"
            echo "ImmortalWrt 25.12.2 - Netcore N30 Pro Build Report"
            echo "============================================================"
            echo

            echo "Source:"
            git describe --tags --always || true

            echo
            echo "Commit:"
            git rev-parse HEAD

            echo
            echo "============================================================"
            echo "Target"
            echo "============================================================"

            grep '^CONFIG_TARGET_mediatek' .config || true

            echo
            echo "============================================================"
            echo "APK / package settings"
            echo "============================================================"

            grep -E \
              '^(CONFIG_USE_APK|CONFIG_SIGNED_PACKAGES|CONFIG_SIGNATURE_CHECK|CONFIG_SIGN_EACH_PACKAGE|CONFIG_PER_FEED_REPO|CONFIG_ALL_KMODS)=' \
              .config \
              || true

            echo
            echo "============================================================"
            echo "Explicit firmware KMODs"
            echo "============================================================"

            grep '^CONFIG_PACKAGE_kmod-' .config \
              | grep '=y$' \
              | sort \
              || true

            echo
            echo "============================================================"
            echo "KMODs built as packages"
            echo "============================================================"

            grep '^CONFIG_PACKAGE_kmod-' .config \
              | grep '=m$' \
              | wc -l \
              | awk '{print "KMOD packages selected as =m: "$1}'

            echo
            echo "============================================================"
            echo "Kernel package"
            echo "============================================================"

            find "$TARGET_DIR" \
              -type f \
              -name 'kernel-*.apk' \
              -print \
              | sort \
              || true

            echo
            echo "============================================================"
            echo "Generated KMOD APK count"
            echo "============================================================"

            find "$TARGET_DIR" \
              -type f \
              -name 'kmod-*.apk' \
              -print \
              | wc -l

            echo
            echo "============================================================"
            echo "XHCI modules"
            echo "============================================================"

            find build_dir \
              -type f \
              \( \
                -name 'xhci-hcd.ko' \
                -o \
                -name 'xhci-mtk-hcd.ko' \
              \) \
              -print \
              | sort

            echo
            echo "============================================================"
            echo "Firmware files"
            echo "============================================================"

            find "$TARGET_DIR" \
              -maxdepth 2 \
              -type f \
              \( \
                -iname '*n30*' \
                -o \
                -iname '*netcore*' \
              \) \
              -print \
              | sort

            echo
            echo "============================================================"
            echo "StarVPN"
            echo "============================================================"

            echo "StarVPN client is NOT compiled into firmware."
            echo "Only kernel/VPN prerequisites are included."

            echo
            echo "============================================================"
            echo "Build completed"
            echo "============================================================"

          } > "$REPORT"

          cat "$REPORT"

      # ============================================================
      # 21. Upload firmware
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-usb-kmod-firmware
          path: |
            immortalwrt/bin/targets/mediatek/filogic/**
            immortalwrt/n30-pro-build-report.txt
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 22. Upload all generated KMOD packages
      # ============================================================
      - name: Upload KMOD packages
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-kmods
          path: |
            immortalwrt/n30-pro-kmods/**
          if-no-files-found: error
          retention-days: 7
