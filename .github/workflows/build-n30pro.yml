      - name: Configure required packages
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          TARGET_SYMBOL="$(cat /tmp/n30pro_target_symbol)"

          echo "========================================"
          echo "Configure packages"
          echo "========================================"

          echo "N30 Pro target:"
          echo "CONFIG_${TARGET_SYMBOL#CONFIG_}=y"

          cat >> .config <<'EOF'

          # ============================================================
          # LuCI
          # ============================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y

          # ============================================================
          # Firewall / networking
          # ============================================================

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_resolveip=y

          # ============================================================
          # Samba4
          # ============================================================

          CONFIG_PACKAGE_samba4-server=y
          CONFIG_PACKAGE_luci-app-samba4=y

          # ============================================================
          # MWAN3
          # ============================================================

          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y

          # ============================================================
          # PassWall
          # ============================================================

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y

          # ============================================================
          # PassWall kernel networking
          # ============================================================

          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-netlink-diag=y
          CONFIG_PACKAGE_kmod-tun=y

          # ============================================================
          # USB core / xHCI
          # ============================================================

          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y

          # ============================================================
          # USB 4G / 5G modem
          # ============================================================

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y

          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-acm=y

          # ============================================================
          # USB modem user space
          # ============================================================

          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_usb-modeswitch=y

          # ============================================================
          # USB Ethernet
          # ============================================================

          CONFIG_PACKAGE_kmod-usb-net-rtl8150=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-aqc111=y

          # ============================================================
          # USB serial vendor drivers
          # ============================================================

          CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
          CONFIG_PACKAGE_kmod-usb-serial-sierrawireless=y

          # ============================================================
          # USB / storage
          # ============================================================

          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y

          # ============================================================
          # Common tools
          # ============================================================

          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_openssh-sftp-server=y

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y

          # ============================================================
          # PassWall user space dependencies
          # ============================================================

          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-base64=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_coreutils-timeout=y

          CONFIG_PACKAGE_libuci-lua=y
          CONFIG_PACKAGE_lua=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lib-jsonc=y
          CONFIG_PACKAGE_lyaml=y

          CONFIG_PACKAGE_microsocks=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_dns2socks=y

          # ============================================================
          # PassWall engines
          # ============================================================

          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_shadowsocks-rust-sslocal=y
          CONFIG_PACKAGE_simple-obfs=y
          CONFIG_PACKAGE_v2ray-plugin=y
          CONFIG_PACKAGE_haproxy=y

          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y

          # ============================================================
          # LuCI modem protocols
          # ============================================================

          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-mbim=y
          CONFIG_PACKAGE_luci-proto-ncm=y

          # ============================================================
          # WireGuard
          # ============================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          # ============================================================
          # Optional USB automount
          # ============================================================

          CONFIG_PACKAGE_automount=y

          # ============================================================
          # PassWall feature switches
          # ============================================================

          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=y
          EOF

          echo "========================================"
          echo "Run defconfig"
          echo "========================================"

          make defconfig

          echo "========================================"
          echo "Verify N30 Pro target"
          echo "========================================"

          EXPECTED_TARGET="CONFIG_${TARGET_SYMBOL#CONFIG_}=y"

          echo "Expected:"
          echo "$EXPECTED_TARGET"

          if ! grep -qx "$EXPECTED_TARGET" .config; then
            echo "[ERROR] N30 Pro target was lost during defconfig."

            echo
            echo "Actual device targets:"
            grep '^CONFIG_TARGET_DEVICE_' .config || true

            echo
            echo "Current profile:"
            grep '^CONFIG_TARGET_PROFILE=' .config || true

            exit 1
          fi

          if grep -qx \
            'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_openwrt_one=y' \
            .config
          then
            echo "[ERROR] OpenWrt One is selected."
            exit 1
          fi

          echo "[OK] N30 Pro target retained."

          echo "========================================"
          echo "Package configuration after defconfig"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci|luci-ssl|luci-app-passwall|luci-app-mwan3|mwan3|luci-app-samba4|samba4-server|kmod-usb-xhci-hcd|kmod-usb-xhci-mtk|kmod-nft-tproxy|kmod-nft-socket|kmod-tun)=' \
            .config \
            || true
