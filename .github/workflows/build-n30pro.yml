name: Build ImmortalWrt 25.12.2 - Netcore N30 Pro USB Fix

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install ImmortalWrt build dependencies
        shell: bash
        run: |
          set -e

          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Clone ImmortalWrt 25.12.2
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch v25.12.2 \
            --single-branch \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt
          echo "ImmortalWrt commit:"
          git rev-parse HEAD

      - name: Clone N30 Pro adaptation
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --single-branch \
            https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
            n30-patch

      - name: Apply N30 Pro adaptation
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          bash ../n30-patch/scripts/apply-netcore-n30pro.sh ../n30-patch

      - name: Verify N30 Pro DTS and USB VBUS
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

          test -f "$DTS"

          echo "===== N30 Pro DTS ====="
          cat "$DTS"

          echo "===== Verify model ====="
          grep -Fq 'model = "Netcore N30 Pro";' "$DTS"

          echo "===== Verify compatible ====="
          grep -Fq '"netcore,n30-pro"' "$DTS"

          echo "===== Verify USB VBUS GPIO23 ====="
          grep -Fq 'gpio = <&pio 23 GPIO_ACTIVE_HIGH>;' "$DTS"

          echo "===== Verify 5V regulator ====="
          grep -Fq 'regulator-min-microvolt = <5000000>;' "$DTS"
          grep -Fq 'regulator-max-microvolt = <5000000>;' "$DTS"

          echo "===== Verify regulator boot-on ====="
          grep -Fq 'regulator-boot-on;' "$DTS"

          echo "===== Verify USB VBUS supply ====="
          grep -Fq 'vbus-supply = <&usb_vbus>;' "$DTS"

          echo "===== Verify USB PHY ====="
          grep -A5 -B2 '&usb_phy' "$DTS" \
            | grep -Fq 'status = "okay";'

          echo "===== Verify XHCI ====="
          grep -A8 -B2 '&xhci' "$DTS" \
            | grep -Fq 'status = "okay";'

          echo "N30 Pro DTS USB VBUS checks passed."

      - name: Verify N30 Pro board integration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          grep -Fq 'define Device/netcore_n30-pro' \
            target/linux/mediatek/image/filogic.mk

          grep -Fq 'netcore,n30-pro' \
            target/linux/mediatek/filogic/base-files/etc/board.d/02_network

          grep -Fq 'netcore,n30-pro' \
            target/linux/mediatek/filogic/base-files/etc/hotplug.d/ieee80211/11_fix_wifi_mac

          echo "N30 Pro board integration checks passed."

      - name: Verify USB KernelPackage definitions
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          USB_MK="package/kernel/linux/modules/usb.mk"

          test -f "$USB_MK"

          echo "===== USB KernelPackage definitions ====="

          grep -nE \
            '^define KernelPackage/(usb3|usb-xhci-hcd|usb-xhci-mtk)$' \
            "$USB_MK"

          echo "===== XHCI MTK definition details ====="

          grep -n -A12 -B2 \
            '^define KernelPackage/usb-xhci-mtk$' \
            "$USB_MK"

          echo "USB KernelPackage definitions found."

      - name: Force XHCI packages into N30 Pro device profile
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          FILE="target/linux/mediatek/image/filogic.mk"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("target/linux/mediatek/image/filogic.mk")
          text = path.read_text()

          old = """define Device/netcore_n30-pro
            DEVICE_VENDOR := Netcore
            DEVICE_MODEL := N30 Pro
            DEVICE_DTS := mt7981b-netcore-n30-pro
            DEVICE_DTS_DIR := ../dts
            DEVICE_PACKAGES := kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware \\
              kmod-usb3 automount
            KERNEL_IN_UBI := 1
            UBINIZE_OPTS := -E 5
            BLOCKSIZE := 128k
            PAGESIZE := 2048
            IMAGE_SIZE := 117248k
            IMAGES += factory.bin
            IMAGE/factory.bin := append-ubi | check-size $$(IMAGE_SIZE)
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          endef"""

          new = """define Device/netcore_n30-pro
            DEVICE_VENDOR := Netcore
            DEVICE_MODEL := N30 Pro
            DEVICE_DTS := mt7981b-netcore-n30-pro
            DEVICE_DTS_DIR := ../dts
            DEVICE_PACKAGES := kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware \\
              kmod-usb3 kmod-usb-xhci-hcd kmod-usb-xhci-mtk automount
            KERNEL_IN_UBI := 1
            UBINIZE_OPTS := -E 5
            BLOCKSIZE := 128k
            PAGESIZE := 2048
            IMAGE_SIZE := 117248k
            IMAGES += factory.bin
            IMAGE/factory.bin := append-ubi | check-size $$(IMAGE_SIZE)
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          endef"""

          if old not in text:
              raise SystemExit(
                  "ERROR: Expected netcore_n30-pro device definition was not found."
              )

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          echo "===== Final N30 Pro Device definition ====="

          grep -n -A18 -B2 \
            '^define Device/netcore_n30-pro$' \
            "$FILE"

          echo "N30 Pro device profile now explicitly includes XHCI packages."

      - name: Verify XHCI package names after device-profile modification
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          FILE="target/linux/mediatek/image/filogic.mk"

          grep -A12 \
            '^define Device/netcore_n30-pro$' \
            "$FILE" \
            | grep -Fq 'kmod-usb-xhci-hcd'

          grep -A12 \
            '^define Device/netcore_n30-pro$' \
            "$FILE" \
            | grep -Fq 'kmod-usb-xhci-mtk'

          echo "N30 Pro device profile XHCI package checks passed."

      - name: Update and install feeds
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure N30 Pro
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y

          CONFIG_PACKAGE_luci=y

          # USB 3.0 / XHCI
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y

          # USB storage
          CONFIG_PACKAGE_kmod-usb-storage=y

          # Filesystems
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          EOF

          make defconfig

      - name: Verify final OpenWrt configuration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "===== Target configuration ====="

          grep -Fxq \
            'CONFIG_TARGET_mediatek=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_mediatek_filogic=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y' \
            .config

          echo "===== Package configuration ====="

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-usb3=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-usb-xhci-hcd=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-usb-xhci-mtk=y' \
            .config

          grep -Fxq \
            'CONFIG_PACKAGE_kmod-usb-storage=y' \
            .config

          echo "===== Kernel XHCI configuration ====="

          grep -Eq \
            '^CONFIG_USB_XHCI_HCD=[ym]$' \
            .config

          grep -Eq \
            '^CONFIG_USB_XHCI_MTK=[ym]$' \
            .config

          echo "===== Relevant configuration ====="

          grep -E \
            '^(CONFIG_TARGET_mediatek|CONFIG_PACKAGE_kmod-usb|CONFIG_USB_XHCI_)' \
            .config \
            | sort

          echo "Final OpenWrt configuration checks passed."

      - name: Download sources
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          make download -j2 V=s

      - name: Build firmware
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          make -j"$(nproc)" || make -j1 V=s

      - name: Verify actual XHCI kernel modules
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "===== Searching for xhci-hcd.ko ====="

          find build_dir \
            -type f \
            -name 'xhci-hcd.ko' \
            -print

          XHCI_HCD_COUNT="$(
            find build_dir \
              -type f \
              -name 'xhci-hcd.ko' \
              -print \
              | wc -l
          )"

          if [ "$XHCI_HCD_COUNT" -eq 0 ]; then
            echo "ERROR: xhci-hcd.ko was not built."
            exit 1
          fi

          echo "===== Searching for xhci-mtk-hcd.ko ====="

          find build_dir \
            -type f \
            -name 'xhci-mtk-hcd.ko' \
            -print

          XHCI_MTK_COUNT="$(
            find build_dir \
              -type f \
              -name 'xhci-mtk-hcd.ko' \
              -print \
              | wc -l
          )"

          if [ "$XHCI_MTK_COUNT" -eq 0 ]; then
            echo "ERROR: xhci-mtk-hcd.ko was not built."
            exit 1
          fi

          echo "XHCI kernel modules were actually built."

      - name: Verify installed XHCI modules in root filesystem
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "===== Searching target root filesystem ====="

          find build_dir \
            -type f \
            \( \
              -name 'xhci-hcd.ko' \
              -o \
              -name 'xhci-mtk-hcd.ko' \
            \) \
            -print \
            | sort

          echo "Installed XHCI module verification completed."

      - name: Verify build manifest and USB packages
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          test -d bin/targets/mediatek/filogic

          echo "===== Firmware directory ====="

          find \
            bin/targets/mediatek/filogic \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          echo "===== Manifest files ====="

          find \
            bin/targets/mediatek/filogic \
            -maxdepth 1 \
            -type f \
            -name '*.manifest' \
            -print

          MANIFEST="$(
            find \
              bin/targets/mediatek/filogic \
              -maxdepth 1 \
              -type f \
              -name '*.manifest' \
              -print \
              | head -1
          )"

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: No firmware manifest found."
            exit 1
          fi

          echo "Using manifest:"
          echo "$MANIFEST"

          echo "===== USB packages in manifest ====="

          grep -E \
            'kmod-usb3|kmod-usb-xhci-hcd|kmod-usb-xhci-mtk' \
            "$MANIFEST"

          echo "USB package manifest checks passed."

      - name: Verify N30 Pro firmware images
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          echo "===== N30 Pro firmware images ====="

          find \
            bin/targets/mediatek/filogic \
            -maxdepth 2 \
            -type f \
            \( \
              -iname '*n30*' \
              -o \
              -iname '*netcore*' \
            \) \
            -print \
            | sort

          COUNT="$(
            find \
              bin/targets/mediatek/filogic \
              -maxdepth 2 \
              -type f \
              \( \
                -iname '*n30*' \
                -o \
                -iname '*netcore*' \
              \) \
              -print \
              | wc -l
          )"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No N30 Pro firmware image found."
            exit 1
          fi

          echo "Found $COUNT N30 Pro firmware file(s)."

      - name: Generate build report
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          {
            echo "========================================"
            echo "ImmortalWrt N30 Pro USB Build Report"
            echo "========================================"
            echo

            echo "ImmortalWrt commit:"
            git rev-parse HEAD
            echo

            echo "Target configuration:"
            grep '^CONFIG_TARGET_mediatek' .config
            echo

            echo "USB package configuration:"
            grep '^CONFIG_PACKAGE_kmod-usb' .config || true
            echo

            echo "Kernel XHCI configuration:"
            grep '^CONFIG_USB_XHCI_' .config || true
            echo

            echo "N30 Pro DTS:"
            echo "target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"
            echo

            echo "Actual XHCI modules:"
            find build_dir \
              -type f \
              \( \
                -name 'xhci-hcd.ko' \
                -o \
                -name 'xhci-mtk-hcd.ko' \
              \) \
              -print \
              | sort
            echo

            echo "Firmware:"
            find \
              bin/targets/mediatek/filogic \
              -maxdepth 2 \
              -type f \
              \( \
                -iname '*n30*' \
                -o \
                -iname '*netcore*' \
              \) \
              -print \
              | sort

            echo
            echo "========================================"
          } > n30-pro-build-report.txt

          cat n30-pro-build-report.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-usb-fix-v2
          path: |
            immortalwrt/bin/targets/mediatek/filogic/**
            immortalwrt/n30-pro-build-report.txt
          if-no-files-found: error
          retention-days: 7
