name: Build ImmortalWrt 25.12.2 Netcore N30 Pro

on:
  workflow_dispatch:

env:
  IMMORTALWRT_TAG: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zstd \
            file \
            patch


      - name: Clone ImmortalWrt
        run: |

          git clone \
            --depth 1 \
            --branch "${IMMORTALWRT_TAG}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt



      - name: Clone N30 Pro patch
        run: |

          git clone \
            --depth 1 \
            "${PATCH_REPO}" \
            n30pro-patch



      - name: Inspect patch repository
        run: |

          find n30pro-patch \
          -maxdepth 3 \
          -type f \
          | sort



      - name: Apply N30 Pro patch
        working-directory: immortalwrt
        run: |

          PATCH_FILE=$(find ../n30pro-patch \
          -name "*.patch" \
          | head -n1)


          if [ -z "$PATCH_FILE" ]; then

            echo "No patch file found"

            exit 1

          fi


          echo "Applying:"
          echo "$PATCH_FILE"


          patch \
          -p1 \
          < "$PATCH_FILE"



      - name: Verify N30 Pro target
        working-directory: immortalwrt
        run: |

          grep -q \
          "Device/netis_nx30v2" \
          target/linux/mediatek/image/filogic.mk



      - name: Prepare StarVPN package
        run: |

          mkdir -p \
          immortalwrt/package/starvpn/starvpn/files


          printf '%s\n' \
          'include $(TOPDIR)/rules.mk' \
          '' \
          'PKG_NAME:=starvpn' \
          'PKG_VERSION:=6.1.0' \
          'PKG_RELEASE:=1' \
          '' \
          'include $(INCLUDE_DIR)/package.mk' \
          '' \
          'define Package/starvpn' \
          ' SECTION:=net' \
          ' CATEGORY:=Network' \
          ' TITLE:=StarVPN' \
          ' DEPENDS:=+kmod-tun' \
          'endef' \
          '' \
          'define Package/starvpn/install' \
          ' $(INSTALL_DIR) $$(1)/usr/bin' \
          'endef' \
          '' \
          '$$(eval $$(call BuildPackage,starvpn))' \
          > immortalwrt/package/starvpn/starvpn/Makefile



      - name: Configure feeds
        working-directory: immortalwrt
        run: |

          echo \
          "src-link starvpn $(pwd)/package/starvpn" \
          >> feeds.conf.default


          ./scripts/feeds update -a


          ./scripts/feeds install -a



      - name: Generate configuration
        working-directory: immortalwrt
        run: |

          printf '%s\n' \
          'CONFIG_TARGET_mediatek=y' \
          'CONFIG_TARGET_mediatek_filogic=y' \
          'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netis_nx30v2=y' \
          'CONFIG_PACKAGE_luci=y' \
          'CONFIG_PACKAGE_luci-ssl=y' \
          'CONFIG_PACKAGE_kmod-usb3=y' \
          'CONFIG_PACKAGE_kmod-usb-storage=y' \
          'CONFIG_PACKAGE_kmod-usb-storage-uas=y' \
          'CONFIG_PACKAGE_block-mount=y' \
          'CONFIG_PACKAGE_kmod-usb-net=y' \
          'CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y' \
          'CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y' \
          'CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y' \
          'CONFIG_PACKAGE_kmod-usb-serial=y' \
          'CONFIG_PACKAGE_kmod-usb-serial-option=y' \
          'CONFIG_PACKAGE_kmod-usb-wdm=y' \
          'CONFIG_PACKAGE_usb-modeswitch=y' \
          'CONFIG_PACKAGE_uqmi=y' \
          'CONFIG_PACKAGE_umbim=y' \
          'CONFIG_PACKAGE_mwan3=y' \
          'CONFIG_PACKAGE_luci-app-mwan3=y' \
          'CONFIG_PACKAGE_samba4-server=y' \
          'CONFIG_PACKAGE_luci-app-samba4=y' \
          'CONFIG_PACKAGE_starvpn=y' \
          .config


          make defconfig



      - name: Verify configuration
        working-directory: immortalwrt
        run: |

          grep \
          "CONFIG_TARGET_mediatek=y" \
          .config


          grep \
          "CONFIG_TARGET_mediatek_filogic=y" \
          .config


          grep \
          "netis_nx30v2" \
          .config



      - name: Download packages
        working-directory: immortalwrt
        run: |

          make download \
          -j$(nproc)



      - name: Build firmware
        working-directory: immortalwrt
        run: |

          make \
          -j$(nproc) \
          V=s



      - name: Firmware audit
        working-directory: immortalwrt
        run: |

          TARGET="bin/targets/mediatek/filogic"


          test -d "$TARGET"


          if find "$TARGET" \
          -iname "*h3c*" \
          -o -iname "*n60*"; then

            echo "Wrong device firmware detected"

            exit 1

          fi



      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.2-Netcore-N30-Pro

          path: immortalwrt/bin/targets/mediatek/filogic/
