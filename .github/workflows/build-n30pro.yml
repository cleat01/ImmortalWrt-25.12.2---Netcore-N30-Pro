name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Final

on:
  workflow_dispatch:

env:
  IMMORTALWRT_TAG: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      - name: Checkout repository
        uses: actions/checkout@v5



      - name: Install dependencies
        run: |

          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zstd \
            file \
            patch



      - name: Clone ImmortalWrt
        run: |

          git clone \
          --depth 1 \
          --branch ${IMMORTALWRT_TAG} \
          https://github.com/immortalwrt/immortalwrt.git \
          immortalwrt



      - name: Clone N30 Pro patch
        run: |

          git clone \
          --depth 1 \
          ${PATCH_REPO} \
          n30pro-patch



      - name: Apply N30 Pro patch
        working-directory: immortalwrt
        run: |

          set -e


          PATCHES=$(find ../n30pro-patch \
          -name "*.patch" \
          | sort)


          if [ -z "$PATCHES" ]; then

            echo "No N30 Pro patch found"

            exit 1

          fi


          for PATCH in $PATCHES
          do

            echo "Applying:"
            echo "$PATCH"


            if patch \
            --dry-run \
            -p1 \
            < "$PATCH"; then


              patch \
              -p1 \
              < "$PATCH"


            else


              echo "Patch conflict, retry filtered patch"


              awk '

              BEGIN{
                skip=0
              }


              /^diff --git/ {

                if ($0 ~ /11_fix_wifi_mac/) {
                    skip=1
                }
                else {
                    skip=0
                }

              }


              skip==0 {
                print
              }

              ' "$PATCH" \
              > /tmp/n30pro.patch


              patch \
              -p1 \
              < /tmp/n30pro.patch


            fi

          done



      - name: Add StarVPN package
        run: |

          if [ ! -f package/starvpn/Makefile ]; then

            echo "StarVPN Makefile missing"

            exit 1

          fi


          if [ ! -d package/starvpn/files ]; then

            echo "StarVPN files directory missing"

            exit 1

          fi


          rm -rf immortalwrt/package/starvpn


          cp -a \
          package/starvpn \
          immortalwrt/package/



      - name: Verify N30 Pro DTS
        working-directory: immortalwrt
        run: |

          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"


          test -f "$DTS"


          grep -q \
          "vbus-supply" \
          "$DTS"


          grep -q \
          "xhci" \
          "$DTS"


          grep -q \
          "usb@" \
          "$DTS"



      - name: Verify target device
        working-directory: immortalwrt
        run: |

          grep -q \
          "Device/netis_nx30v2" \
          target/linux/mediatek/image/filogic.mk



      - name: Update feeds
        working-directory: immortalwrt
        run: |

          echo \
          "src-link starvpn $(pwd)/package/starvpn" \
          >> feeds.conf.default


          ./scripts/feeds update -a


          ./scripts/feeds install -a



      - name: Generate configuration
        working-directory: immortalwrt
        run: |

          printf '%s\n' \
          'CONFIG_TARGET_mediatek=y' \
          'CONFIG_TARGET_mediatek_filogic=y' \
          'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netis_nx30v2=y' \
          'CONFIG_PACKAGE_luci=y' \
          'CONFIG_PACKAGE_luci-ssl=y' \
          'CONFIG_PACKAGE_kmod-usb2=y' \
          'CONFIG_PACKAGE_kmod-usb3=y' \
          'CONFIG_PACKAGE_kmod-usb-xhci-hcd=y' \
          'CONFIG_PACKAGE_kmod-usb-storage=y' \
          'CONFIG_PACKAGE_kmod-usb-storage-uas=y' \
          'CONFIG_PACKAGE_block-mount=y' \
          'CONFIG_PACKAGE_kmod-tun=y' \
          'CONFIG_PACKAGE_iptables=y' \
          'CONFIG_PACKAGE_kmod-usb-net=y' \
          'CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y' \
          'CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y' \
          'CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y' \
          'CONFIG_PACKAGE_kmod-usb-serial=y' \
          'CONFIG_PACKAGE_kmod-usb-serial-option=y' \
          'CONFIG_PACKAGE_kmod-usb-wdm=y' \
          'CONFIG_PACKAGE_usb-modeswitch=y' \
          'CONFIG_PACKAGE_uqmi=y' \
          'CONFIG_PACKAGE_umbim=y' \
          'CONFIG_PACKAGE_mwan3=y' \
          'CONFIG_PACKAGE_luci-app-mwan3=y' \
          'CONFIG_PACKAGE_samba4-server=y' \
          'CONFIG_PACKAGE_luci-app-samba4=y' \
          'CONFIG_PACKAGE_starvpn=y' \
          > .config


          make defconfig



      - name: Verify config
        working-directory: immortalwrt
        run: |

          grep \
          "netis_nx30v2" \
          .config


          grep \
          "CONFIG_PACKAGE_starvpn=y" \
          .config



      - name: Download sources
        working-directory: immortalwrt
        run: |

          make download \
          -j$(nproc)



      - name: Build firmware
        working-directory: immortalwrt
        run: |

          make \
          -j$(nproc) \
          V=s



      - name: Firmware audit
        working-directory: immortalwrt
        run: |

          TARGET="bin/targets/mediatek/filogic"


          test -d "$TARGET"


          find "$TARGET" \
          -name "*sysupgrade*" \
          | grep -q .


          if find "$TARGET" \
          -iname "*h3c*" \
          -o \
          -iname "*n60*"; then


              echo "Wrong firmware detected"

              exit 1

          fi



      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.2-Netcore-N30-Pro-Final

          path: immortalwrt/bin/targets/mediatek/filogic/
