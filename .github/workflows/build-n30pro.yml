name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Final

"on":
  workflow_dispatch:


permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      # ============================================================
      # 1. Install build environment
      # ============================================================

      - name: Install build dependencies

        shell: bash

        run: |

          set -e

          sudo bash -c \
          'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'



      # ============================================================
      # 2. Clone ImmortalWrt 25.12.2
      # ============================================================

      - name: Clone ImmortalWrt source

        shell: bash

        run: |

          set -e


          git clone \
            --depth 1 \
            --branch v25.12.2 \
            --single-branch \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt


          cd immortalwrt


          echo "========== ImmortalWrt =========="

          git describe --tags --always || true

          git rev-parse HEAD





      # ============================================================
      # 3. Clone Netcore N30 Pro adaptation
      # ============================================================

      - name: Clone N30 Pro patch


        shell: bash


        run: |


          set -e


          git clone \
            --depth 1 \
            --single-branch \
            https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
            n30-patch


          echo "N30 Pro patch downloaded"





      # ============================================================
      # 4. Apply N30 Pro adaptation
      # ============================================================

      - name: Apply N30 Pro adaptation


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e


          bash ../n30-patch/scripts/apply-netcore-n30pro.sh \
          ../n30-patch





      # ============================================================
      # 5. Verify N30 Pro DTS
      # ============================================================

      - name: Verify N30 Pro DTS USB VBUS


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"



          if [ ! -f "$DTS" ]; then

            echo "ERROR: N30 Pro DTS not found"

            exit 1

          fi



          echo "===== Check USB VBUS regulator ====="



          grep -Fq \
          'regulator-name = "usb-vbus";' \
          "$DTS"



          grep -Fq \
          'gpio = <&pio 23 GPIO_ACTIVE_HIGH>;' \
          "$DTS"



          grep -Fq \
          'regulator-min-microvolt = <5000000>;' \
          "$DTS"



          grep -Fq \
          'regulator-max-microvolt = <5000000>;' \
          "$DTS"



          grep -Fq \
          'regulator-boot-on;' \
          "$DTS"



          echo "USB VBUS DTS check passed"





      # ============================================================
      # 6. Verify xHCI DTS
      # ============================================================

      - name: Verify xHCI controller


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"



          echo "===== xHCI block ====="



          grep -A15 \
          '&xhci' \
          "$DTS"



          grep -A15 \
          '&xhci' \
          "$DTS" \
          | grep -Fq \
          'vbus-supply = <&usb_vbus>;'


          grep -A15 \
          '&xhci' \
          "$DTS" \
          | grep -Fq \
          'status = "okay";'



          echo "xHCI DTS check passed"





      # ============================================================
      # 7. Update official feeds
      # ============================================================

      - name: Update feeds


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e


          ./scripts/feeds update -a


          ./scripts/feeds install -a
      # ============================================================
      # 8. Configure N30 Pro packages
      #
      # 不覆盖 .config
      # 使用 scripts/config
      # ============================================================


      - name: Configure firmware packages


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "========== Configure Target =========="



          ./scripts/config set \
          CONFIG_TARGET_mediatek=y



          ./scripts/config set \
          CONFIG_TARGET_mediatek_filogic=y



          ./scripts/config set \
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y





          # ======================================================
          # LuCI
          # ======================================================


          ./scripts/config set \
          CONFIG_PACKAGE_luci=y



          ./scripts/config set \
          CONFIG_PACKAGE_luci-ssl=y





          # ======================================================
          # USB 3.0 / xHCI
          # ======================================================


          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb3=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-storage=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-storage-uas=y





          # ======================================================
          # USB filesystem
          # ======================================================


          ./scripts/config set \
          CONFIG_PACKAGE_block-mount=y



          ./scripts/config set \
          CONFIG_PACKAGE_blockd=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-fs-ext4=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-fs-vfat=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-fs-exfat=y





          # ======================================================
          # 4G / 5G USB modem
          # ======================================================


          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-serial=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-serial-option=y



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-usb-wdm=y



          ./scripts/config set \
          CONFIG_PACKAGE_usb-modeswitch=y



          ./scripts/config set \
          CONFIG_PACKAGE_uqmi=y



          ./scripts/config set \
          CONFIG_PACKAGE_umbim=y





          # ======================================================
          # MWAN3 负载均衡
          # ======================================================


          ./scripts/config set \
          CONFIG_PACKAGE_mwan3=y



          ./scripts/config set \
          CONFIG_PACKAGE_luci-app-mwan3=y





          # ======================================================
          # Samba4 文件共享
          # ======================================================


          ./scripts/config set \
          CONFIG_PACKAGE_samba4-server=y



          ./scripts/config set \
          CONFIG_PACKAGE_samba4-utils=y



          ./scripts/config set \
          CONFIG_PACKAGE_luci-app-samba4=y





          # ======================================================
          # PassWall
          #
          # 不添加 feed
          # 不clone github
          #
          # 如果25.12.2 feeds存在则编译
          #
          # ======================================================


          ./scripts/config set \
          CONFIG_PACKAGE_luci-app-passwall=y \
          || true



          ./scripts/config set \
          CONFIG_PACKAGE_xray-core=y \
          || true



          ./scripts/config set \
          CONFIG_PACKAGE_sing-box=y \
          || true



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-tun=y \
          || true



          ./scripts/config set \
          CONFIG_PACKAGE_kmod-nft-tproxy=y \
          || true





          # ======================================================
          # 网络工具
          # ======================================================


          ./scripts/config set \
          CONFIG_PACKAGE_curl=y



          ./scripts/config set \
          CONFIG_PACKAGE_wget-ssl=y



          ./scripts/config set \
          CONFIG_PACKAGE_htop=y



          ./scripts/config set \
          CONFIG_PACKAGE_tcpdump=y





          make defconfig



          echo "Firmware configuration completed"





      # ============================================================
      # 9. Verify configuration
      # ============================================================


      - name: Verify package configuration


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "========== Verify =========="



          grep -F \
          "CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y" \
          .config



          grep -F \
          "CONFIG_PACKAGE_kmod-usb3=y" \
          .config



          grep -F \
          "CONFIG_PACKAGE_kmod-usb-xhci-mtk=y" \
          .config



          grep -F \
          "CONFIG_PACKAGE_mwan3=y" \
          .config



          grep -F \
          "CONFIG_PACKAGE_samba4-server=y" \
          .config



          echo "Configuration verified"





      # ============================================================
      # 10. Download package sources
      # ============================================================


      - name: Download sources


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e


          make download -j$(nproc) V=s
      # ============================================================
      # 11. Prepare custom IPK packages
      #
      # 星空组网等第三方IPK
      #
      # 不作为源码编译
      # 直接进入固件 packages 目录
      #
      # ============================================================


      - name: Prepare custom IPK packages


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          mkdir -p files/usr/share/custom-packages



          if [ -d ../custom_packages ]; then


              cp \
              ../custom_packages/*.ipk \
              files/usr/share/custom-packages/ \
              2>/dev/null \
              || true


          fi



          echo "Custom IPK prepared"





      # ============================================================
      # 12. Build firmware
      # ============================================================


      - name: Build firmware


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "================================"

          echo "Start building"

          echo "================================"



          make -j$(nproc) V=s





      # ============================================================
      # 13. Generate package index
      #
      # 解决 apk:
      #
      # ERROR:
      # unable to select packages
      #
      # ============================================================


      - name: Generate package indexes


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          make package/index



          echo "Package index generated"





      # ============================================================
      # 14. Verify XHCI modules
      #
      # USB供电最终验证
      #
      # ============================================================


      - name: Verify XHCI kernel modules


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          echo "========== XHCI check =========="



          echo "Checking xhci-hcd"



          find \
          build_dir \
          -name "xhci-hcd.ko" \
          -print



          echo "Checking xhci-mtk"



          find \
          build_dir \
          -name "xhci-mtk-hcd.ko" \
          -print





          XHCI=$(find build_dir -name "xhci-hcd.ko" | wc -l)



          MTK=$(find build_dir -name "xhci-mtk-hcd.ko" | wc -l)





          if [ "$XHCI" -eq 0 ]; then


              echo "ERROR: missing xhci-hcd.ko"

              exit 1


          fi



          if [ "$MTK" -eq 0 ]; then


              echo "ERROR: missing xhci-mtk-hcd.ko"

              exit 1


          fi



          echo "XHCI OK"





      # ============================================================
      # 15. Verify firmware output
      # ============================================================


      - name: Verify output files


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          TARGET="bin/targets/mediatek/filogic"



          if [ ! -d "$TARGET" ]; then


              echo "Firmware output missing"


              exit 1


          fi



          echo "========== Firmware =========="



          find \
          "$TARGET" \
          -maxdepth 2 \
          -type f \
          | sort





      # ============================================================
      # 16. Generate build report
      # ============================================================


      - name: Generate report


        shell: bash


        working-directory: immortalwrt


        run: |


          set -e



          cat > n30pro-build-report.txt <<EOF

ImmortalWrt 25.12.2
Device:
Netcore N30 Pro

Features:

USB VBUS:
GPIO23

USB Controller:
MediaTek XHCI

Packages:

USB3
USB Storage
4G/5G modem
MWAN3
Samba4

Custom IPK:
$(ls files/usr/share/custom-packages 2>/dev/null || true)

Build:
SUCCESS

EOF



          cat n30pro-build-report.txt





      # ============================================================
      # 17. Upload firmware
      # ============================================================


      - name: Upload firmware


        uses: actions/upload-artifact@v4


        with:


          name: ImmortalWrt-25.12.2-Netcore-N30-Pro-Final


          path: |


            immortalwrt/bin/targets/mediatek/filogic/**


            immortalwrt/n30pro-build-report.txt


          retention-days: 7
