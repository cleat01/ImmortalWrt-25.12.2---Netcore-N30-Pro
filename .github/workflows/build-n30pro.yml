name: Build ImmortalWrt 25.12.2 Netcore N30 Pro


on:
  workflow_dispatch:


env:
  IMMORTALWRT_TAG: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zstd \
          file \
          patch



    - name: Clone ImmortalWrt
      run: |

        git clone \
          --depth 1 \
          --branch ${IMMORTALWRT_TAG} \
          https://github.com/immortalwrt/immortalwrt.git



    - name: Clone N30 patch
      run: |

        git clone \
          --depth 1 \
          ${PATCH_REPO} \
          n30pro-patch



    - name: Prepare patch
      run: |

        PATCH=$(find n30pro-patch -name "*.patch" | head -1)

        if [ -z "$PATCH" ]; then

          echo "No patch found"

          exit 1

        fi


        grep -v "11_fix_wifi_mac" \
        "$PATCH" \
        > /tmp/n30pro.patch



    - name: Apply patch
      working-directory: immortalwrt
      run: |

        patch -p1 --forward < /tmp/n30pro.patch



    - name: Verify device
      working-directory: immortalwrt
      run: |

        test -f \
        target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts


        grep -q \
        "Device/netis_nx30v2" \
        target/linux/mediatek/image/filogic.mk



    - name: Generate config
      working-directory: immortalwrt
      run: |

        printf '%s\n' \
        'CONFIG_TARGET_mediatek=y' \
        'CONFIG_TARGET_mediatek_filogic=y' \
        'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netis_nx30v2=y' \
        '' \
        'CONFIG_PACKAGE_luci=y' \
        'CONFIG_PACKAGE_luci-ssl=y' \
        '' \
        'CONFIG_PACKAGE_kmod-usb3=y' \
        'CONFIG_PACKAGE_kmod-usb-storage=y' \
        'CONFIG_PACKAGE_kmod-usb-storage-uas=y' \
        '' \
        'CONFIG_PACKAGE_kmod-usb-net=y' \
        'CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y' \
        'CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y' \
        'CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y' \
        '' \
        'CONFIG_PACKAGE_kmod-usb-serial=y' \
        'CONFIG_PACKAGE_kmod-usb-serial-option=y' \
        'CONFIG_PACKAGE_kmod-usb-wdm=y' \
        '' \
        'CONFIG_PACKAGE_usb-modeswitch=y' \
        'CONFIG_PACKAGE_uqmi=y' \
        'CONFIG_PACKAGE_umbim=y' \
        '' \
        'CONFIG_PACKAGE_mwan3=y' \
        'CONFIG_PACKAGE_luci-app-mwan3=y' \
        '' \
        'CONFIG_PACKAGE_samba4-server=y' \
        'CONFIG_PACKAGE_luci-app-samba4=y' \
        '' \
        'CONFIG_PACKAGE_kmod-tun=y' \
        'CONFIG_PACKAGE_curl=y' \
        'CONFIG_PACKAGE_wget-ssl=y' \
        'CONFIG_PACKAGE_ca-bundle=y' \
        'CONFIG_PACKAGE_ca-certificates=y' \
        > .config


        make olddefconfig



    - name: Download packages
      working-directory: immortalwrt
      run: |

        make download -j2



    - name: Compile firmware
      working-directory: immortalwrt
      run: |

        export TERM=xterm


        make -j1 V=s 2>&1 | tee build.log


        exit ${PIPESTATUS[0]}



    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4

      with:

        name: build-log

        path: immortalwrt/build.log



    - name: Check firmware
      if: success()
      working-directory: immortalwrt
      run: |

        find \
        bin/targets/mediatek/filogic \
        -name "*sysupgrade*"



    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4

      with:

        name: N30-Pro-ImmortalWrt-25.12.2

        path: immortalwrt/bin/targets/mediatek/filogic/
