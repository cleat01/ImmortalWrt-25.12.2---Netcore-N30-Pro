```yaml
name: Build ImmortalWrt 25.12.2 - Netcore N30 Pro Full

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTALWRT_REF: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout build repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            device-tree-compiler \
            qemu-utils \
            ccache \
            time

      # ============================================================
      # 3. Clone ImmortalWrt 25.12.2
      # ============================================================
      - name: Clone ImmortalWrt 25.12.2
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${IMMORTALWRT_REF}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo "========================================"
          echo "ImmortalWrt revision"
          echo "========================================"

          git rev-parse HEAD
          git describe --tags --always || true

      # ============================================================
      # 4. Clone CURRENT N30 Pro patch repository
      #
      # IMPORTANT:
      # DO NOT checkout a guessed/nonexistent SHA.
      # The upstream patch repository currently contains the
      # adaptation patch and apply script on main.
      # ============================================================
      - name: Clone Netcore N30 Pro patch repository
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch main \
            "${PATCH_REPO}" \
            Netcore-N30-Pro-patch-for-OpenWrt

          cd Netcore-N30-Pro-patch-for-OpenWrt

          echo "========================================"
          echo "N30 Pro patch repository"
          echo "========================================"

          PATCH_HEAD="$(git rev-parse HEAD)"

          echo "PATCH_HEAD=${PATCH_HEAD}"

          test -n "${PATCH_HEAD}"

          test -f \
            patches/0001-Add-Netcore-N30-Pro-support.patch

          test -f \
            scripts/apply-netcore-n30pro.sh

          echo
          echo "===== Repository files ====="

          find . \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

      # ============================================================
      # 5. Apply N30 Pro adaptation
      # ============================================================
      - name: Apply Netcore N30 Pro adaptation
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          echo "========================================"
          echo "Apply N30 Pro adaptation"
          echo "========================================"

          test -f \
            ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh

          test -f \
            ../Netcore-N30-Pro-patch-for-OpenWrt/patches/0001-Add-Netcore-N30-Pro-support.patch

          bash \
            ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh \
            ../Netcore-N30-Pro-patch-for-OpenWrt

          echo
          echo "========================================"
          echo "Verify N30 Pro adaptation"
          echo "========================================"

          test -f \
            target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts

          grep -Fq \
            'define Device/netcore_n30-pro' \
            target/linux/mediatek/image/filogic.mk

          grep -Fq \
            'TARGET_DEVICES += netcore_n30-pro' \
            target/linux/mediatek/image/filogic.mk

          grep -Fq \
            'netcore,n30-pro' \
            target/linux/mediatek/filogic/base-files/etc/board.d/02_network

          grep -Fq \
            'netcore,n30-pro' \
            target/linux/mediatek/filogic/base-files/etc/hotplug.d/ieee80211/11_fix_wifi_mac

          echo "[PASS] N30 Pro adaptation applied."

          git diff --check

      # ============================================================
      # 6. Verify USB VBUS DTS
      # ============================================================
      - name: Verify N30 Pro USB VBUS DTS
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          DTS_FILE="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

          echo "========================================"
          echo "USB VBUS DTS verification"
          echo "========================================"

          test -f "$DTS_FILE"

          grep -Fq \
            'usb_vbus: regulator-usb-vbus' \
            "$DTS_FILE"

          grep -Fq \
            'compatible = "regulator-fixed"' \
            "$DTS_FILE"

          grep -Fq \
            'regulator-name = "usb-vbus"' \
            "$DTS_FILE"

          grep -Fq \
            'regulator-min-microvolt = <5000000>' \
            "$DTS_FILE"

          grep -Fq \
            'regulator-max-microvolt = <5000000>' \
            "$DTS_FILE"

          grep -Fq \
            'gpio = <&pio 23 GPIO_ACTIVE_HIGH>' \
            "$DTS_FILE"

          grep -Fq \
            'enable-active-high' \
            "$DTS_FILE"

          grep -Fq \
            'regulator-boot-on' \
            "$DTS_FILE"

          grep -Fq \
            'vbus-supply = <&usb_vbus>' \
            "$DTS_FILE"

          echo "[PASS] GPIO23 USB VBUS 5V configuration found."

      # ============================================================
      # 7. Update / install feeds
      # ============================================================
      - name: Update and install ImmortalWrt feeds
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 8. Generate target/package Kconfig databases
      # ============================================================
      - name: Generate Kconfig metadata
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          # Create a minimal initial configuration so OpenWrt can
          # generate the target/package Kconfig metadata.

          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          EOF

          make defconfig

          test -f tmp/.config-target.in
          test -f tmp/.config-package.in

          echo "===== Target Kconfig candidates ====="

          grep -n \
            'netcore.*n30' \
            tmp/.config-target.in \
            || true

          echo
          echo "===== Package Kconfig database generated ====="

          wc -l \
            tmp/.config-package.in

      # ============================================================
      # 9. Dynamically locate N30 Pro target symbol
      #
      # Do NOT hardcode a guessed target symbol.
      # ============================================================
      - name: Detect exact N30 Pro target symbol
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          TARGET_DB="tmp/.config-target.in"

          echo "========================================"
          echo "Detect N30 Pro target symbol"
          echo "========================================"

          test -f "$TARGET_DB"

          TARGET_SYMBOL="$(
            sed -n \
              -E \
              's/^config (TARGET_[A-Za-z0-9_]*netcore[_-]n30[_-]pro[A-Za-z0-9_-]*).*$/\1/p' \
              "$TARGET_DB" \
              | head -n 1
          )"

          if [ -z "$TARGET_SYMBOL" ]; then
              echo "[ERROR] Could not find N30 Pro target symbol."
              echo
              echo "===== All Netcore target symbols ====="
              grep -ni \
                'netcore' \
                "$TARGET_DB" \
                || true
              exit 1
          fi

          echo "Detected:"
          echo "${TARGET_SYMBOL}"

          # Save for later steps.
          printf '%s\n' "$TARGET_SYMBOL" \
            > "$GITHUB_WORKSPACE/n30pro-target-symbol.txt"

          echo
          echo "[PASS] N30 Pro target symbol detected."

      # ============================================================
      # 10. Select N30 Pro target
      # ============================================================
      - name: Select N30 Pro target
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          TARGET_SYMBOL="$(
            cat "$GITHUB_WORKSPACE/n30pro-target-symbol.txt"
          )"

          echo "Using target:"
          echo "$TARGET_SYMBOL"

          # Start from a clean configuration.
          rm -f .config

          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "${TARGET_SYMBOL}=y"
          } > .config

          make defconfig

          echo
          echo "========================================"
          echo "Verify N30 Pro target"
          echo "========================================"

          if grep -q "^${TARGET_SYMBOL}=y$" .config; then
              echo "[PASS] ${TARGET_SYMBOL}=y"
          else
              echo "[ERROR] N30 Pro target was stripped by Kconfig."
              echo
              echo "===== Current target configuration ====="
              grep '^CONFIG_TARGET_' .config || true
              echo
              echo "===== Netcore target candidates ====="
              grep -ni \
                'netcore' \
                tmp/.config-target.in \
                || true
              exit 1
          fi

      # ============================================================
      # 11. Verify required package symbols
      # ============================================================
      - name: Verify required package symbols
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          PACKAGE_DB="tmp/.config-package.in"

          package_symbol_exists() {
              local pkg="$1"

              grep -Fxq \
                "config PACKAGE_${pkg}" \
                "$PACKAGE_DB"
          }

          REQUIRED_PACKAGES="
          luci
          luci-app-passwall
          mwan3
          luci-app-mwan3
          samba4-server
          luci-app-samba4
          kmod-usb-core
          kmod-usb3
          kmod-usb-xhci-hcd
          kmod-usb-xhci-mtk
          kmod-nft-socket
          kmod-nft-tproxy
          kmod-nft-nat
          kmod-nf-reject
          kmod-nf-reject6
          kmod-usb-net
          kmod-usb-net-cdc-ether
          kmod-usb-net-cdc-ncm
          kmod-usb-net-rndis
          kmod-usb-wdm
          kmod-usb-net-qmi-wwan
          kmod-usb-net-cdc-mbim
          kmod-usb-serial
          kmod-usb-serial-option
          kmod-usb-serial-wwan
          kmod-usb-acm
          kmod-usb-storage
          kmod-usb-storage-uas
          kmod-fs-ext4
          kmod-fs-vfat
          uqmi
          umbim
          "

          echo "========================================"
          echo "Required package symbol verification"
          echo "========================================"

          for pkg in $REQUIRED_PACKAGES; do
              if package_symbol_exists "$pkg"; then
                  echo "[FOUND] ${pkg}"
              else
                  echo "[ERROR] Missing package symbol: ${pkg}"
                  exit 1
              fi
          done

          echo
          echo "[PASS] All required package symbols exist."

      # ============================================================
      # 12. Configure required packages
      # ============================================================
      - name: Configure required packages
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          cat >> .config <<'EOF'

          # ========================================================
          # LuCI
          # ========================================================
          CONFIG_PACKAGE_luci=y

          # ========================================================
          # PassWall
          # ========================================================
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y

          # ========================================================
          # MWAN3
          # ========================================================
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y

          # ========================================================
          # Samba4
          # ========================================================
          CONFIG_PACKAGE_samba4-server=y
          CONFIG_PACKAGE_luci-app-samba4=y

          # ========================================================
          # N30 Pro USB 3 / XHCI
          # ========================================================
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y

          # ========================================================
          # USB networking / 4G / 5G
          # ========================================================
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y

          # ========================================================
          # USB serial modem
          # ========================================================
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-acm=y

          # ========================================================
          # USB modem userspace
          # ========================================================
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y

          # ========================================================
          # USB storage
          # ========================================================
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y

          # ========================================================
          # PassWall nftables
          # ========================================================
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y
          EOF

      # ============================================================
      # 13. Optional packages
      # ============================================================
      - name: Enable optional packages
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          PACKAGE_DB="tmp/.config-package.in"

          package_exists() {
              grep -Fxq \
                "config PACKAGE_$1" \
                "$PACKAGE_DB"
          }

          OPTIONAL_PACKAGES="
          usbutils
          usb-modeswitch
          luci-proto-qmi
          luci-proto-mbim
          luci-proto-ncm
          kmod-usb-storage-extras
          kmod-fs-ntfs3
          geoview
          haproxy
          shadowsocks-rust-sslocal
          shadowsocksr-libev-ssr-local
          shadowsocksr-libev-ssr-redir
          simple-obfs-client
          sing-box
          v2ray-plugin
          xray-core
          unzip
          ipt2socks
          chinadns-ng
          dns2socks
          microsocks
          resolveip
          tcping
          lyaml
          coreutils
          coreutils-base64
          coreutils-nohup
          coreutils-timeout
          coreutils-time
          curl
          dnsmasq-full
          ip-full
          libuci-lua
          lua
          luci-compat
          luci-lib-jsonc
          "

          for pkg in $OPTIONAL_PACKAGES; do
              if package_exists "$pkg"; then
                  echo "CONFIG_PACKAGE_${pkg}=y" >> .config
                  echo "[ENABLED] ${pkg}"
              else
                  echo "[SKIPPED] ${pkg}"
              fi
          done

          make defconfig

      # ============================================================
      # 14. Final strict configuration verification
      # ============================================================
      - name: Verify final configuration
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          TARGET_SYMBOL="$(
            cat "$GITHUB_WORKSPACE/n30pro-target-symbol.txt"
          )"

          echo "========================================"
          echo "FINAL CONFIGURATION"
          echo "========================================"

          echo
          echo "===== Target ====="

          grep '^CONFIG_TARGET_' .config || true

          grep -q \
            '^CONFIG_TARGET_mediatek=y$' \
            .config

          grep -q \
            '^CONFIG_TARGET_mediatek_filogic=y$' \
            .config

          grep -q \
            "^${TARGET_SYMBOL}=y$" \
            .config || {
              echo "[ERROR] N30 Pro target was not retained:"
              echo "${TARGET_SYMBOL}"
              exit 1
            }

          echo "[PASS] ${TARGET_SYMBOL}=y"

          echo
          echo "===== Required userspace ====="

          REQUIRED_USERSPACE="
          CONFIG_PACKAGE_luci
          CONFIG_PACKAGE_luci-app-passwall
          CONFIG_PACKAGE_mwan3
          CONFIG_PACKAGE_luci-app-mwan3
          CONFIG_PACKAGE_samba4-server
          CONFIG_PACKAGE_luci-app-samba4
          CONFIG_PACKAGE_uqmi
          CONFIG_PACKAGE_umbim
          "

          for cfg in $REQUIRED_USERSPACE; do
              grep -q "^${cfg}=y$" .config || {
                  echo "[ERROR] Missing ${cfg}=y"
                  exit 1
              }

              echo "[PASS] ${cfg}=y"
          done

          echo
          echo "===== Required KernelPackages ====="

          REQUIRED_KERNEL="
          CONFIG_PACKAGE_kmod-usb-core
          CONFIG_PACKAGE_kmod-usb3
          CONFIG_PACKAGE_kmod-usb-xhci-hcd
          CONFIG_PACKAGE_kmod-usb-xhci-mtk
          CONFIG_PACKAGE_kmod-nft-socket
          CONFIG_PACKAGE_kmod-nft-tproxy
          CONFIG_PACKAGE_kmod-nft-nat
          CONFIG_PACKAGE_kmod-nf-reject
          CONFIG_PACKAGE_kmod-nf-reject6
          CONFIG_PACKAGE_kmod-usb-net
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm
          CONFIG_PACKAGE_kmod-usb-net-rndis
          CONFIG_PACKAGE_kmod-usb-wdm
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim
          CONFIG_PACKAGE_kmod-usb-serial
          CONFIG_PACKAGE_kmod-usb-serial-option
          CONFIG_PACKAGE_kmod-usb-serial-wwan
          CONFIG_PACKAGE_kmod-usb-acm
          CONFIG_PACKAGE_kmod-usb-storage
          CONFIG_PACKAGE_kmod-usb-storage-uas
          CONFIG_PACKAGE_kmod-fs-ext4
          CONFIG_PACKAGE_kmod-fs-vfat
          "

          for cfg in $REQUIRED_KERNEL; do
              grep -q "^${cfg}=y$" .config || {
                  echo "[ERROR] Missing ${cfg}=y"
                  exit 1
              }

              echo "[PASS] ${cfg}=y"
          done

          echo
          echo "===== PassWall ====="

          grep -q \
            '^CONFIG_PACKAGE_luci-app-passwall=y$' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y$' \
            .config

          echo "[PASS] PassWall nftables transparent proxy enabled."

          echo
          echo "===== N30 Pro target symbol ====="

          echo "${TARGET_SYMBOL}=y"

          echo
          echo "[PASS] Complete final .config verification."

      # ============================================================
      # 15. Samba4 security check
      # ============================================================
      - name: Verify Samba4 security ACL
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "Samba4 security verification"
          echo "========================================"

          python3 <<'PY'
          import json
          import pathlib
          import sys

          roots = [
              pathlib.Path("feeds"),
              pathlib.Path("package"),
          ]

          checked = 0
          dangerous = []

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*.json"):
                  if "samba4" not in path.name.lower():
                      continue

                  try:
                      data = json.loads(
                          path.read_text(encoding="utf-8")
                      )
                  except Exception:
                      continue

                  checked += 1

                  read_acl = data.get("read", {})
                  file_acl = read_acl.get("file", {})

                  perms = file_acl.get(
                      "/usr/sbin/smbd",
                      []
                  )

                  if isinstance(perms, list) and "exec" in perms:
                      dangerous.append(
                          (str(path), perms)
                      )

          print(f"Checked Samba4 ACL files: {checked}")

          if dangerous:
              print()
              print("ERROR: Dangerous Samba4 ACL detected.")

              for path, perms in dangerous:
                  print(f"File: {path}")
                  print(f"Permissions: {perms}")

              sys.exit(1)

          print(
              "[PASS] No Samba4 read ACL grants exec "
              "permission to /usr/sbin/smbd."
          )
          PY

      # ============================================================
      # 16. Download source
      # ============================================================
      - name: Download source archives
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          make download -j"$(nproc)" V=s

      # ============================================================
      # 17. Build
      # ============================================================
      - name: Build firmware
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          echo "========================================"
          echo "BUILD START"
          echo "========================================"

          START_TIME="$(date +%s)"

          make -j"$(nproc)" V=s

          END_TIME="$(date +%s)"

          echo
          echo "========================================"
          echo "BUILD FINISHED"
          echo "Build time: $((END_TIME - START_TIME)) seconds"
          echo "========================================"

      # ============================================================
      # 18. Verify generated KernelPackages
      # ============================================================
      - name: Verify generated KernelPackages
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "GENERATED KERNEL PACKAGES"
          echo "========================================"

          REQUIRED_APKS="
          kmod-usb3
          kmod-usb-xhci-hcd
          kmod-usb-xhci-mtk
          kmod-nft-socket
          kmod-nft-tproxy
          kmod-nft-nat
          kmod-nf-reject
          kmod-nf-reject6
          kmod-usb-net-cdc-ether
          kmod-usb-net-cdc-ncm
          kmod-usb-net-rndis
          kmod-usb-wdm
          kmod-usb-net-qmi-wwan
          kmod-usb-net-cdc-mbim
          kmod-usb-serial-option
          kmod-usb-serial-wwan
          "

          for pkg in $REQUIRED_APKS; do

              FILE="$(
                find bin/packages \
                  -type f \
                  -name "${pkg}-*.apk" \
                  -print -quit
              )"

              if [ -n "$FILE" ]; then
                  echo "[PASS] ${pkg}"
              else
                  echo "[ERROR] Generated APK missing: ${pkg}"
                  exit 1
              fi

          done

      # ============================================================
      # 19. Verify userspace APKs
      # ============================================================
      - name: Verify generated userspace packages
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "GENERATED USERSPACE PACKAGES"
          echo "========================================"

          REQUIRED_APKS="
          luci-app-passwall
          mwan3
          luci-app-mwan3
          samba4-server
          luci-app-samba4
          uqmi
          umbim
          "

          for pkg in $REQUIRED_APKS; do

              FILE="$(
                find bin/packages \
                  -type f \
                  -name "${pkg}-*.apk" \
                  -print -quit
              )"

              if [ -n "$FILE" ]; then
                  echo "[PASS] ${pkg}"
              else
                  echo "[ERROR] Generated APK missing: ${pkg}"
                  exit 1
              fi

          done

      # ============================================================
      # 20. Verify firmware manifest
      # ============================================================
      - name: Verify firmware manifest
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "FIRMWARE MANIFEST"
          echo "========================================"

          MANIFEST="$(
            find bin/targets/mediatek/filogic \
              -type f \
              -name '*.manifest' \
              -print -quit
          )"

          if [ -z "$MANIFEST" ]; then
              echo "[WARNING] No .manifest file found."
              echo "[INFO] Continuing with generated APK verification."
              exit 0
          fi

          echo "Manifest:"
          echo "$MANIFEST"

          REQUIRED="
          luci-app-passwall
          mwan3
          luci-app-mwan3
          samba4-server
          luci-app-samba4
          kmod-usb3
          kmod-usb-xhci-hcd
          kmod-usb-xhci-mtk
          kmod-nft-socket
          kmod-nft-tproxy
          "

          for pkg in $REQUIRED; do

              if grep -Eq \
                "^${pkg}([[:space:]-])" \
                "$MANIFEST"; then

                  echo "[PASS] ${pkg}"

              else

                  echo "[WARNING] ${pkg} not found in manifest."

              fi

          done

      # ============================================================
      # 21. Verify firmware files
      # ============================================================
      - name: Verify firmware images
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "FIRMWARE IMAGES"
          echo "========================================"

          find bin/targets/mediatek/filogic \
            -maxdepth 2 \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.itb' \
              -o -name '*.img' \
              -o -name '*.tar' \
            \) \
            -printf '%s %p\n' \
            | sort -n

          echo
          echo "===== Firmware image check ====="

          IMAGE_COUNT="$(
            find bin/targets/mediatek/filogic \
              -type f \
              \( \
                -name '*.bin' \
                -o -name '*.itb' \
                -o -name '*.img' \
                -o -name '*.tar' \
              \) \
              | wc -l
          )"

          if [ "$IMAGE_COUNT" -eq 0 ]; then
              echo "[ERROR] No firmware image generated."
              exit 1
          fi

          echo "[PASS] ${IMAGE_COUNT} firmware image(s) generated."

      # ============================================================
      # 22. Generate report
      # ============================================================
      - name: Generate build report
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          REPORT="$GITHUB_WORKSPACE/build-report.txt"

          {
            echo "=================================================="
            echo "ImmortalWrt 25.12.2"
            echo "Netcore N30 Pro"
            echo "Build Report"
            echo "=================================================="
            echo

            echo "===== ImmortalWrt ====="
            git rev-parse HEAD
            git describe --tags --always || true
            echo

            echo "===== N30 Pro patch ====="
            cd "$GITHUB_WORKSPACE/Netcore-N30-Pro-patch-for-OpenWrt"
            git rev-parse HEAD
            cd "$GITHUB_WORKSPACE/immortalwrt"
            echo

            echo "===== N30 Pro target ====="
            cat "$GITHUB_WORKSPACE/n30pro-target-symbol.txt"
            echo

            echo "===== Target configuration ====="
            grep '^CONFIG_TARGET_' .config || true
            echo

            echo "===== PassWall ====="
            grep \
              '^CONFIG_PACKAGE_luci-app-passwall' \
              .config || true
            echo

            echo "===== MWAN3 ====="
            grep -E \
              '^CONFIG_PACKAGE_(mwan3|luci-app-mwan3)=' \
              .config || true
            echo

            echo "===== Samba4 ====="
            grep -E \
              '^CONFIG_PACKAGE_(samba4-server|luci-app-samba4)=' \
              .config || true
            echo

            echo "===== USB ====="
            grep \
              '^CONFIG_PACKAGE_kmod-usb' \
              .config || true
            echo

            echo "===== NFT ====="
            grep -E \
              '^CONFIG_PACKAGE_kmod-(nft|nf-reject)' \
              .config || true
            echo

            echo "===== Firmware ====="
            find bin/targets/mediatek/filogic \
              -maxdepth 2 \
              -type f \
              \( \
                -name '*.bin' \
                -o -name '*.itb' \
                -o -name '*.img' \
                -o -name '*.tar' \
              \) \
              -printf '%p\n' \
              | sort
            echo

            echo "===== Generated Kernel APKs ====="
            find bin/packages \
              -type f \
              \( \
                -name 'kmod-usb3*.apk' \
                -o -name 'kmod-usb-xhci-hcd*.apk' \
                -o -name 'kmod-usb-xhci-mtk*.apk' \
                -o -name 'kmod-nft-socket*.apk' \
                -o -name 'kmod-nft-tproxy*.apk' \
                -o -name 'kmod-nft-nat*.apk' \
                -o -name 'kmod-nf-reject*.apk' \
                -o -name 'kmod-nf-reject6*.apk' \
              \) \
              -printf '%p\n' \
              | sort
            echo

            echo "===== Build status ====="
            echo "SUCCESS"

          } > "$REPORT"

          cat "$REPORT"

      # ============================================================
      # 23. Collect artifacts
      # ============================================================
      - name: Collect artifacts
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          mkdir -p \
            "$GITHUB_WORKSPACE/artifacts/firmware" \
            "$GITHUB_WORKSPACE/artifacts/packages" \
            "$GITHUB_WORKSPACE/artifacts/source"

          # Firmware
          find bin/targets/mediatek/filogic \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.itb' \
              -o -name '*.img' \
              -o -name '*.tar' \
              -o -name '*.manifest' \
            \) \
            -exec cp -v {} \
            "$GITHUB_WORKSPACE/artifacts/firmware/" \;

          # APKs
          find bin/packages \
            -type f \
            -name '*.apk' \
            -exec cp -v {} \
            "$GITHUB_WORKSPACE/artifacts/packages/" \;

          # Config
          cp \
            .config \
            "$GITHUB_WORKSPACE/artifacts/source/n30pro.config"

          # Target symbol
          cp \
            "$GITHUB_WORKSPACE/n30pro-target-symbol.txt" \
            "$GITHUB_WORKSPACE/artifacts/source/"

          # DTS
          cp \
            target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts \
            "$GITHUB_WORKSPACE/artifacts/source/"

          # Patch
          cp \
            "$GITHUB_WORKSPACE/Netcore-N30-Pro-patch-for-OpenWrt/patches/0001-Add-Netcore-N30-Pro-support.patch" \
            "$GITHUB_WORKSPACE/artifacts/source/"

          echo "===== SHA256 ====="

          (
            cd "$GITHUB_WORKSPACE/artifacts"

            find . \
              -type f \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > \
            "$GITHUB_WORKSPACE/artifacts/SHA256SUMS"

      # ============================================================
      # 24. Upload firmware
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-firmware
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 25. Upload packages
      # ============================================================
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 26. Upload report/source
      # ============================================================
      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-build-report
          path: |
            build-report.txt
            artifacts/source/
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
```
