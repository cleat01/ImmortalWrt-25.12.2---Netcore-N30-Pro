name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Full


on:
  workflow_dispatch:


env:

  IMMORTALWRT_BRANCH: openwrt-25.12

  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git



jobs:


  build:


    runs-on: ubuntu-22.04


    steps:



    - name: Checkout

      uses: actions/checkout@v4




    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          unzip \
          wget \
          file \
          zlib1g-dev




    - name: Clone ImmortalWrt

      run: |

        git clone \
          --branch ${IMMORTALWRT_BRANCH} \
          https://github.com/immortalwrt/immortalwrt.git \
          immortalwrt





    - name: Clone N30 Pro patch

      run: |

        git clone \
          --depth=1 \
          ${PATCH_REPO} \
          n30pro-patch





    - name: Apply N30 Pro patch


      working-directory: immortalwrt


      run: |


        bash ../n30pro-patch/scripts/apply-netcore-n30pro.sh \
        ../n30pro-patch





    - name: Verify N30 Pro DTS


      working-directory: immortalwrt


      run: |


        find target/linux/mediatek \
        -iname "*n30*"




    - name: Update feeds


      working-directory: immortalwrt


      run: |


        ./scripts/feeds update -a

        ./scripts/feeds install -a





    - name: Add custom package feed


      working-directory: immortalwrt


      run: |


        mkdir -p package/custom


        echo "src-link custom ../package/custom" >> feeds.conf.default




    - name: Configure firmware


      working-directory: immortalwrt


      run: |


        ./scripts/config set CONFIG_TARGET_mediatek y

        ./scripts/config set CONFIG_TARGET_mediatek_filogic y

        ./scripts/config set CONFIG_TARGET_ROOTFS_SQUASHFS y



        #
        # LuCI
        #

        ./scripts/config set CONFIG_PACKAGE_luci y

        ./scripts/config set CONFIG_PACKAGE_luci-ssl y



        #
        # USB xHCI
        #

        ./scripts/config set CONFIG_PACKAGE_kmod-usb3 y

        ./scripts/config set CONFIG_PACKAGE_kmod-usb-xhci-hcd y

        ./scripts/config set CONFIG_PACKAGE_kmod-usb-xhci-mtk y



        #
        # USB Storage
        #

        ./scripts/config set CONFIG_PACKAGE_kmod-usb-storage y

        ./scripts/config set CONFIG_PACKAGE_kmod-usb-storage-uas y

        ./scripts/config set CONFIG_PACKAGE_block-mount y



        #
        # Filesystem
        #

        ./scripts/config set CONFIG_PACKAGE_kmod-fs-ext4 y

        ./scripts/config set CONFIG_PACKAGE_kmod-fs-exfat y

        ./scripts/config set CONFIG_PACKAGE_kmod-fs-vfat y




        #
        # 4G 5G modem
        #

        ./scripts/config set CONFIG_PACKAGE_kmod-usb-net y

        ./scripts/config set CONFIG_PACKAGE_kmod-usb-net-cdc-ether y

        ./scripts/config set CONFIG_PACKAGE_kmod-usb-net-cdc-ncm y

        ./scripts/config set CONFIG_PACKAGE_kmod-usb-net-qmi-wwan y


        ./scripts/config set CONFIG_PACKAGE_kmod-usb-serial y

        ./scripts/config set CONFIG_PACKAGE_kmod-usb-serial-option y

        ./scripts/config set CONFIG_PACKAGE_kmod-usb-wdm y


        ./scripts/config set CONFIG_PACKAGE_usb-modeswitch y

        ./scripts/config set CONFIG_PACKAGE_uqmi y

        ./scripts/config set CONFIG_PACKAGE_umbim y




        #
        # MWAN3
        #

        ./scripts/config set CONFIG_PACKAGE_mwan3 y

        ./scripts/config set CONFIG_PACKAGE_luci-app-mwan3 y




        #
        # Samba4
        #

        ./scripts/config set CONFIG_PACKAGE_samba4-server y

        ./scripts/config set CONFIG_PACKAGE_luci-app-samba4 y

        ./scripts/config set CONFIG_PACKAGE_samba4-utils y





        #
        # PassWall
        #

        ./scripts/config set CONFIG_PACKAGE_luci-app-passwall y

        ./scripts/config set CONFIG_PACKAGE_xray-core y

        ./scripts/config set CONFIG_PACKAGE_sing-box y

        ./scripts/config set CONFIG_PACKAGE_kmod-tun y

        ./scripts/config set CONFIG_PACKAGE_kmod-nft-tproxy y





        make defconfig





    - name: Install custom IPK packages


      working-directory: immortalwrt


      run: |


        mkdir -p files/usr/lib/custom-ipk


        if [ -d ../custom_packages ]; then

          cp ../custom_packages/*.ipk files/usr/lib/custom-ipk/ || true

        fi





    - name: Download packages


      working-directory: immortalwrt


      run: |


        make download -j$(nproc)





    - name: Compile firmware


      working-directory: immortalwrt


      run: |


        make -j$(nproc) V=s





    - name: Collect output


      working-directory: immortalwrt


      run: |


        mkdir output


        cp -a bin/targets output/


        cp -a bin/packages output/


        cp .config output/config



        find bin/targets \
        -name "*.manifest" \
        -exec cp {} output/ \;



        find bin/targets \
        -name "*.sha256sums" \
        -exec cp {} output/ \;






    - name: Upload firmware


      uses: actions/upload-artifact@v4


      with:


        name: ImmortalWrt-25.12.2-N30Pro-Full


        path: immortalwrt/output
