name: Build ImmortalWrt 25.12.2 Netcore N30 Pro


on:
  workflow_dispatch:


permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      - name: Install build environment

        shell: bash

        run: |

          set -e

          sudo bash -c \
          'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'





      - name: Clone ImmortalWrt 25.12.2

        shell: bash

        run: |

          set -e


          git clone \
          --depth 1 \
          --branch v25.12.2 \
          https://github.com/immortalwrt/immortalwrt.git \
          immortalwrt



          cd immortalwrt


          git describe --tags --always

          git rev-parse HEAD





      - name: Clone N30 Pro patch

        shell: bash

        run: |

          set -e


          git clone \
          --depth 1 \
          https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
          n30-patch





      - name: Check and apply N30 patch

        shell: bash

        working-directory: immortalwrt

        run: |

          set -e


          if grep -Rqs "netcore,n30-pro" target/linux/mediatek; then

            echo "N30 support already exists"

          else

            echo "Applying N30 patch"

            bash ../n30-patch/scripts/apply-netcore-n30pro.sh \
            ../n30-patch

          fi





      - name: Verify N30 DTS USB VBUS

        shell: bash

        working-directory: immortalwrt

        run: |

          set -e


          DTS=$(find target/linux/mediatek -name "*n30*pro*.dts" | head -1)



          if [ -z "$DTS" ]; then

            echo "N30 DTS not found"

            exit 1

          fi



          echo "$DTS"



          grep -Fq \
          'regulator-name = "usb-vbus";' \
          "$DTS"



          grep -Fq \
          'gpio = <&pio 23 GPIO_ACTIVE_HIGH>;' \
          "$DTS"



          echo "USB VBUS OK"





      - name: Update feeds

        shell: bash

        working-directory: immortalwrt

        run: |

          set -e


          ./scripts/feeds update -a

          ./scripts/feeds install -a





      - name: Generate configuration

        shell: bash

        working-directory: immortalwrt

        run: |

          set -e



          rm -f .config



          echo "Searching N30 device"



          DEVICE=$(grep -R "Device/netcore" target/linux/mediatek/image/filogic.mk \
          | head -1 \
          | sed 's/.*Device\///')



          if [ -z "$DEVICE" ]; then

            DEVICE=$(grep -R "Device/netis" target/linux/mediatek/image/filogic.mk \
            | grep -i nx30 \
            | head -1 \
            | sed 's/.*Device\///')

          fi



          echo "Detected device: $DEVICE"



          if [ -z "$DEVICE" ]; then

            echo "No N30 device found"

            exit 1

          fi



          echo "CONFIG_TARGET_mediatek=y" >> .config

          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config

          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE}=y" >> .config



          echo "CONFIG_PACKAGE_luci=y" >> .config

          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config



          echo "CONFIG_PACKAGE_kmod-usb3=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-xhci-hcd=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-xhci-mtk=y" >> .config



          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> .config



          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config

          echo "CONFIG_PACKAGE_kmod-fs-vfat=y" >> .config

          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config



          echo "CONFIG_PACKAGE_kmod-usb-net=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config



          echo "CONFIG_PACKAGE_kmod-usb-serial=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-wdm=y" >> .config

          echo "CONFIG_PACKAGE_usb-modeswitch=y" >> .config

          echo "CONFIG_PACKAGE_uqmi=y" >> .config



          echo "CONFIG_PACKAGE_mwan3=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config



          echo "CONFIG_PACKAGE_samba4-server=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config



          echo "CONFIG_PACKAGE_curl=y" >> .config

          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config

          echo "CONFIG_PACKAGE_tcpdump=y" >> .config

          echo "CONFIG_PACKAGE_htop=y" >> .config



          make defconfig





      - name: Verify configuration

        shell: bash

        working-directory: immortalwrt

        run: |

          set -e


          grep CONFIG_TARGET_mediatek .config

          grep CONFIG_PACKAGE_kmod-usb3 .config

          grep CONFIG_PACKAGE_kmod-usb-xhci-mtk .config

          grep CONFIG_PACKAGE_mwan3 .config

          grep CONFIG_PACKAGE_samba4-server .config





      - name: Add custom IPK

        shell: bash

        working-directory: immortalwrt

        run: |

          set -e


          mkdir -p files/usr/share/custom-packages


          if [ -d ../custom_packages ]; then

            cp ../custom_packages/*.ipk \
            files/usr/share/custom-packages/ \
            2>/dev/null || true

          fi





      - name: Download sources

        shell: bash

        working-directory: immortalwrt

        run: |

          set -e


          make download -j$(nproc) V=s





      - name: Build firmware

        shell: bash

        working-directory: immortalwrt

        run: |

          set -e


          make -j$(nproc) V=s





      - name: Verify XHCI modules

        shell: bash

        working-directory: immortalwrt

        run: |

          set -e


          find build_dir -name "xhci-hcd.ko"

          find build_dir -name "xhci-mtk-hcd.ko"



          test $(find build_dir -name "xhci-hcd.ko" | wc -l) -gt 0

          test $(find build_dir -name "xhci-mtk-hcd.ko" | wc -l) -gt 0





      - name: Upload firmware

        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.2-N30Pro

          path: |

            immortalwrt/bin/targets/mediatek/filogic/**

          retention-days: 7
