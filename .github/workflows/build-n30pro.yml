name: "Build ImmortalWrt 25.12.2 - Netcore N30 Pro"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "n30pro-build-${{ github.ref }}"
  cancel-in-progress: true

env:
  IMMORTALWRT_TAG: "v25.12.2"
  PATCH_REPO: "https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git"
  PATCH_DIR: "Netcore-N30-Pro-patch-for-OpenWrt"
  BUILD_DIR: "immortalwrt-n30pro"

jobs:
  build:
    name: "Build N30 Pro firmware"
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: "Checkout workflow repository"
        uses: actions/checkout@v5

      - name: "Install build dependencies"
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            xsltproc \
            libelf-dev \
            ccache \
            ecj \
            fastjar \
            java-propose-classpath \
            device-tree-compiler \
            quilt \
            libxml-parser-perl \
            libyaml-perl \
            libpython3-dev

      - name: "Clone ImmortalWrt"
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${BUILD_DIR}"

          git clone \
            --depth 1 \
            --branch "${IMMORTALWRT_TAG}" \
            https://github.com/immortalwrt/immortalwrt.git \
            "${BUILD_DIR}"

          cd "${BUILD_DIR}"

          echo "ImmortalWrt commit:"
          git rev-parse HEAD

      - name: "Clone N30 Pro patch repository"
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${PATCH_DIR}"

          git clone \
            --depth 1 \
            --branch main \
            "${PATCH_REPO}" \
            "${PATCH_DIR}"

          cd "${PATCH_DIR}"

          echo "N30 Pro patch commit:"
          git rev-parse HEAD

          test -f patches/0001-Add-Netcore-N30-Pro-support.patch
          test -f scripts/apply-netcore-n30pro.sh

      - name: "Apply N30 Pro patch"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          bash \
            "../${PATCH_DIR}/scripts/apply-netcore-n30pro.sh" \
            "../${PATCH_DIR}"

      - name: "Verify N30 Pro source files"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking N30 Pro image definition..."

          test -f target/linux/mediatek/image/filogic.mk

          grep -Rqs \
            "Device/netcore_n30-pro" \
            target/linux/mediatek/image/filogic.mk

          echo "Checking N30 Pro DTS..."

          DTS=""

          for f in \
            target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-netcore-n30-pro.dts \
            target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts \
            target/linux/mediatek/files/arch/arm64/boot/dts/mediatek/mt7981b-netcore-n30-pro.dts
          do
            if [ -f "$f" ]; then
              DTS="$f"
              break
            fi
          done

          if [ -z "$DTS" ]; then
            echo "ERROR: N30 Pro DTS not found."
            exit 1
          fi

          echo "DTS: $DTS"

      - name: "Verify USB VBUS fix"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          DTS=""

          for f in \
            target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7981b-netcore-n30-pro.dts \
            target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts \
            target/linux/mediatek/files/arch/arm64/boot/dts/mediatek/mt7981b-netcore-n30-pro.dts
          do
            if [ -f "$f" ]; then
              DTS="$f"
              break
            fi
          done

          test -n "$DTS"

          grep -q "regulator-usb-vbus" "$DTS"
          grep -q "gpio = <&pio 23 GPIO_ACTIVE_HIGH>" "$DTS"
          grep -q "vbus-supply = <&usb_vbus>" "$DTS"
          grep -q "&usb_phy" "$DTS"
          grep -q "&xhci" "$DTS"

          echo "USB VBUS GPIO23 configuration verified."

      - name: "Update feeds"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: "Prepare build metadata"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf tmp

          make prepare-tmpinfo

          test -f tmp/.config-target.in
          test -f tmp/.config-package.in

      - name: "Detect N30 Pro target"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for N30 Pro target"
          echo "========================================"

          grep -inE \
            "netcore|n30.?pro" \
            tmp/.config-target.in \
            | head -100 \
            || true

          TARGET_SYMBOL="$(
            sed -n -E \
              's/^[[:space:]]*config[[:space:]]+(TARGET_[A-Za-z0-9_-]*netcore[_-]n30[_-]pro[A-Za-z0-9_-]*).*/\1/p' \
              tmp/.config-target.in \
              | head -n 1
          )"

          if [ -z "$TARGET_SYMBOL" ]; then
            TARGET_SYMBOL="$(
              grep -iE \
                "netcore.*n30.*pro|n30.*pro.*netcore" \
                tmp/.config-target.in \
                | sed -n -E \
                  's/^[[:space:]]*config[[:space:]]+(TARGET_[A-Za-z0-9_-]+).*/\1/p' \
                | head -n 1
            )"
          fi

          if [ -z "$TARGET_SYMBOL" ]; then
            echo "ERROR: N30 Pro target symbol was not found."

            echo "===== TARGET METADATA ====="

            grep -inE \
              "netcore|n30|pro" \
              tmp/.config-target.in \
              | head -200 \
              || true

            exit 1
          fi

          echo "Detected target symbol:"
          echo "$TARGET_SYMBOL"

          printf "%s\n" "$TARGET_SYMBOL" > /tmp/n30pro_target_symbol

      - name: "Configure N30 Pro target"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SYMBOL="$(cat /tmp/n30pro_target_symbol)"

          echo "Target symbol:"
          echo "$TARGET_SYMBOL"

          rm -f .config

          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=n
          CONFIG_TARGET_UBIFS_FREE_SPACE_FIXUP=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          CONFIG_${TARGET_SYMBOL#CONFIG_}=y
          EOF

          echo "===== Initial target configuration ====="
          cat .config

          make defconfig

          echo "===== Target after defconfig ====="

          grep "^CONFIG_TARGET_" .config \
            | grep -E \
              "DEVICE_|TARGET_(BOARD|SUBTARGET|PROFILE|MULTI_PROFILE)" \
            || true

          EXPECTED_LINE="CONFIG_${TARGET_SYMBOL#CONFIG_}=y"

          if ! grep -qx "$EXPECTED_LINE" .config; then
            echo
            echo "ERROR: N30 Pro target was not retained."
            echo "Expected:"
            echo "$EXPECTED_LINE"
            echo
            echo "Actual device target:"
            grep "^CONFIG_TARGET_DEVICE_" .config || true
            echo
            echo "Target profile:"
            grep "^CONFIG_TARGET_PROFILE=" .config || true
            exit 1
          fi

          if grep -q \
            "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_openwrt_one=y$" \
            .config
          then
            echo "ERROR: OpenWrt One was selected."
            exit 1
          fi

          echo
          echo "N30 Pro target retained successfully."

      - name: "Configure required packages"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          require_pkg() {
            local pkg="$1"

            if ! grep -qE \
              "^config PACKAGE_${pkg}$" \
              tmp/.config-package.in
            then
              echo "ERROR: Required package unavailable: ${pkg}"
              exit 1
            fi

            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          }

          optional_pkg() {
            local pkg="$1"

            if grep -qE \
              "^config PACKAGE_${pkg}$" \
              tmp/.config-package.in
            then
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            else
              echo "Optional package unavailable: ${pkg}"
            fi
          }

          echo "========================================"
          echo "Required packages"
          echo "========================================"

          for pkg in \
            luci \
            luci-ssl \
            luci-app-firewall \
            luci-app-opkg \
            firewall4 \
            nftables \
            nftables-json \
            ip-full \
            curl \
            usbutils \
            usb-modeswitch \
            block-mount \
            fdisk \
            e2fsprogs \
            kmod-fs-ext4 \
            kmod-fs-vfat \
            samba4-server \
            luci-app-samba4 \
            mwan3 \
            luci-app-mwan3 \
            luci-app-passwall \
            kmod-nft-socket \
            kmod-nft-tproxy \
            kmod-nft-nat \
            kmod-nf-reject \
            kmod-nf-reject6 \
            kmod-inet-diag \
            kmod-netlink-diag \
            kmod-tun \
            uqmi \
            umbim \
            kmod-usb-net \
            kmod-usb-net-cdc-ether \
            kmod-usb-net-cdc-ncm \
            kmod-usb-net-rndis \
            kmod-usb-wdm \
            kmod-usb-net-qmi-wwan \
            kmod-usb-net-cdc-mbim \
            kmod-usb-serial \
            kmod-usb-serial-option \
            kmod-usb-serial-wwan \
            kmod-usb-acm \
            kmod-usb-xhci-hcd \
            kmod-usb-xhci-mtk
          do
            require_pkg "$pkg"
          done

          echo "========================================"
          echo "Optional packages"
          echo "========================================"

          for pkg in \
            kmod-usb3 \
            kmod-usb-net-rtl8150 \
            kmod-usb-net-rtl8152 \
            kmod-usb-net-asix \
            kmod-usb-net-asix-ax88179 \
            kmod-usb-net-aqc111 \
            kmod-usb-serial-qualcomm \
            kmod-usb-serial-sierrawireless \
            luci-proto-qmi \
            luci-proto-mbim \
            luci-proto-ncm \
            automount \
            kmod-fs-exfat \
            kmod-wireguard \
            wireguard-tools \
            luci-proto-wireguard \
            bash \
            htop \
            tcpdump \
            ethtool \
            jq \
            openssh-sftp-server \
            ca-bundle \
            ca-certificates \
            dnsmasq-full \
            resolveip \
            coreutils \
            coreutils-base64 \
            coreutils-nohup \
            coreutils-timeout \
            libuci-lua \
            lua \
            luci-compat \
            luci-lib-jsonc \
            lyaml \
            microsocks \
            tcping \
            chinadns-ng \
            dns2socks \
            xray-core \
            sing-box \
            shadowsocks-rust-sslocal \
            simple-obfs \
            v2ray-plugin \
            haproxy \
            geoview \
            v2ray-geoip \
            v2ray-geosite
          do
            optional_pkg "$pkg"
          done

          if grep -qE \
            "^config PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy$" \
            tmp/.config-package.in
          then
            echo "CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y" >> .config
          else
            echo "ERROR: PassWall Nftables Transparent Proxy selector unavailable."
            exit 1
          fi

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=y
          EOF

          make defconfig

      - name: "Final configuration verification"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SYMBOL="$(cat /tmp/n30pro_target_symbol)"
          EXPECTED_LINE="CONFIG_${TARGET_SYMBOL#CONFIG_}=y"

          echo "========================================"
          echo "Final configuration verification"
          echo "========================================"

          echo
          echo "===== Target ====="

          grep "^CONFIG_TARGET_" .config \
            | grep -E \
              "DEVICE_|TARGET_(BOARD|SUBTARGET|PROFILE|MULTI_PROFILE)" \
            || true

          echo
          echo "Expected:"
          echo "$EXPECTED_LINE"

          if ! grep -qx "$EXPECTED_LINE" .config; then
            echo
            echo "[ERROR] Target configuration was not retained:"
            echo "        $EXPECTED_LINE"
            echo
            echo "===== Actual target device ====="
            grep "^CONFIG_TARGET_DEVICE_" .config || true
            echo
            echo "===== Target profile ====="
            grep "^CONFIG_TARGET_PROFILE=" .config || true
            exit 1
          fi

          if grep -q \
            "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_openwrt_one=y$" \
            .config
          then
            echo
            echo "[ERROR] OpenWrt One is selected."
            exit 1
          fi

          echo
          echo "[OK] Netcore N30 Pro target retained."

          echo
          echo "===== Required packages ====="

          for pkg in \
            luci-app-passwall \
            luci-app-mwan3 \
            mwan3 \
            luci-app-samba4 \
            samba4-server \
            kmod-usb-net \
            kmod-usb-wdm \
            kmod-usb-net-cdc-ether \
            kmod-usb-net-cdc-ncm \
            kmod-usb-net-rndis \
            kmod-usb-net-qmi-wwan \
            kmod-usb-net-cdc-mbim \
            kmod-usb-serial \
            kmod-usb-serial-option \
            kmod-usb-serial-wwan \
            kmod-usb-acm \
            kmod-usb-xhci-hcd \
            kmod-usb-xhci-mtk \
            kmod-nft-socket \
            kmod-nft-tproxy \
            kmod-nft-nat \
            kmod-inet-diag \
            kmod-netlink-diag \
            kmod-tun \
            uqmi \
            umbim \
            usbutils \
            usb-modeswitch
          do
            if ! grep -qx \
              "CONFIG_PACKAGE_${pkg}=y" \
              .config
            then
              echo "[ERROR] Missing package configuration: ${pkg}"
              exit 1
            fi

            echo "[OK] ${pkg}"
          done

          if ! grep -qx \
            "CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y" \
            .config
          then
            echo "[ERROR] PassWall Nftables Transparent Proxy is not enabled."
            exit 1
          fi

          echo
          echo "[OK] PassWall Nftables Transparent Proxy"

          echo
          echo "========================================"
          echo "FINAL CONFIGURATION PASSED"
          echo "========================================"

      - name: "Check Samba4 security"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          if grep -Rqs \
            '"/usr/sbin/smbd"[[:space:]]*:[[:space:]]*\[[[:space:]]*"exec"' \
            package/feeds/luci/luci-app-samba4 \
            2>/dev/null
          then
            echo "ERROR: Vulnerable Samba4 ACL detected."
            exit 1
          fi

          echo "Samba4 ACL security check passed."

      - name: "Download sources"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          make download -j"$(nproc)" V=s

      - name: "Build firmware"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          make -j"$(nproc)" V=s

      - name: "Verify firmware output"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          test -d bin/targets/mediatek/filogic

          echo "========================================"
          echo "Firmware outputs"
          echo "========================================"

          find \
            bin/targets/mediatek/filogic \
            -maxdepth 2 \
            -type f \
            -printf "%p\n" \
            | sort

          FIRMWARE="$(
            find \
              bin/targets/mediatek/filogic \
              -type f \
              \( \
                -name "*sysupgrade*.bin" \
                -o -name "*sysupgrade*.itb" \
                -o -name "*factory*.bin" \
                -o -name "*.itb" \
              \) \
              -print \
              -quit
          )"

          if [ -z "$FIRMWARE" ]; then
            echo "ERROR: No N30 Pro firmware image found."
            exit 1
          fi

          echo "Firmware image:"
          echo "$FIRMWARE"

      - name: "Generate SHA256 and build report"
        working-directory: immortalwrt-n30pro
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../artifacts

          cp -a \
            bin/targets/mediatek/filogic/. \
            ../artifacts/

          find \
            bin/targets/mediatek/filogic \
            -type f \
            -exec sha256sum {} + \
            | sort \
            > ../artifacts/SHA256SUMS.txt

          {
            echo "ImmortalWrt: 25.12.2"
            echo "ImmortalWrt commit: $(git rev-parse HEAD)"
            echo "N30 Pro patch commit: $(git -C ../${PATCH_DIR} rev-parse HEAD)"
            echo "Build date UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Target: Netcore N30 Pro"
            echo "Platform: mediatek/filogic"
            echo "USB VBUS: GPIO23 -> usb-vbus -> xHCI"
            echo "Features: PassWall, MWAN3, Samba4, USB 4G/5G"
            echo
            echo "===== Firmware files ====="

            find \
              bin/targets/mediatek/filogic \
              -maxdepth 2 \
              -type f \
              -printf "%f\n" \
              | sort
          } > ../artifacts/BUILD-REPORT.txt

          echo "===== BUILD REPORT ====="
          cat ../artifacts/BUILD-REPORT.txt

          echo
          echo "===== SHA256 ====="
          cat ../artifacts/SHA256SUMS.txt

      - name: "Upload firmware artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "ImmortalWrt-25.12.2-Netcore-N30-Pro"
          path: "artifacts/*"
          if-no-files-found: error
          retention-days: 14
