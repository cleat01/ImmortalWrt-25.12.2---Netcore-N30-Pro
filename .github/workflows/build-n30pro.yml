            echo "  - MWAN3"
            echo "  - Samba4"
            echo "  - USB 4G/5G networking"
            echo
            echo "===== Firmware files ====="

            find \
              bin/targets/mediatek/filogic \
              -maxdepth 2 \
              -type f \
              -printf '%f\n' \
              | sort

            echo
            echo "===== Git status ====="

            git status --short

            echo
            echo "===== Git diff stat ====="

            git diff --stat

          } > "../${ARTIFACT_DIR}/BUILD-REPORT.txt"

          echo
          echo "========================================"
