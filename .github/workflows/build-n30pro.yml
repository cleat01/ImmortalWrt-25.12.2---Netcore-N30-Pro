name: Build ImmortalWrt 25.12.2 Netcore N30 Pro


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:

    - name: Checkout source
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-distutils \
          rsync \
          unzip \
          zstd \
          file \
          wget


    - name: Clone ImmortalWrt 25.12.2
      run: |

        git clone \
          --depth=1 \
          --branch v25.12.2 \
          https://github.com/immortalwrt/immortalwrt.git \
          immortalwrt



    - name: Prepare feeds
      working-directory: immortalwrt
      run: |

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Generate base config
      working-directory: immortalwrt
      run: |

        make defconfig



    - name: Add N30 Pro packages
      working-directory: immortalwrt
      run: |

        printf '%s\n' \
        'CONFIG_TARGET_mediatek=y' \
        'CONFIG_TARGET_mediatek_filogic=y' \
        'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netis_nx30v2=y' \
        '' \
        'CONFIG_PACKAGE_luci=y' \
        'CONFIG_PACKAGE_luci-ssl=y' \
        '' \
        'CONFIG_PACKAGE_kmod-usb3=y' \
        'CONFIG_PACKAGE_kmod-usb-storage=y' \
        'CONFIG_PACKAGE_kmod-usb-storage-uas=y' \
        '' \
        'CONFIG_PACKAGE_kmod-usb-net=y' \
        'CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y' \
        'CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y' \
        'CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y' \
        '' \
        'CONFIG_PACKAGE_kmod-usb-serial=y' \
        'CONFIG_PACKAGE_kmod-usb-serial-option=y' \
        'CONFIG_PACKAGE_kmod-usb-wdm=y' \
        '' \
        'CONFIG_PACKAGE_usb-modeswitch=y' \
        'CONFIG_PACKAGE_usb-modeswitch-data=y' \
        'CONFIG_PACKAGE_uqmi=y' \
        'CONFIG_PACKAGE_umbim=y' \
        '' \
        'CONFIG_PACKAGE_mwan3=y' \
        'CONFIG_PACKAGE_luci-app-mwan3=y' \
        '' \
        'CONFIG_PACKAGE_samba4-server=y' \
        '' \
        'CONFIG_PACKAGE_kmod-tun=y' \
        '' \
        'CONFIG_PACKAGE_curl=y' \
        'CONFIG_PACKAGE_wget-ssl=y' \
        'CONFIG_PACKAGE_ca-bundle=y' \
        'CONFIG_PACKAGE_ca-certificates=y' \
        >> .config



    - name: Normalize config
      working-directory: immortalwrt
      run: |

        make defconfig



    - name: Verify target configuration
      working-directory: immortalwrt
      run: |

        echo "===== TARGET ====="

        grep "netis" .config || true


        echo "===== USB ====="

        grep "usb" .config || true


        echo "===== TUN ====="

        grep "kmod-tun" .config || true



    - name: Download packages
      working-directory: immortalwrt
      run: |

        make download -j2



    - name: Compile firmware
      working-directory: immortalwrt
      run: |

        export TERM=xterm


        make -j1 V=s 2>&1 | tee build.log


        BUILD_RESULT=${PIPESTATUS[0]}


        if [ "$BUILD_RESULT" != "0" ]; then

          echo "========== BUILD FAILED =========="

          tail -300 build.log

          exit "$BUILD_RESULT"

        fi



    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4

      with:

        name: immortalwrt-build-log

        path: immortalwrt/build.log



    - name: Check firmware output
      working-directory: immortalwrt
      run: |

        echo "Searching firmware..."

        find \
        bin/targets/mediatek/filogic \
        -type f \
        \( -name "*sysupgrade*" -o -name "*factory*" \)



    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4

      with:

        name: ImmortalWrt-25.12.2-Netcore-N30-Pro

        path: immortalwrt/bin/targets/mediatek/filogic/
