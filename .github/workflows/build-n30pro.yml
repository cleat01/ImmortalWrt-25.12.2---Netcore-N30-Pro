name: Build ImmortalWrt 25.12.2 - Netcore N30 Pro Full

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTALWRT_REF: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git
  PATCH_REF: main

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:

      # ============================================================
      # 1. Checkout current repository
      # ============================================================
      - name: Checkout build repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            device-tree-compiler \
            qemu-utils \
            ccache \
            time

      # ============================================================
      # 3. Clone ImmortalWrt 25.12.2
      # ============================================================
      - name: Clone ImmortalWrt 25.12.2
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${IMMORTALWRT_REF}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo "===== ImmortalWrt revision ====="
          git rev-parse HEAD
          git describe --tags --always || true

      # ============================================================
      # 4. Clone Netcore N30 Pro patch repository
      #
      # IMPORTANT:
      # The patch repository MUST be beside immortalwrt:
      #
      # $GITHUB_WORKSPACE/
      # ├── immortalwrt/
      # └── Netcore-N30-Pro-patch-for-OpenWrt/
      # ============================================================
      - name: Clone Netcore N30 Pro patch
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${PATCH_REF}" \
            "${PATCH_REPO}" \
            Netcore-N30-Pro-patch-for-OpenWrt

          echo "===== Patch files ====="
          find Netcore-N30-Pro-patch-for-OpenWrt \
            -maxdepth 3 \
            -type f \
            -print

      # ============================================================
      # 5. Apply Netcore N30 Pro adaptation
      # ============================================================
      - name: Apply Netcore N30 Pro adaptation
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          test -f ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh

          find ../Netcore-N30-Pro-patch-for-OpenWrt/patches \
            -maxdepth 1 \
            -type f \
            -name '*.patch' \
            -print

          bash ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh \
            ../Netcore-N30-Pro-patch-for-OpenWrt

      # ============================================================
      # 6. Verify N30 Pro DTS and USB VBUS patch
      # ============================================================
      - name: Verify N30 Pro DTS
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          DTS_FILE="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

          test -f "$DTS_FILE"

          echo "===== DTS ====="
          sed -n '1,260p' "$DTS_FILE"

          echo "===== Verify USB VBUS definitions ====="

          grep -q 'regulator-usb-vbus' "$DTS_FILE"
          grep -q 'regulator-name = "usb-vbus"' "$DTS_FILE"
          grep -q 'regulator-min-microvolt = <5000000>' "$DTS_FILE"
          grep -q 'regulator-max-microvolt = <5000000>' "$DTS_FILE"
          grep -q 'gpio = <&pio 23 GPIO_ACTIVE_HIGH>' "$DTS_FILE"
          grep -q 'enable-active-high' "$DTS_FILE"
          grep -q 'regulator-boot-on' "$DTS_FILE"
          grep -q 'vbus-supply = <&usb_vbus>' "$DTS_FILE"

          echo "[PASS] N30 Pro USB VBUS DTS configuration found."

      # ============================================================
      # 7. Update/install ImmortalWrt feeds
      #
      # Do NOT add random OpenWrt/JLU/third-party binary feeds.
      # We use the packages bundled with the 25.12.2 source tree.
      # ============================================================
      - name: Update and install ImmortalWrt feeds
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 8. Check ordinary packages only
      #
      # IMPORTANT:
      # Do NOT put kmod-* packages here.
      # KernelPackage is checked later through .config/build output.
      # ============================================================
      - name: Verify required userspace packages
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          cat > /tmp/package-exists.sh <<'EOF'
          #!/bin/sh
          set -eu

          PKG="$1"

          if [ -z "$PKG" ]; then
              echo "[ERROR] package name is empty"
              exit 2
          fi

          FOUND=0

          # Normal feed search
          if ./scripts/feeds search "$PKG" 2>/dev/null | \
              grep -Eq "(^|[[:space:]])${PKG}([[:space:]]|$)"; then
              FOUND=1
          fi

          # Package directories
          if find package feeds -type f -name Makefile 2>/dev/null | \
              xargs grep -l -E \
              "^[[:space:]]*PKG_NAME[[:space:]]*:?=[[:space:]]*${PKG}[[:space:]]*$|^[[:space:]]*Package/${PKG}[[:space:]]*$" \
              2>/dev/null | grep -q .; then
              FOUND=1
          fi

          if [ "$FOUND" = "1" ]; then
              echo "[FOUND] $PKG"
              exit 0
          fi

          echo "[MISSING] $PKG"
          exit 1
          EOF

          chmod +x /tmp/package-exists.sh

          REQUIRED_PACKAGES="
          luci-app-passwall
          mwan3
          luci-app-mwan3
          samba4-server
          luci-app-samba4
          "

          for pkg in $REQUIRED_PACKAGES; do
              echo
              echo "Checking userspace package: $pkg"
              /tmp/package-exists.sh "$pkg"
          done

      # ============================================================
      # 9. Samba security check
      #
      # Do not allow the dangerous read ACL granting exec access to smbd.
      # ============================================================
      - name: Verify Samba4 security ACL
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          SAMBA_ACL="feeds/luci/luci-app-samba4/root/usr/share/rpcd/acl.d/luci-app-samba4.json"

          echo "===== Locate Samba4 ACL ====="

          find feeds package -type f \
            \( -name '*samba4*.json' -o -name 'luci-app-samba4.json' \) \
            -print || true

          if [ ! -f "$SAMBA_ACL" ]; then
              echo "[INFO] Expected ACL path not found:"
              echo "       $SAMBA_ACL"
              echo "[INFO] Searching all Samba4 ACL files..."

              ACL_FILE="$(find feeds package -type f \
                \( -name 'luci-app-samba4.json' -o -name '*samba4*.json' \) \
                -print -quit || true)"

              if [ -n "$ACL_FILE" ]; then
                  SAMBA_ACL="$ACL_FILE"
              fi
          fi

          if [ -n "${SAMBA_ACL:-}" ] && [ -f "$SAMBA_ACL" ]; then
              echo "===== Checking: $SAMBA_ACL ====="
              cat "$SAMBA_ACL"

              if grep -Eq \
                '"/usr/sbin/smbd"[[:space:]]*:[[:space:]]*\[[[:space:]]*"exec"' \
                "$SAMBA_ACL"; then

                  echo
                  echo "===================================================="
                  echo "ERROR: Dangerous Samba4 ACL detected."
                  echo "The read ACL grants exec permission to /usr/sbin/smbd."
                  echo "Refusing to build."
                  echo "===================================================="

                  exit 1
              fi

              echo "[PASS] Dangerous smbd exec ACL not detected."
          else
              echo "[WARNING] Samba4 ACL file could not be located."
              echo "[WARNING] Continue, but final package inspection remains enabled."
          fi

      # ============================================================
      # 10. Generate base configuration
      # ============================================================
      - name: Configure N30 Pro
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          make defconfig

          # --------------------------------------------------------
          # Target
          # --------------------------------------------------------
          cat >> .config <<'EOF'

          # ========================================================
          # Netcore N30 Pro
          # ========================================================
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n30-pro=y

          # ========================================================
          # LuCI / firewall
          # ========================================================
          CONFIG_LUCI=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y

          # ========================================================
          # N30 Pro USB 3 / XHCI
          #
          # These are KernelPackage symbols.
          # They are deliberately NOT checked through scripts/feeds.
          # ========================================================
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y

          # ========================================================
          # USB network / modem support
          # ========================================================
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-wdm=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y

          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
          CONFIG_PACKAGE_kmod-usb-serial-sierrawireless=y
          CONFIG_PACKAGE_kmod-usb-acm=y

          # Common USB Ethernet adapters
          CONFIG_PACKAGE_kmod-usb-net-rtl8150=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-aqc111=y

          # USB storage
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y

          # ========================================================
          # USB userspace
          # ========================================================
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y

          # ========================================================
          # PassWall
          # ========================================================
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y

          # PassWall common dependencies
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-base64=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_coreutils-timeout=y
          CONFIG_PACKAGE_coreutils-time=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_libuci-lua=y
          CONFIG_PACKAGE_lua=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lib-jsonc=y
          CONFIG_PACKAGE_microsocks=y
          CONFIG_PACKAGE_resolveip=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_lyaml=y
          CONFIG_PACKAGE_ipt2socks=y

          # PassWall common cores
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_haproxy=y
          CONFIG_PACKAGE_shadowsocks-rust-sslocal=y
          CONFIG_PACKAGE_shadowsocksr-libev-ssr-local=y
          CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir=y
          CONFIG_PACKAGE_simple-obfs-client=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_v2ray-plugin=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_unzip=y

          # ========================================================
          # PassWall nftables transparent proxy dependencies
          #
          # KernelPackage: verify after defconfig, not via feeds.
          # ========================================================
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y

          # ========================================================
          # MWAN3
          # ========================================================
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y

          # ========================================================
          # Samba4
          # ========================================================
          CONFIG_PACKAGE_samba4-server=y
          CONFIG_PACKAGE_luci-app-samba4=y

          # ========================================================
          # Storage helpers
          # ========================================================
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_block-mount=y
          EOF

          # ========================================================
          # Optional packages:
          # Only enable them when the package actually exists.
          # This avoids breaking the build when an optional package
          # was renamed or removed in 25.12.2.
          # ========================================================

          optional_packages="
          luci-proto-qmi
          luci-proto-mbim
          luci-proto-ncm
          kmod-usb-storage-extras
          kmod-fs-ntfs3
          kmod-usb-net-huawei-cdc-ncm
          "

          for pkg in $optional_packages; do
              if ./scripts/feeds search "$pkg" 2>/dev/null | grep -Eq "(^|[[:space:]])${pkg}([[:space:]]|$)"; then
                  echo "CONFIG_PACKAGE_${pkg}=y" >> .config
                  echo "[OPTIONAL ENABLED] $pkg"
              else
                  echo "[OPTIONAL SKIPPED] $pkg"
              fi
          done

          # Re-run dependency resolution.
          make defconfig

      # ============================================================
      # 11. Strict final configuration verification
      #
      # This is the critical fix for the previous failure.
      # ============================================================
      - name: Verify final configuration
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "Final configuration verification"
          echo "========================================"

          echo
          echo "===== Target ====="
          grep '^CONFIG_TARGET_' .config || true

          TARGET="CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore-n30-pro"

          if grep -q "^${TARGET}=y$" .config; then
              echo "[PASS] ${TARGET}=y"
          else
              echo "[ERROR] Target configuration was not retained:"
              echo "        ${TARGET}=y"
              exit 1
          fi

          echo
          echo "===== Required userspace packages ====="

          REQUIRED_USERSPACE="
          CONFIG_PACKAGE_luci-app-passwall
          CONFIG_PACKAGE_mwan3
          CONFIG_PACKAGE_luci-app-mwan3
          CONFIG_PACKAGE_samba4-server
          CONFIG_PACKAGE_luci-app-samba4
          "

          for cfg in $REQUIRED_USERSPACE; do
              if grep -q "^${cfg}=y$" .config; then
                  echo "[PASS] ${cfg}=y"
              else
                  echo "[ERROR] Missing ${cfg}=y"
                  exit 1
              fi
          done

          echo
          echo "===== Required KernelPackages ====="

          REQUIRED_KERNEL="
          CONFIG_PACKAGE_kmod-usb-core
          CONFIG_PACKAGE_kmod-usb3
          CONFIG_PACKAGE_kmod-usb-xhci-hcd
          CONFIG_PACKAGE_kmod-usb-xhci-mtk
          CONFIG_PACKAGE_kmod-nft-socket
          CONFIG_PACKAGE_kmod-nft-tproxy
          CONFIG_PACKAGE_kmod-nft-nat
          CONFIG_PACKAGE_kmod-nf-reject
          CONFIG_PACKAGE_kmod-nf-reject6
          "

          for cfg in $REQUIRED_KERNEL; do
              if grep -q "^${cfg}=y$" .config; then
                  echo "[PASS] ${cfg}=y"
              else
                  echo "[ERROR] Missing ${cfg}=y"
                  echo
                  echo "===== Matching config entries ====="
                  grep -E "${cfg}|CONFIG_PACKAGE_kmod-usb|CONFIG_PACKAGE_kmod-nft" .config || true
                  exit 1
              fi
          done

          echo
          echo "===== USB modem configuration ====="

          USB_MODEM_CONFIG="
          CONFIG_PACKAGE_kmod-usb-net
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm
          CONFIG_PACKAGE_kmod-usb-net-rndis
          CONFIG_PACKAGE_kmod-usb-wdm
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim
          CONFIG_PACKAGE_kmod-usb-serial
          CONFIG_PACKAGE_kmod-usb-serial-option
          CONFIG_PACKAGE_kmod-usb-serial-wwan
          "

          for cfg in $USB_MODEM_CONFIG; do
              if grep -q "^${cfg}=y$" .config; then
                  echo "[PASS] ${cfg}=y"
              else
                  echo "[WARNING] ${cfg} not enabled"
              fi
          done

          echo
          echo "===== PassWall configuration ====="

          grep '^CONFIG_PACKAGE_luci-app-passwall' .config || true

          grep -q \
            '^CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y$' \
            .config || {
              echo "[ERROR] PassWall nftables transparent proxy option was stripped."
              exit 1
            }

          echo "[PASS] PassWall nftables transparent proxy enabled."

          echo
          echo "===== Final critical symbols ====="

          grep -E \
            '^CONFIG_(TARGET_|PACKAGE_luci-app-passwall|PACKAGE_mwan3|PACKAGE_luci-app-mwan3|PACKAGE_samba4|PACKAGE_kmod-usb|PACKAGE_kmod-nft)' \
            .config | sort

      # ============================================================
      # 12. Download source archives
      # ============================================================
      - name: Download package sources
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          make download -j"$(nproc)" V=s

      # ============================================================
      # 13. Build firmware
      # ============================================================
      - name: Build firmware
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          echo "========================================"
          echo "Starting ImmortalWrt build"
          echo "========================================"

          START_TIME="$(date +%s)"

          make -j"$(nproc)" V=s

          END_TIME="$(date +%s)"
          BUILD_TIME="$((END_TIME - START_TIME))"

          echo
          echo "Build completed."
          echo "Build time: ${BUILD_TIME} seconds"

      # ============================================================
      # 14. Verify generated kernel modules / APKs
      # ============================================================
      - name: Verify generated packages and kernel modules
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "Generated package verification"
          echo "========================================"

          echo
          echo "===== N30 Pro firmware ====="

          find bin/targets \
            -type f \
            -printf '%p\n' | sort

          echo
          echo "===== Kernel packages ====="

          find bin/packages \
            -type f \
            \( \
              -name 'kmod-usb3*.apk' \
              -o -name 'kmod-usb-xhci-hcd*.apk' \
              -o -name 'kmod-usb-xhci-mtk*.apk' \
              -o -name 'kmod-nft-socket*.apk' \
              -o -name 'kmod-nft-tproxy*.apk' \
              -o -name 'kmod-nft-nat*.apk' \
              -o -name 'kmod-nf-reject*.apk' \
              -o -name 'kmod-nf-reject6*.apk' \
            \) \
            -print | sort

          echo
          echo "===== Required Kernel APK presence ====="

          REQUIRED_KERNEL_APKS="
          kmod-usb3
          kmod-usb-xhci-hcd
          kmod-usb-xhci-mtk
          kmod-nft-socket
          kmod-nft-tproxy
          kmod-nft-nat
          kmod-nf-reject
          kmod-nf-reject6
          "

          for pkg in $REQUIRED_KERNEL_APKS; do
              if find bin/packages \
                  -type f \
                  -name "${pkg}-*.apk" \
                  -print -quit | grep -q .; then
                  echo "[PASS] Generated ${pkg}"
              else
                  echo "[ERROR] Generated APK missing: ${pkg}"
                  exit 1
              fi
          done

      # ============================================================
      # 15. Verify required userspace APKs
      # ============================================================
      - name: Verify required userspace APKs
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "Userspace APK verification"
          echo "========================================"

          REQUIRED_APKS="
          luci-app-passwall
          mwan3
          luci-app-mwan3
          samba4-server
          luci-app-samba4
          "

          for pkg in $REQUIRED_APKS; do
              if find bin/packages \
                  -type f \
                  -name "${pkg}-*.apk" \
                  -print -quit | grep -q .; then
                  echo "[PASS] Generated ${pkg}"
              else
                  echo "[ERROR] Generated APK missing: ${pkg}"
                  exit 1
              fi
          done

      # ============================================================
      # 16. Verify PassWall dependency APKs
      # ============================================================
      - name: Verify PassWall dependency packages
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "PassWall dependency verification"
          echo "========================================"

          PASSWALL_PACKAGES="
          ipt2socks
          chinadns-ng
          dns2socks
          dnsmasq-full
          ip-full
          microsocks
          resolveip
          tcping
          geoview
          haproxy
          shadowsocks-rust-sslocal
          shadowsocksr-libev-ssr-local
          shadowsocksr-libev-ssr-redir
          simple-obfs-client
          sing-box
          v2ray-plugin
          xray-core
          "

          for pkg in $PASSWALL_PACKAGES; do
              if find bin/packages \
                  -type f \
                  -name "${pkg}-*.apk" \
                  -print -quit | grep -q .; then
                  echo "[PASS] ${pkg}"
              else
                  echo "[WARNING] PassWall optional/core package not found: ${pkg}"
              fi
          done

      # ============================================================
      # 17. Verify final firmware image size
      # ============================================================
      - name: Verify firmware images
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          echo "========================================"
          echo "Firmware image verification"
          echo "========================================"

          find bin/targets/mediatek/filogic \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.itb' \
              -o -name '*.img' \
              -o -name '*.tar' \
              -o -name '*.apk' \
            \) \
            -printf '%s %p\n' | sort -n

          echo
          echo "===== Firmware files ====="

          find bin/targets/mediatek/filogic \
            -maxdepth 2 \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.itb' \
              -o -name '*.img' \
              -o -name '*.tar' \
            \) \
            -print | sort

      # ============================================================
      # 18. Generate build report
      # ============================================================
      - name: Generate build report
        shell: bash
        run: |
          set -euo pipefail

          cd immortalwrt

          REPORT="$GITHUB_WORKSPACE/build-report.txt"

          {
            echo "=============================================="
            echo "ImmortalWrt 25.12.2 - Netcore N30 Pro"
            echo "Build Report"
            echo "=============================================="
            echo

            echo "===== Source ====="
            git rev-parse HEAD
            git describe --tags --always || true
            echo

            echo "===== Target ====="
            grep '^CONFIG_TARGET_' .config || true
            echo

            echo "===== PassWall ====="
            grep '^CONFIG_PACKAGE_luci-app-passwall' .config || true
            echo

            echo "===== MWAN3 ====="
            grep '^CONFIG_PACKAGE_.*mwan3' .config || true
            echo

            echo "===== Samba4 ====="
            grep '^CONFIG_PACKAGE_.*samba4' .config || true
            echo

            echo "===== USB ====="
            grep '^CONFIG_PACKAGE_kmod-usb' .config || true
            echo

            echo "===== NFT ====="
            grep '^CONFIG_PACKAGE_kmod-nft' .config || true
            grep '^CONFIG_PACKAGE_kmod-nf-reject' .config || true
            echo

            echo "===== Firmware ====="
            find bin/targets/mediatek/filogic \
              -type f \
              \( \
                -name '*.bin' \
                -o -name '*.itb' \
                -o -name '*.img' \
                -o -name '*.tar' \
              \) \
              -printf '%p\n' | sort

            echo
            echo "===== Required Kernel APKs ====="

            find bin/packages \
              -type f \
              \( \
                -name 'kmod-usb3*.apk' \
                -o -name 'kmod-usb-xhci-hcd*.apk' \
                -o -name 'kmod-usb-xhci-mtk*.apk' \
                -o -name 'kmod-nft-socket*.apk' \
                -o -name 'kmod-nft-tproxy*.apk' \
                -o -name 'kmod-nft-nat*.apk' \
                -o -name 'kmod-nf-reject*.apk' \
                -o -name 'kmod-nf-reject6*.apk' \
              \) \
              -printf '%p\n' | sort

            echo
            echo "Build report generated successfully."

          } > "$REPORT"

          cat "$REPORT"

      # ============================================================
      # 19. Collect firmware + packages
      # ============================================================
      - name: Collect build artifacts
        shell: bash
        run: |
          set -euxo pipefail

          cd immortalwrt

          mkdir -p "$GITHUB_WORKSPACE/artifacts/firmware"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/packages"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"

          # Firmware
          find bin/targets/mediatek/filogic \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.itb' \
              -o -name '*.img' \
              -o -name '*.tar' \
            \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/firmware/" \;

          # All generated APKs
          find bin/packages \
            -type f \
            -name '*.apk' \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/packages/" \;

          # Build configuration
          cp .config "$GITHUB_WORKSPACE/artifacts/.config"

          # DTS
          cp target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts \
            "$GITHUB_WORKSPACE/artifacts/"

          # Manifest / checksum
          find "$GITHUB_WORKSPACE/artifacts" \
            -type f \
            -exec sha256sum {} \; \
            > "$GITHUB_WORKSPACE/artifacts/SHA256SUMS"

      # ============================================================
      # 20. Upload firmware
      # ============================================================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-firmware
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 21. Upload generated APKs
      # ============================================================
      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 22. Upload build configuration / report
      # ============================================================
      - name: Upload build report
        uses: actions/upload-artifact@v6
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro-build-report
          path: |
            build-report.txt
            artifacts/.config
            artifacts/mt7981b-netcore-n30-pro.dts
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
