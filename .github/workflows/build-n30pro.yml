name: "Build ImmortalWrt 25.12.2 - Netcore N30 Pro"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "n30pro-build-${{ github.ref }}"
  cancel-in-progress: true

env:
  IMMORTALWRT_TAG: "v25.12.2"
  PATCH_REPO: "https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git"
  PATCH_BRANCH: "main"

jobs:
  build:
    name: "Build N30 Pro firmware"
    runs-on: ubuntu-24.04

    steps:
      - name: "Install build dependencies"
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            device-tree-compiler \
            quilt

      - name: "Checkout ImmortalWrt 25.12.2"
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${IMMORTALWRT_TAG}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo "ImmortalWrt commit:"
          git rev-parse HEAD

          echo "ImmortalWrt tag:"
          git describe --tags --always

      - name: "Checkout N30 Pro adaptation"
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${PATCH_BRANCH}" \
            "${PATCH_REPO}" \
            Netcore-N30-Pro-patch-for-OpenWrt

          echo "Patch repository commit:"
          git -C Netcore-N30-Pro-patch-for-OpenWrt rev-parse HEAD

          echo "Patch repository files:"
          find Netcore-N30-Pro-patch-for-OpenWrt \
            -maxdepth 3 \
            -type f \
            -print

      - name: "Apply N30 Pro adaptation"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          bash \
            ../Netcore-N30-Pro-patch-for-OpenWrt/scripts/apply-netcore-n30pro.sh \
            ../Netcore-N30-Pro-patch-for-OpenWrt

          echo
          echo "===== Verify N30 Pro adaptation ====="

          test -f \
            target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts

          grep -R \
            -n \
            "netcore,n30-pro" \
            target/linux/mediatek/filogic/base-files/etc/board.d/02_network

          grep -R \
            -n \
            "netcore,n30-pro" \
            target/linux/mediatek/filogic/base-files/etc/hotplug.d/ieee80211/11_fix_wifi_mac

          grep -n \
            "Device/netcore_n30-pro" \
            target/linux/mediatek/image/filogic.mk

          echo
          echo "N30 Pro adaptation verification passed."

      - name: "Verify N30 Pro USB VBUS DTS"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"

          test -f "${DTS}"

          echo "===== USB VBUS DTS ====="

          grep -n -A20 -B5 \
            "usb_vbus" \
            "${DTS}"

          echo
          echo "===== Verify GPIO23 VBUS configuration ====="

          grep -q \
            'gpio = <&pio 23 GPIO_ACTIVE_HIGH>;' \
            "${DTS}"

          grep -q \
            'regulator-name = "usb-vbus";' \
            "${DTS}"

          grep -q \
            'regulator-boot-on;' \
            "${DTS}"

          echo
          echo "===== Verify USB PHY ====="

          grep -n -A8 -B3 \
            '&usb_phy' \
            "${DTS}"

          echo
          echo "===== Verify XHCI VBUS consumer ====="

          grep -n -A12 -B3 \
            '&xhci' \
            "${DTS}"

          grep -q \
            'vbus-supply = <&usb_vbus>;' \
            "${DTS}"

          echo
          echo "USB VBUS DTS verification passed."

      - name: "Update feeds"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a

          ./scripts/feeds install -a

      - name: "Prepare package metadata"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          make defconfig

          make prepare-tmpinfo

          test -f tmp/.config-package.in
          test -f tmp/.config-target.in

          echo
          echo "===== Target metadata ====="

          grep -n \
            -i \
            "netcore" \
            tmp/.config-target.in \
            | head -50 \
            || true

          echo
          echo "===== Package metadata sanity check ====="

          for pkg in \
            luci \
            luci-ssl \
            luci-app-passwall \
            luci-app-mwan3 \
            luci-app-samba4 \
            kmod-usb-xhci-hcd \
            kmod-usb-xhci-mtk \
            kmod-usb-net \
            kmod-usb-net-cdc-ether \
            kmod-usb-net-cdc-ncm \
            kmod-usb-net-rndis \
            kmod-usb-wdm \
            kmod-usb-net-qmi-wwan \
            kmod-usb-net-cdc-mbim \
            kmod-usb-serial \
            kmod-usb-serial-option \
            kmod-usb-serial-wwan \
            kmod-usb-acm \
            usbutils \
            usb-modeswitch \
            uqmi \
            umbim \
            kmod-tun \
            kmod-nft-socket \
            kmod-nft-tproxy
          do
            if grep -qE \
              "^[[:space:]]*config[[:space:]]+PACKAGE_${pkg}([[:space:]]|$)" \
              tmp/.config-package.in
            then
              echo "[OK] PACKAGE_${pkg}"
            else
              echo "[MISSING] PACKAGE_${pkg}"
            fi
          done

      - name: "Select exact N30 Pro target"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "===== Detect N30 Pro target symbol ====="

          TARGET_SYMBOL="$(
            sed -n -E \
              's/^[[:space:]]*config[[:space:]]+(TARGET_[A-Za-z0-9_-]*netcore[_-]n30[_-]pro[A-Za-z0-9_-]*).*/\1/p' \
              tmp/.config-target.in \
              | head -n 1
          )"

          if [ -z "${TARGET_SYMBOL}" ]; then
            echo "ERROR: Could not find Netcore N30 Pro target symbol."

            echo
            echo "Available Mediatek/Filogic device symbols:"
            grep -nE \
              'config TARGET_.*DEVICE_.*netcore|config TARGET_.*DEVICE_' \
              tmp/.config-target.in \
              | head -200 \
              || true

            exit 1
          fi

          echo "Detected target symbol:"
          echo "${TARGET_SYMBOL}"

          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          # CONFIG_TARGET_ROOTFS_INITRAMFS is not set

          CONFIG_TARGET_UBIFS_FREE_SPACE_FIXUP=y

          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y

          CONFIG_${TARGET_SYMBOL}=y
          EOF

          echo
          echo "===== Initial target configuration ====="
          cat .config

          make defconfig

          echo
          echo "===== Resulting target configuration ====="

          grep -E \
            '^CONFIG_TARGET_(mediatek|DEVICE|PROFILE|ROOTFS)' \
            .config \
            | sort \
            || true

          echo
          echo "===== Verify selected N30 Pro device ====="

          if ! grep -q \
            "^CONFIG_${TARGET_SYMBOL}=y$" \
            .config
          then
            echo "ERROR: N30 Pro target was not retained after make defconfig."

            echo
            echo "Relevant target symbols:"
            grep -E \
              '^CONFIG_TARGET_.*netcore|^CONFIG_TARGET_PROFILE=' \
              .config \
              || true

            exit 1
          fi

          if grep -q \
            '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_openwrt_one=y$' \
            .config
          then
            echo "ERROR: OpenWrt One was selected instead of N30 Pro."
            exit 1
          fi

          echo
          echo "N30 Pro target selection passed."

      - name: "Configure packages"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "===== Package selection helpers ====="

          require_pkg() {
            local pkg="$1"

            if ! grep -qE \
              "^[[:space:]]*config[[:space:]]+PACKAGE_${pkg}([[:space:]]|$)" \
              tmp/.config-package.in
            then
              echo "ERROR: Required package unavailable: ${pkg}"

              echo
              echo "Matching metadata entries:"
              grep -nE \
                "PACKAGE_${pkg}([[:space:]]|$)" \
                tmp/.config-package.in \
                | head -20 \
                || true

              exit 1
            fi

            echo "PACKAGE available: ${pkg}"
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          }

          optional_pkg() {
            local pkg="$1"

            if grep -qE \
              "^[[:space:]]*config[[:space:]]+PACKAGE_${pkg}([[:space:]]|$)" \
              tmp/.config-package.in
            then
              echo "Optional PACKAGE available: ${pkg}"
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            else
              echo "Optional PACKAGE unavailable: ${pkg}"
            fi
          }

          echo
          echo "===== LuCI ====="

          require_pkg luci
          require_pkg luci-ssl

          echo
          echo "===== PassWall ====="

          require_pkg luci-app-passwall

          if grep -qE \
            "^[[:space:]]*config[[:space:]]+PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy([[:space:]]|$)" \
            tmp/.config-package.in
          then
            echo \
              "CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y" \
              >> .config

            echo "PassWall Nftables Transparent Proxy selector enabled."
          else
            echo "ERROR: PassWall Nftables Transparent Proxy selector unavailable."
            exit 1
          fi

          echo
          echo "===== MWAN3 ====="

          require_pkg luci-app-mwan3

          echo
          echo "===== Samba4 ====="

          require_pkg luci-app-samba4

          echo
          echo "===== USB / 4G / 5G ====="

          require_pkg kmod-usb-xhci-hcd
          require_pkg kmod-usb-xhci-mtk

          require_pkg kmod-usb-net
          require_pkg kmod-usb-net-cdc-ether
          require_pkg kmod-usb-net-cdc-ncm
          require_pkg kmod-usb-net-rndis
          require_pkg kmod-usb-wdm

          require_pkg kmod-usb-net-qmi-wwan
          require_pkg kmod-usb-net-cdc-mbim

          require_pkg kmod-usb-serial
          require_pkg kmod-usb-serial-option
          require_pkg kmod-usb-serial-wwan

          require_pkg kmod-usb-acm

          require_pkg usbutils
          require_pkg usb-modeswitch
          require_pkg uqmi
          require_pkg umbim

          echo
          echo "===== USB Ethernet adapters ====="

          optional_pkg kmod-usb-net-rtl8150
          optional_pkg kmod-usb-net-rtl8152
          optional_pkg kmod-usb-net-asix
          optional_pkg kmod-usb-net-asix-ax88179
          optional_pkg kmod-usb-net-aqc111

          echo
          echo "===== Additional USB serial drivers ====="

          optional_pkg kmod-usb-serial-qualcomm
          optional_pkg kmod-usb-serial-sierrawireless

          echo
          echo "===== LuCI modem protocols ====="

          optional_pkg luci-proto-qmi
          optional_pkg luci-proto-mbim
          optional_pkg luci-proto-ncm

          echo
          echo "===== PassWall kernel dependencies ====="

          require_pkg kmod-nft-socket
          require_pkg kmod-nft-tproxy
          require_pkg kmod-tun

          echo
          echo "===== Other useful packages ====="

          optional_pkg luci-i18n-passwall-zh-cn
          optional_pkg luci-i18n-mwan3-zh-cn
          optional_pkg luci-i18n-samba4-zh-cn

          echo
          echo "===== Final explicitly requested packages ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci|luci-ssl|luci-app-passwall|luci-app-mwan3|luci-app-samba4|kmod-usb|usbutils|usb-modeswitch|uqmi|umbim|kmod-nft|kmod-tun)' \
            .config \
            | sort \
            || true

      - name: "Check Samba4 security ACL"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "===== Samba4 ACL security check ====="

          FOUND=0

          while IFS= read -r -d '' file
          do
            echo "Checking: ${file}"

            if grep -n \
              '/usr/sbin/smbd' \
              "${file}" \
              | grep -E \
                '"exec"|"exec[[:space:]]*"' \
                > /tmp/samba4-dangerous-acl.txt
            then
              echo
              echo "ERROR: Potentially dangerous Samba4 smbd exec ACL found:"
              cat /tmp/samba4-dangerous-acl.txt
              FOUND=1
            fi
          done < <(
            find feeds \
              -type f \
              \( \
                -name 'acl.json' \
                -o \
                -name '*.json' \
              \) \
              -print0
          )

          if [ "${FOUND}" -ne 0 ]; then
            echo
            echo "Samba4 security check FAILED."
            exit 1
          fi

          echo
          echo "No dangerous /usr/sbin/smbd exec ACL detected."

      - name: "Reconfigure and verify target/packages"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          make defconfig

          echo
          echo "===== Final target ====="

          grep -E \
            '^CONFIG_TARGET_(mediatek|DEVICE|PROFILE)' \
            .config \
            | sort \
            || true

          if ! grep -q \
            '^CONFIG_TARGET_mediatek=y$' \
            .config
          then
            echo "ERROR: mediatek target missing."
            exit 1
          fi

          if ! grep -q \
            '^CONFIG_TARGET_mediatek_filogic=y$' \
            .config
          then
            echo "ERROR: mediatek/filogic target missing."
            exit 1
          fi

          if ! grep -q \
            '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore-n30-pro=y$' \
            .config
          then
            echo "ERROR: Exact N30 Pro target was not selected."

            echo
            echo "Current Netcore target configuration:"
            grep -E \
              '^CONFIG_TARGET_.*netcore' \
              .config \
              || true

            exit 1
          fi

          if grep -q \
            '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_openwrt_one=y$' \
            .config
          then
            echo "ERROR: OpenWrt One target is selected."
            exit 1
          fi

          echo
          echo "===== Final required packages ====="

          for pkg in \
            luci \
            luci-ssl \
            luci-app-passwall \
            luci-app-mwan3 \
            luci-app-samba4 \
            kmod-usb-xhci-hcd \
            kmod-usb-xhci-mtk \
            kmod-usb-net \
            kmod-usb-net-cdc-ether \
            kmod-usb-net-cdc-ncm \
            kmod-usb-net-rndis \
            kmod-usb-wdm \
            kmod-usb-net-qmi-wwan \
            kmod-usb-net-cdc-mbim \
            kmod-usb-serial \
            kmod-usb-serial-option \
            kmod-usb-serial-wwan \
            kmod-usb-acm \
            usbutils \
            usb-modeswitch \
            uqmi \
            umbim \
            kmod-nft-socket \
            kmod-nft-tproxy \
            kmod-tun
          do
            if grep -q \
              "^CONFIG_PACKAGE_${pkg}=y$" \
              .config
            then
              echo "[OK] CONFIG_PACKAGE_${pkg}=y"
            else
              echo "ERROR: Required package not enabled: ${pkg}"
              exit 1
            fi
          done

          echo
          echo "===== PassWall transparent proxy ====="

          if ! grep -q \
            '^CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y$' \
            .config
          then
            echo "ERROR: PassWall Nftables Transparent Proxy is not enabled."
            exit 1
          fi

          echo
          echo "Final configuration verification passed."

      - name: "Build firmware"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "===== Build information ====="

          echo "CPU:"
          nproc

          echo
          echo "ImmortalWrt:"
          git describe --tags --always

          echo
          echo "Target:"
          grep -E \
            '^CONFIG_TARGET_(mediatek|DEVICE|PROFILE)' \
            .config \
            | sort

          echo
          echo "Starting build..."

          make download -j"$(nproc)" V=s

          make -j"$(nproc)" V=s

      - name: "Verify build output"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          echo "===== Build output ====="

          find bin/targets/mediatek/filogic \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort

          echo
          echo "===== Verify sysupgrade image ====="

          SYSUPGRADE="$(
            find bin/targets/mediatek/filogic \
              -type f \
              -name '*netcore*n30*pro*sysupgrade*.bin' \
              | head -n 1
          )"

          if [ -z "${SYSUPGRADE}" ]; then
            SYSUPGRADE="$(
              find bin/targets/mediatek/filogic \
                -type f \
                -name '*n30*pro*sysupgrade*.bin' \
                | head -n 1
            )"
          fi

          if [ -z "${SYSUPGRADE}" ]; then
            echo "ERROR: N30 Pro sysupgrade image not found."

            find bin/targets/mediatek/filogic \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo "Sysupgrade image:"
          echo "${SYSUPGRADE}"

          ls -lh "${SYSUPGRADE}"

          echo
          echo "===== Verify factory image ====="

          find bin/targets/mediatek/filogic \
            -type f \
            -name '*n30*pro*factory*.bin' \
            -print \
            || true

          echo
          echo "===== Verify xHCI kernel modules were built ====="

          find build_dir \
            -type f \
            \( \
              -name 'xhci-hcd.ko' \
              -o \
              -name 'xhci-mtk-hcd.ko' \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Build output verification completed."

      - name: "Generate SHA256 checksums"
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          cd bin/targets/mediatek/filogic

          sha256sum \
            *.bin \
            *.itb \
            *.tar.gz \
            *.manifest \
            2>/dev/null \
            | tee sha256sums-n30pro.txt \
            || true

          echo
          echo "===== SHA256 ====="
          cat sha256sums-n30pro.txt

      - name: "Upload firmware artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-netcore-n30-pro
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*
          if-no-files-found: error
          retention-days: 14
