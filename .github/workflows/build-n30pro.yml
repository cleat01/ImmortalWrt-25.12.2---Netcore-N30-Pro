name: Build ImmortalWrt 25.12.2 Netcore N30 Pro


on:
  workflow_dispatch:


permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      - name: Install build environment
        shell: bash
        run: |
          set -e

          sudo bash -c \
          'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'



      - name: Clone ImmortalWrt 25.12.2
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch v25.12.2 \
            --single-branch \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt


          cd immortalwrt


          echo "ImmortalWrt version:"
          git describe --tags --always


          echo "Commit:"
          git rev-parse HEAD



      - name: Clone Netcore N30 Pro patch
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --single-branch \
            https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
            n30-patch



      - name: Check N30 support and apply patch if needed
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "Checking existing N30 Pro support"


          if find target/linux/mediatek -iname "*n30*" | grep -q .; then

              echo "N30 DTS already exists"

          else

              echo "Applying N30 Pro patch"


              bash ../n30-patch/scripts/apply-netcore-n30pro.sh \
              ../n30-patch

          fi



      - name: Show available N30 device profiles
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "Searching N30 profiles"


          grep "^define Device/" \
          target/linux/mediatek/image/filogic.mk \
          | grep -Ei "n30|nx30|netis"



      - name: Select N30 Pro device
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          DEVICE=""


          if grep -q \
          "^define Device/netis_nx30v2" \
          target/linux/mediatek/image/filogic.mk; then

              DEVICE="netis_nx30v2"


          elif grep -q \
          "^define Device/netcore_n30" \
          target/linux/mediatek/image/filogic.mk; then

              DEVICE="netcore_n30"


          elif grep -q \
          "^define Device/netcore_n30-pro" \
          target/linux/mediatek/image/filogic.mk; then

              DEVICE="netcore_n30-pro"

          fi



          if [ -z "$DEVICE" ]; then

              echo "ERROR: Cannot find Netcore N30 Pro profile"

              exit 1

          fi



          if echo "$DEVICE" | grep -qi "n60"; then

              echo "ERROR: Wrong device selected: $DEVICE"

              exit 1

          fi



          echo "Selected device:"
          echo "$DEVICE"



          echo "N30_DEVICE=$DEVICE" >> "$GITHUB_ENV"



      - name: Verify N30 DTS USB VBUS
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          DTS=$(find \
          target/linux/mediatek/dts \
          -iname "*n30*" \
          -o \
          -iname "*nx30*" \
          | grep ".dts" \
          | head -1)



          if [ -z "$DTS" ]; then

              echo "ERROR: N30 DTS not found"

              exit 1

          fi



          echo "Using DTS:"
          echo "$DTS"



          grep -Fq \
          'regulator-name = "usb-vbus";' \
          "$DTS"



          grep -Fq \
          'gpio = <&pio 23 GPIO_ACTIVE_HIGH>;' \
          "$DTS"



          grep -Fq \
          'regulator-boot-on;' \
          "$DTS"



          echo "USB VBUS verification passed"



      - name: Verify xHCI DTS
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          DTS=$(find \
          target/linux/mediatek/dts \
          -iname "*n30*" \
          -o \
          -iname "*nx30*" \
          | grep ".dts" \
          | head -1)



          grep -A15 \
          "&xhci" \
          "$DTS"



          grep -A15 \
          "&xhci" \
          "$DTS" \
          | grep -Fq \
          "vbus-supply = <&usb_vbus>;"



          echo "xHCI DTS verification passed"

      - name: Generate N30 Pro configuration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "Generating firmware configuration"


          rm -f .config



          echo "CONFIG_TARGET_mediatek=y" >> .config

          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config

          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_${N30_DEVICE}=y" >> .config



          echo "Selected target:"
          grep "CONFIG_TARGET_mediatek_filogic_DEVICE" .config



          echo "CONFIG_PACKAGE_luci=y" >> .config

          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config



          #
          # USB 3.0 / XHCI
          #

          echo "CONFIG_PACKAGE_kmod-usb3=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-xhci-hcd=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-xhci-mtk=y" >> .config



          #
          # USB Storage
          #

          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> .config

          echo "CONFIG_PACKAGE_block-mount=y" >> .config

          echo "CONFIG_PACKAGE_blockd=y" >> .config



          #
          # Filesystem
          #

          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config

          echo "CONFIG_PACKAGE_kmod-fs-vfat=y" >> .config

          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config



          #
          # USB 4G/5G modem
          #

          echo "CONFIG_PACKAGE_kmod-usb-net=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-serial=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-wdm=y" >> .config

          echo "CONFIG_PACKAGE_usb-modeswitch=y" >> .config

          echo "CONFIG_PACKAGE_uqmi=y" >> .config

          echo "CONFIG_PACKAGE_umbim=y" >> .config



          #
          # MWAN3 Load Balance
          #

          echo "CONFIG_PACKAGE_mwan3=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config



          #
          # Samba4
          #

          echo "CONFIG_PACKAGE_samba4-server=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config



          #
          # Network tools
          #

          echo "CONFIG_PACKAGE_curl=y" >> .config

          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config

          echo "CONFIG_PACKAGE_tcpdump=y" >> .config

          echo "CONFIG_PACKAGE_htop=y" >> .config



          make defconfig



          echo "Final target after defconfig:"

          grep "CONFIG_TARGET_mediatek_filogic_DEVICE" .config





      - name: Verify final target selection
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          TARGET=$(grep \
          "CONFIG_TARGET_mediatek_filogic_DEVICE" \
          .config)



          echo "$TARGET"



          if echo "$TARGET" | grep -qi "n60"; then

              echo "ERROR: N60 selected accidentally"

              exit 1

          fi



          if ! echo "$TARGET" | grep -Eqi "n30|nx30"; then

              echo "ERROR: Target is not N30 Pro"

              exit 1

          fi



          echo "N30 Pro target verified"





      - name: Verify required packages
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          grep -F \
          "CONFIG_PACKAGE_kmod-usb3=y" \
          .config


          grep -F \
          "CONFIG_PACKAGE_kmod-usb-xhci-mtk=y" \
          .config


          grep -F \
          "CONFIG_PACKAGE_mwan3=y" \
          .config


          grep -F \
          "CONFIG_PACKAGE_samba4-server=y" \
          .config



          echo "Package verification passed"





      - name: Inject custom IPK packages
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          mkdir -p \
          files/usr/share/custom-packages



          if [ -d ../custom_packages ]; then

              cp \
              ../custom_packages/*.ipk \
              files/usr/share/custom-packages/ \
              2>/dev/null \
              || true

          fi



          echo "Custom IPK injection completed"





      - name: Update feeds
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          ./scripts/feeds update -a


          ./scripts/feeds install -a





      - name: Download source packages
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          make download \
          -j$(nproc) \
          V=s
